<script id="data" type="application/json">[{"id": "F1127", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": null, "text": "ビタミンの欠乏症と過剰症に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["ビタミンA（レチノール）の過剰摂取は、頭蓋内圧亢進、催奇形性を引き起こすことがある。", "ビタミンD欠乏は、小児ではくる病、成人では骨軟化症の原因となる。", "ビタミンB₁欠乏は、壊血病の原因となる。", "ビタミンK欠乏は、夜盲症の原因となる。", "水溶性ビタミンは体内に蓄積されやすいため、過剰症が起こりやすい。"], "answer": ["1", "2"], "comment": "ビタミンの欠乏症と過剰症の知識は、栄養学と薬物療法の両面で重要です。\n1:正　ビタミンAは脂溶性ビタミンであり、過剰摂取（特にサプリメント等による）により、頭蓋内圧亢進（頭痛、嘔吐）、肝障害、催奇形性（妊婦の場合）を引き起こすことがあります。\n2:正　ビタミンD欠乏は、カルシウムとリンの吸収低下を引き起こし、小児ではくる病（骨の石灰化不全）、成人では骨軟化症の原因となります。\n3:誤　ビタミンB₁（チアミン）欠乏は脚気（末梢神経障害、心不全）やウェルニッケ脳症の原因です。壊血病はビタミンC欠乏で起こります。\n4:誤　ビタミンK欠乏は出血傾向（血液凝固因子の産生低下）の原因です。夜盲症はビタミンA欠乏で起こります。\n5:誤　水溶性ビタミン（B群、C）は一般に過剰分が尿中に排泄されるため、脂溶性ビタミン（A、D、E、K）に比べて過剰症は起こりにくいです。", "image": false}, "issues": ["section 未設定", "誤答3・4は欠乏症の名前の入れ替えで、F1271・F465・F466・F473と同じ知識点（ビタミン名と欠乏症の対応）", "誤答5は「蓄積されやすい↔されにくい」の単純反転で、語感で消去できる", "解説の書式が規定外（冒頭に前置き文、「1:正　」の半角コロン・句点なし、です・ます調）。「1：正。〜」形式に統一が必要"], "after": {"section": "理論", "text": "ビタミンの過剰摂取による健康障害と耐容上限量に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["ナイアシンの耐容上限量は、ニコチン酸とニコチンアミドで同じ値である。", "ビタミンDの過剰摂取は、高カルシウム血症を起こす。", "フィロキノン（ビタミンK1）の大量摂取は、乳児に溶血性貧血を起こす。", "ピリドキシンの大量摂取は、感覚性ニューロパチーを起こす。", "ビタミンB12には、末梢神経障害を根拠とする耐容上限量が設定されている。"], "answer": ["2", "4"], "comment": "1：誤。2025年版では、ナイアシンの耐容上限量はニコチンアミドとニコチン酸で別の値が示されている（18〜29歳男性でニコチンアミド300 mg/日、ニコチン酸80 mg/日）。ニコチン酸は少量でも皮膚の紅潮（フラッシング）を起こす。\n2：正。ビタミンDの過剰摂取では高カルシウム血症が起こり、腎臓や血管壁などへのカルシウム沈着により腎機能障害などを生じる。成人の耐容上限量は100 μg/日（2025年版）である。\n3：誤。フィロキノン（K1）やメナキノン（K2）では大量摂取による毒性は報告されておらず、ビタミンKに耐容上限量は設定されていない。乳児の溶血性貧血・高ビリルビン血症・核黄疸は合成品のメナジオン（K3）で起こる。\n4：正。サプリメント等によるピリドキシンの大量摂取で、四肢のしびれや痛みを伴う感覚性ニューロパチーが報告されており、ビタミンB6の耐容上限量はピリドキシン量として示されている。\n5：誤。ビタミンB12には耐容上限量が設定されていない。大量摂取で末梢神経障害（感覚性ニューロパチー）を起こすのはビタミンB6である。\nポイント：耐容上限量が設定されていないのは、脂溶性ではビタミンK、水溶性ではB1・B2・B12・パントテン酸・ビオチン・C。", "dropImage": false}, "summary": "欠乏症の対応（F465と重複）をやめ、過剰症と耐容上限量に論点を移した。攪乱肢はK1とK3、B6とB12、ニコチン酸とニコチンアミドといった似た物質の取り違えで作り、β-カロテンの注記（F234）・Kの上限の有無（F225）・葉酸の上限（F469）とは重ならないようにした。", "sources": ["https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf", "https://www.tyojyu.or.jp/net/kenkou-tyoju/eiyouso/vitamin-d.html", "https://lpi.oregonstate.edu/jp/mic/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3B6", "https://hfnet.nibn.go.jp/vitamin/detail181/", "https://hfnet.nibn.go.jp/vitamin/detail17/", "https://foocom.net/column/nutrepi/23113/"], "check": "合格"}, {"id": "F1271", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "merge_delete", "before": {"section": null, "text": "ビタミンの欠乏症に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ビタミンA欠乏により、壊血病が引き起こされる。", "ビタミンB1欠乏により、脚気やウェルニッケ脳症が引き起こされる。", "ビタミンC欠乏により、夜盲症が引き起こされる。", "ビタミンD欠乏により、ペラグラが引き起こされる。", "ナイアシン欠乏により、くる病が引き起こされる。"], "answer": ["2"], "comment": "ビタミンと欠乏症の対応は頻出テーマです。\n1:誤　ビタミンA欠乏では夜盲症、眼球乾燥症（角膜軟化症）が起こります。壊血病はビタミンC欠乏です。\n2:正　ビタミンB1（チアミン）はピルビン酸脱水素酵素やα-ケトグルタル酸脱水素酵素の補酵素として働きます。欠乏すると末梢神経障害（脚気）やウェルニッケ脳症（眼球運動障害、運動失調、意識障害）を引き起こします。\n3:誤　ビタミンC欠乏では壊血病（コラーゲン合成障害による出血傾向、歯肉出血等）が起こります。夜盲症はビタミンA欠乏です。\n4:誤　ビタミンD欠乏ではくる病（小児）や骨軟化症（成人）が起こります。ペラグラはナイアシン欠乏です。\n5:誤　ナイアシン欠乏ではペラグラ（皮膚炎、下痢、認知症の3D症状）が起こります。くる病はビタミンD欠乏です。", "image": false}, "issues": ["section 未設定", "F465（必須・B1→脚気）とF466・F1127・F473と同じ「ビタミン名と欠乏症の対応」を同じ角度で問う重複", "誤答4つがすべて名前の入れ替えで、国試の理論問題の水準に届かない", "解説の書式が規定外（冒頭に前置き文、「1:正　」の半角コロン・句点なし、です・ます調）。「1：正。〜」形式に統一が必要"], "summary": "削除。ビタミン名と欠乏症の対応は F465（必須）に集約。ウェルニッケ脳症の論点は F660（実践）で扱う。", "sources": []}, {"id": "F1273", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": null, "text": "脂溶性ビタミンに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ビタミンAは過剰摂取しても体内に蓄積しないため、過剰症は起こらない。", "ビタミンDは、皮膚で紫外線（UV-B）照射により7-デヒドロコレステロールから合成される。", "ビタミンEの主な機能は、血液凝固因子の合成促進である。", "ビタミンKは、抗酸化作用が主な機能である。", "脂溶性ビタミンは水溶性ビタミンよりも体内に蓄積しにくい。"], "answer": ["2"], "comment": "脂溶性ビタミン（A, D, E, K）の特徴は頻出です。\n1:誤　ビタミンAは脂溶性であり、過剰摂取すると肝臓に蓄積して過剰症（頭痛、嘔吐、皮膚の落屑、催奇形性等）を引き起こします。特に妊婦のレチノール過剰摂取に注意が必要です。\n2:正　皮膚に存在する7-デヒドロコレステロール（プロビタミンD3）が紫外線UV-B（280〜315 nm）の照射を受けてプレビタミンD3となり、体温でビタミンD3（コレカルシフェロール）に異性化されます。\n3:誤　血液凝固因子の合成に関与するのはビタミンKです。ビタミンEの主な機能は抗酸化作用（脂質過酸化の連鎖反応を停止）です。\n4:誤　抗酸化作用が主な機能なのはビタミンEです。ビタミンKの主な機能は血液凝固因子（II、VII、IX、X）のγ-カルボキシル化に必要な補因子としての役割です。\n5:誤　脂溶性ビタミンは水溶性ビタミンよりも体内（特に肝臓や脂肪組織）に蓄積しやすく、過剰症のリスクがあります。", "image": false}, "issues": ["section 未設定", "誤答1は「蓄積しないため、過剰症は起こらない」と絶対化表現（起こらない）を含み、知識なしで消去できる", "誤答5は単純反転。誤答3・4はE/Kの機能の入れ替えで素朴すぎる", "正答2（皮膚での7-デヒドロコレステロールからの合成）はF235・F468・F779と重複", "解説の書式が規定外（冒頭に前置き文、「1:正　」の半角コロン・句点なし、です・ます調）。「1：正。〜」形式に統一が必要"], "after": {"section": "理論", "text": "脂溶性ビタミンの吸収・輸送・貯蔵に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["小腸で吸収された脂溶性ビタミンは、主に門脈を経て肝臓に運ばれる。", "レチノールはトランスサイレチンに結合し、その複合体にRBPが結合して運ばれる。", "β-カロテンは、小腸上皮細胞で開裂されて2分子のレチノイン酸を生じる。", "レチノールは、肝星細胞にレチニルエステルとして貯蔵される。", "ビタミンEは、肝臓のα-トコフェロール輸送タンパク質により、γ-トコフェロールが優先的にVLDLへ組み込まれる。"], "answer": ["4"], "comment": "1：誤。脂溶性ビタミンは胆汁酸とミセルを形成して吸収され、小腸上皮細胞でキロミクロンに取り込まれてリンパ管から胸管を経て体循環に入り、その後肝臓に取り込まれる。門脈経由ではない。\n2：誤。レチノールに直接結合するのはレチノール結合タンパク質（RBP）であり、レチノール-RBP複合体がさらにトランスサイレチンと複合体を形成して血中を運ばれる。両者の役割が入れ替わっている。\n3：誤。β-カロテンは小腸上皮細胞でβ-カロテン15,15'-オキシゲナーゼ（BCO1）により開裂され、2分子のレチナールとなる。レチナールはレチノールに還元されてエステル化される。\n4：正。必要量を超えたビタミンAは、肝星細胞（伊東細胞）でLRATによりエステル化され、レチニルエステルとして貯蔵される。\n5：誤。肝臓のα-トコフェロール輸送タンパク質（α-TTP）はα-トコフェロールを選択的にVLDLへ組み込むため、血中・組織中のビタミンEの大部分はα-トコフェロールである。食事摂取基準もα-トコフェロール量で示されている。", "dropImage": false}, "summary": "ビタミンDの皮膚合成（F235・F779と重複）と、「過剰症は起こらない」などの絶対化・単純反転の誤答をやめ、A・Kの吸収・輸送・貯蔵の比較問題に作り直した。RBPとトランスサイレチンの入れ替え、レチナールとレチノイン酸の取り違えなど、中途半端な知識で選びやすい誤答にした。α-TTPの論点はF649に任せた。", "sources": ["https://plaza.umin.ac.jp/~one-health/5/5.1.pdf", "https://lpi.oregonstate.edu/jp/mic/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3A", "https://hfnet.nibn.go.jp/vitamin/detail17/"], "check": "小修正のうえ合格", "checkNote": "正答2は一意で、事実関係に誤りはない。；選択肢5は「ビタミンKがレチノール結合タンパク質と結合する」という内容で、タンパク質名だけで誤りとわかり、知識がなくても消去できる。；選択肢4の「直接」が誤答の目印になっている（絶対化に近い修飾）。"}, {"id": "F225", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "下表は脂溶性ビタミンの機能・欠乏症・過剰症をまとめたものである。表中の（A）と（B）に当てはまるものの正しい組合せはどれか。1つ選べ。", "choices": ["A：脚気　B：出血傾向", "A：壊血病　B：出血傾向", "A：くる病・骨軟化症　B：溶血性貧血", "A：くる病・骨軟化症　B：出血傾向", "A：くる病・骨軟化症　B：悪性貧血"], "answer": ["4"], "comment": "1：誤。脚気はビタミンB1（チアミン）の欠乏症であり、水溶性ビタミンである。\n2：誤。壊血病はビタミンC（水溶性ビタミン）の欠乏症である。\n3：誤。溶血性貧血はビタミンEの欠乏症である。（B）はビタミンKの欠乏症なので出血傾向が正しい。\n4：正。ビタミンD欠乏ではCa・P吸収低下により、小児ではくる病、成人では骨軟化症を生じる。ビタミンK欠乏では血液凝固因子の活性化が阻害され、出血傾向（新生児メレナ等）を生じる。\n5：誤。悪性貧血はビタミンB12の欠乏症であり、水溶性ビタミンである。", "image": true}, "issues": ["画像確認済み：表の（A）（B）はビタミンDとKの欠乏症。実質的には「Dはくる病、Kは出血傾向」の欠乏症対応のみを問い、F1271・F465・F466と論点が重なる", "選択肢3〜5はAが共通でBだけで正誤が決まり、組合せ形式が生きていない", "選択肢1・2のA（脚気・壊血病）は水溶性ビタミンの欠乏症で、表題（脂溶性）から即座に消去できる"], "after": {"section": "理論", "text": "次の表は、日本人の食事摂取基準（2025年版）で成人の脂溶性ビタミンに用いられている指標をまとめたものである。表中の（ア）〜（エ）に入る語句の正しい組合せはどれか。1つ選べ。\n\nビタミン｜摂取不足の回避を目的とする指標｜耐容上限量\nビタミンA｜（ア）｜設定あり\nビタミンD｜（イ）｜設定あり\nビタミンE｜目安量｜（ウ）\nビタミンK｜目安量｜（エ）", "choices": ["ア：推奨量　イ：推奨量　ウ：設定あり　エ：設定なし", "ア：目安量　イ：目安量　ウ：設定あり　エ：設定あり", "ア：推奨量　イ：目安量　ウ：設定なし　エ：設定あり", "ア：目安量　イ：推奨量　ウ：設定なし　エ：設定なし", "ア：推奨量　イ：目安量　ウ：設定あり　エ：設定なし"], "answer": ["5"], "comment": "1：誤。ビタミンDは推定平均必要量を算定する根拠が不十分なため、推奨量ではなく目安量が設定されている。\n2：誤。ビタミンAには推奨量が設定されている。また、ビタミンKには耐容上限量が設定されていない。\n3：誤。ビタミンEには耐容上限量が設定されている（α-トコフェロールについて算定）。ビタミンKには設定されていない。\n4：誤。ビタミンAは推奨量、ビタミンDは目安量であり、組合せが逆である。ビタミンEには耐容上限量が設定されている。\n5：正。ビタミンAは推定平均必要量・推奨量（18〜29歳男性850 μgRAE/日）と耐容上限量（2,700 μgRAE/日）、ビタミンDは目安量（9.0 μg/日）と耐容上限量（100 μg/日）、ビタミンEは目安量（同6.5 mg/日）と耐容上限量（同800 mg/日）が設定され、ビタミンKは目安量（150 μg/日）のみで耐容上限量は設定されていない。\nポイント：脂溶性ビタミンで推奨量があるのはAのみ。耐容上限量がないのはKのみ。", "dropImage": true}, "summary": "画像の表（DとKの欠乏症を当てる組合せ）は欠乏症の対応を問うだけで他問と重なり、選択肢3〜5はBだけで正誤が決まっていたため、図を使わない表読み取り問題に作り直した。食事摂取基準2025年版の指標（推奨量か目安量か、耐容上限量の有無）を4つの空欄で問い、解説に成人の値を示した。", "sources": ["https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf", "https://www.tyojyu.or.jp/net/kenkou-tyoju/eiyouso/vitamin-d.html"], "check": "小修正のうえ合格", "checkNote": "内容は2025年版と一致（Aは推奨量・UL、Dは目安量9.0 μg・UL 100 μg、Eは目安量・UL、Kは目安量のみ）。組合せは一意に決まる。；RUBRIC Cで画像付きとされている問題だが、表が本文中に文字で入っており、画像がなくても成立する。画像を残すと、表示内容が重複したり食い違ったりするおそれがある。；表の区切り「｜」がアプリでどう表示されるかは要確認。"}, {"id": "F226", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "水溶性ビタミンとその補酵素型または関連する代謝反応に関する記述のうち、誤っているのはどれか。1つ選べ。", "choices": ["ビタミンB1（チアミン）は、チアミンピロリン酸（TPP）として、ピルビン酸脱水素酵素の補酵素となる", "ビタミンB2（リボフラビン）は、FADとして、電子伝達系に関与する", "ナイアシンは、NAD⁺として、酸化還元反応の補酵素となる", "ビタミンB6は、ピリドキサールリン酸（PLP）として、アミノ基転移反応の補酵素となる", "葉酸は、テトラヒドロ葉酸として、脂肪酸のβ酸化に関与する"], "answer": ["5"], "comment": "1：正。ビタミンB1の活性型TPPは、ピルビン酸脱水素酵素やα-ケトグルタル酸脱水素酵素の補酵素として働く。欠乏すると脚気やWernicke脳症を生じる。\n2：正。ビタミンB2の活性型FAD（フラビンアデニンジヌクレオチド）は、電子伝達系や各種酸化還元酵素の補酵素として働く。\n3：正。ナイアシンの活性型NAD⁺/NADP⁺は、多くの酸化還元反応の補酵素として働く。欠乏するとペラグラ（皮膚炎・下痢・認知症）を生じる。\n4：正。ビタミンB6の活性型PLPは、アミノ基転移酵素（トランスアミナーゼ）や脱炭酸酵素の補酵素として働く。\n5：誤。葉酸（テトラヒドロ葉酸）は一炭素単位の転移反応に関与し、核酸合成（プリン・ピリミジン）に必要である。脂肪酸のβ酸化にはパントテン酸（CoA）が関与する。", "image": false}, "issues": ["誤答5（葉酸がβ酸化に関与）は素朴な取り違えで、補酵素名を知っていれば即答できる", "正答以外の4肢が教科書の定義文そのままで、補酵素名の想起問題にとどまる", "F474（B2→FAD）、F648（パントテン酸→CoA）、F508（B6→アミノ基転移）、F471選択肢4と同じ知識点を重ねて問う", "選択肢の文末に句点がない（他問と不統一）"], "after": {"section": "理論", "text": "水溶性ビタミンの補酵素型と、それが関与する酵素反応に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["チアミンピロリン酸は、トランスケトラーゼの補酵素としてペントースリン酸経路に関与する。", "ピリドキサールリン酸は、メチルマロニルCoAムターゼの補酵素として奇数鎖脂肪酸の代謝に関与する。", "ビオチンは、ピルビン酸カルボキシラーゼの補酵素としてカルボキシ化反応に関与する。", "補酵素A（CoA）は、リボフラビンを構成成分としてアシル基の転移反応に関与する。", "FADは、芳香族L-アミノ酸脱炭酸酵素の補酵素としてドーパミンの生成に関与する。"], "answer": ["1", "3"], "comment": "1：正。チアミンピロリン酸（TPP）は、ピルビン酸脱水素酵素・α-ケトグルタル酸脱水素酵素のほか、ペントースリン酸経路のトランスケトラーゼの補酵素である。赤血球トランスケトラーゼ活性はビタミンB1の栄養状態の指標に用いられる。\n2：誤。メチルマロニルCoAムターゼの補酵素は、ビタミンB12の補酵素型である5'-デオキシアデノシルコバラミンである。B12欠乏ではこの反応が障害され、メチルマロン酸が増加する。\n3：正。ビオチンは、ピルビン酸カルボキシラーゼ（糖新生）、アセチルCoAカルボキシラーゼ（脂肪酸合成）、プロピオニルCoAカルボキシラーゼなどのカルボキシ化反応の補酵素である。\n4：誤。CoAの構成成分はパントテン酸である。リボフラビン（ビタミンB2）はFMN・FADの構成成分である。\n5：誤。ドーパミンやセロトニンの生成に関わるアミノ酸の脱炭酸反応の補酵素は、ビタミンB6の補酵素型であるピリドキサールリン酸（PLP）である。", "dropImage": false}, "summary": "補酵素型の名前を問う定義文の問題（F474・F508・F648と重複）を、補酵素が働く具体的な酵素・反応を問う2つ選べに作り直した。誤答は補酵素の取り違え（PLPとB12、FADとPLP、リボフラビンとパントテン酸）で作り、削除予定のF648（パントテン酸とCoA）の論点を選択肢4に取り込んだ。", "sources": ["https://lpi.oregonstate.edu/jp/mic/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3/%E3%83%81%E3%82%A2%E3%83%9F%E3%83%B3", "https://lpi.oregonstate.edu/jp/mic/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3/%E3%83%93%E3%82%AA%E3%83%81%E3%83%B3", "https://lpi.oregonstate.edu/jp/mic/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3B12", "https://lpi.oregonstate.edu/jp/mic/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3/%E3%83%91%E3%83%B3%E3%83%88%E3%83%86%E3%83%B3%E9%85%B8", "https://lpi.oregonstate.edu/jp/mic/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3B6"], "check": "合格"}, {"id": "F231", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ビタミンB1の欠乏に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ビタミンB1欠乏による脚気では、主に中枢神経の脱髄が生じる", "Wernicke脳症は、ビタミンB1の過剰摂取によって引き起こされる", "脚気では末梢神経障害に加え、心不全（脚気心）を呈することがある", "ビタミンB1は脂溶性ビタミンであるため、体内に長期間蓄積される", "精白米を主食とする食生活では、ビタミンB1欠乏のリスクは低い"], "answer": ["3"], "comment": "1：誤。脚気では主に末梢神経障害（多発神経炎）が生じる。中枢神経の脱髄はビタミンB12欠乏で見られる亜急性連合性脊髄変性症の特徴である。\n2：誤。Wernicke脳症はビタミンB1（チアミン）の欠乏により生じ、過剰摂取が原因ではない。慢性アルコール依存症で好発するが、妊娠悪阻、長期の栄養不良・絶食、胃切除や肥満外科手術後、チアミンを含まない長期輸液など、アルコールと無関係な病態でも発症しうる。\n3：正。脚気は末梢神経障害（しびれ、筋力低下）に加え、重症例では心不全（脚気心：高拍出性心不全）を呈する。湿性脚気と呼ばれる。\n4：誤。ビタミンB1（チアミン）は水溶性ビタミンであり、体内蓄積量が少なく、継続的な摂取が必要である。\n5：誤。精白米はビタミンB1が除去されており（胚芽・糠層に多い）、精白米中心の食生活ではB1欠乏のリスクが高い。歴史的にも日本で脚気が多発した原因である。", "image": false}, "issues": ["誤答2（Wernicke脳症は過剰摂取で起こる）、誤答4（B1は脂溶性）は知識なしでも消去しやすい", "誤答5は「リスクは高い↔低い」の単純反転", "F660（ウェルニッケ脳症）・F465・F1271とB1の欠乏症の対応で重複"], "after": {"section": "理論", "text": "ビタミンB1（チアミン）の代謝と欠乏の機序に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ビタミンB1を含まない高カロリー輸液を続けると、乳酸アシドーシスを起こすことがある。", "α-ケトグルタル酸脱水素酵素は、チアミンピロリン酸ではなくPLPを補酵素とする。", "アノイリナーゼは、チアミンをリン酸化して活性型のチアミンピロリン酸に変換する。", "アリチアミンは、チアミンより脂溶性が低いため、消化管から吸収されにくい。", "チアミンはビタミンB12と同様に体内貯蔵量が多く、欠乏症は数年間現れにくい。"], "answer": ["1"], "comment": "1：正。チアミンピロリン酸はピルビン酸脱水素酵素の補酵素である。欠乏するとピルビン酸からアセチルCoAが生成できず、ピルビン酸が乳酸に変換されて蓄積し、乳酸アシドーシスを起こす。糖質を多く含む輸液ではB1の必要量が増すため、B1の併用が必要である。\n2：誤。α-ケトグルタル酸脱水素酵素もピルビン酸脱水素酵素と同様に、チアミンピロリン酸を補酵素とする。\n3：誤。アノイリナーゼ（チアミナーゼ）はチアミンを分解する酵素であり、生の淡水魚、貝類、ワラビなどの山菜に含まれる。\n4：誤。ニンニクのアリシンとチアミンが結合したアリチアミンは脂溶性で、アノイリナーゼに分解されにくく、消化管からの吸収がよい。これをもとにフルスルチアミンなどのB1誘導体が開発された。\n5：誤。チアミンの体内貯蔵量は約30 mgと少なく、摂取が途絶えると早期に欠乏する。体内貯蔵量が多く、欠乏症の発現に年単位を要するのはビタミンB12である。", "dropImage": false}, "summary": "脚気・ウェルニッケ脳症の症状の対応（F465・F660と重複）をやめ、B1欠乏の代謝上の機序を問う形にした。資料の空白だった高カロリー輸液施行時の乳酸アシドーシス（過去問108235）を正答とし、誤答はアノイリナーゼ・アリチアミン・貯蔵量（B12との比較）など食品化学・体内動態の知識で作った。トランスケトラーゼはF226で扱うため本問では使っていない。", "sources": ["https://lpi.oregonstate.edu/jp/mic/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3/%E3%83%81%E3%82%A2%E3%83%9F%E3%83%B3", "https://www.takanohara-ch.or.jp/wordpress/wp-content/uploads/2015/08/di201507.pdf", "https://www.jfrl.or.jp/storage/file/news_vol5_no30.pdf"], "check": "合格"}, {"id": "F232", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ビタミンC（アスコルビン酸）の欠乏による壊血病に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["壊血病では、コラーゲン合成の障害により出血傾向を呈する", "壊血病の症状として、歯肉出血、皮下出血、創傷治癒遅延がある", "ビタミンCはプロリンおよびリシンの脱炭酸反応の補因子として機能し、水酸化反応には別系統の酵素が関与する", "ビタミンCは体内で合成できるため、食事からの摂取は補助的である", "壊血病は主に脂溶性ビタミンの不足により発症する"], "answer": ["1", "2"], "comment": "1：正。ビタミンCはコラーゲン合成においてプロリン・リシンの水酸化に必要な補因子である。欠乏するとコラーゲンの構造が不安定になり、血管壁の脆弱化による出血傾向を呈する。\n2：正。壊血病の特徴的症状には、歯肉出血・腫脹、皮下出血（点状出血）、創傷治癒遅延、関節痛などがある。\n3：誤。ビタミンCはプロリンおよびリシンの水酸化酵素の補因子として機能する。この反応はコラーゲンの三重らせん構造形成に必須である。\n4：誤。ヒトはL-グロノラクトンオキシダーゼを欠損しているため、ビタミンCを体内で合成できない。食事からの摂取が必須である。\n5：誤。ビタミンCは水溶性ビタミンであり、壊血病は水溶性ビタミンの欠乏症である。", "image": false}, "issues": ["正答1と正答2はどちらも『壊血病の症状』で、同じ知識点が2つの正答に分かれている", "誤答5（壊血病は脂溶性ビタミン不足）は素朴すぎる", "F470・F751とビタミンC＝コラーゲン合成で重複"], "after": {"section": "理論", "text": "ビタミンC（L-アスコルビン酸）に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["ヒトはL-グロノラクトンオキシダーゼをもつため、グルコースから合成できる。", "酸化型のデヒドロアスコルビン酸は、生体内でアスコルビン酸に戻らない。", "プロリルヒドロキシラーゼの活性中心の鉄をFe²⁺の状態に保ち、水酸化反応を支える。", "成人の推奨量（2025年版）は、壊血病の予防に必要な最小量をもとに算定されている。", "食品中の非ヘム鉄（Fe³⁺）をFe²⁺に還元し、腸管からの吸収を促進する。"], "answer": ["3", "5"], "comment": "1：誤。ヒトは合成経路の最終段階の酵素であるL-グロノラクトンオキシダーゼを欠くため、ビタミンCを体内で合成できず、食事から摂取する必要がある。\n2：誤。デヒドロアスコルビン酸はグルコース輸送体を介して細胞に取り込まれ、細胞内でアスコルビン酸に還元される。このため食品表示基準では、還元型と酸化型の合計をビタミンC量とする。\n3：正。コラーゲン合成でプロリン・リシンを水酸化するプロリルヒドロキシラーゼ・リシルヒドロキシラーゼは活性中心にFe²⁺をもつ。ビタミンCはこの鉄を還元状態に保つために必要である。\n4：誤。ビタミンCの推定平均必要量・推奨量（成人100 mg/日）は、壊血病を予防する最小量ではなく、良好なビタミンC栄養状態を確実に維持する観点から算定されている。\n5：正。ビタミンCは非ヘム鉄（Fe³⁺）をFe²⁺に還元し、小腸からの吸収を高める。", "dropImage": false}, "summary": "正答2つがどちらも壊血病の症状で同じ知識点だったため、還元作用（水酸化酵素のFe²⁺維持、非ヘム鉄の吸収促進）を軸に作り直した。誤答は合成酵素、デヒドロアスコルビン酸の扱い、推奨量の算定根拠（2025年版）で作った。コラーゲン合成と壊血病の基本はF751、ビタミンEの再生はF649に任せた。", "sources": ["https://www.vitamin-society.jp/wp-content/uploads/2020/07/94-7topicsDr.ikeda_.pdf", "https://www.ejim.mhlw.go.jp/pro/overseas/c03/16.html", "https://ssl.mac.or.jp/memberregistration/trivia.php?id=79", "https://www.tyojyu.or.jp/net/kenkou-tyoju/eiyouso/vitamin-c.html", "https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf"], "check": "合格"}, {"id": "F233", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "merge_delete", "before": {"section": "理論", "text": "下表は主要ビタミン欠乏症と疾病の対応を示したものである。表中の（A）〜（D）に当てはまるものの正しい組合せはどれか。1つ選べ。", "choices": ["A：脚気・Wernicke脳症　B：巨赤芽球性貧血　C：歯肉出血・皮下出血　D：妊婦", "A：ペラグラ　B：鉄欠乏性貧血　C：骨軟化　D：高齢男性", "A：脚気・Wernicke脳症　B：巨赤芽球性貧血　C：歯肉出血・皮下出血　D：乳幼児", "A：壊血病　B：溶血性貧血　C：しびれ　D：妊婦", "A：脚気・Wernicke脳症　B：悪性貧血　C：歯肉出血・皮下出血　D：妊婦"], "answer": ["5"], "comment": "1：誤。ビタミンB12欠乏による貧血は巨赤芽球性貧血の一つだが、内因子欠乏によるものは特に悪性貧血と呼ばれる。胃全摘術後は内因子が産生されないため悪性貧血を生じる。\n2：誤。AはビタミンB1欠乏症であり脚気・Wernicke脳症である。ペラグラはナイアシン欠乏症である。\n3：誤。葉酸欠乏のリスク集団で最も重要なのは妊婦である（神経管閉鎖障害予防のため妊娠前から摂取推奨）。\n4：誤。壊血病はビタミンC欠乏症であり、Aの位置はビタミンB1の欄である。\n5：正。A：ビタミンB1欠乏→脚気・Wernicke脳症、B：ビタミンB12欠乏→悪性貧血（胃全摘後に好発）、C：ビタミンC欠乏→歯肉出血・皮下出血（壊血病の症状）、D：葉酸欠乏のリスク集団→妊婦（神経管閉鎖障害予防）。", "image": true}, "issues": ["画像確認済み：（B）はビタミンB12の欠乏症。選択肢1（巨赤芽球性貧血）と選択肢5（悪性貧血）の違いが（B）だけで、表にB12の欠乏症として両方とも当てはまり得るため正答が一意に決まらない", "解説は『胃全摘術後は内因子が産生されないため悪性貧血を生じる』とするが、悪性貧血は自己免疫性萎縮性胃炎による内因子分泌低下を指す用語で、胃全摘後のB12欠乏性貧血とは区別される。むしろ選択肢1の方が適切", "表の葉酸の『特徴的症状』欄に神経管閉鎖障害（胎児の疾患）が入っており、表として不正確", "F241・F249・F472（B12）、F237・F469（葉酸）と重複", "解説・正答：胃全摘後のビタミンB12欠乏による貧血を『悪性貧血』としている。悪性貧血は自己免疫性（萎縮性胃炎・抗内因子抗体）を病因とする疾患名であり、胃切除後の巨赤芽球性貧血とは区別される。このため正答5は不適切で、選択肢1と正答が並立する"], "summary": "削除。B12の論点は F241（理論）と F249（実践）、葉酸とリスク集団（妊婦）の論点は F469（実践）に集約する。", "sources": ["https://www.jstage.jst.go.jp/article/naika/103/7/103_1609/_article/-char/ja/"]}, {"id": "F234", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "polish", "before": {"section": "理論", "text": "ビタミンAの過剰摂取に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["β-カロテンの過剰摂取は、ビタミンA過剰症を引き起こす", "妊娠初期のビタミンA大量摂取は、胎児の催奇形性のリスクがある", "ビタミンA過剰症では、主に末梢神経障害が生じる", "ビタミンAは水溶性であるため、過剰分は速やかに尿中に排泄される", "レチノール活性当量（RAE）は、レチノールとビタミンDの合計で表される"], "answer": ["2"], "comment": "1：誤。β-カロテン（プロビタミンA）は必要量に応じて体内でレチノールに変換されるため、過剰摂取してもビタミンA過剰症を引き起こさない。ただし柑皮症（皮膚の黄色化）は生じうる。\n2：正。妊娠初期（特に妊娠3か月以内）のビタミンA（レチノール）大量摂取は催奇形性のリスクがある。妊婦にはレチノールとして1日上限量が設定されている。\n3：誤。ビタミンA過剰症の主症状は頭蓋内圧亢進（頭痛、嘔吐）、皮膚の剥離、肝障害、骨障害などである。末梢神経障害はビタミンB群欠乏で見られる。\n4：誤。ビタミンAは脂溶性ビタミンであり、肝臓に蓄積される。過剰分は容易に排泄されないため過剰症を生じやすい。\n5：誤。レチノール活性当量（RAE）はレチノールとプロビタミンAカロテノイド（β-カロテン等）の合計で算出される。ビタミンDは含まれない。", "image": false}, "issues": ["誤答4（ビタミンAは水溶性）と誤答5（RAEにビタミンDを含む）は素朴すぎて消去しやすい", "解説2の『妊婦にはレチノールとして1日上限量が設定されている』は書き方が不正確（耐容上限量は成人の値として示され、プロビタミンAカロテノイドを含まない、と書くべき）", "選択肢の文末に句点がない"], "after": {"section": "理論", "text": "ビタミンAの過剰摂取と日本人の食事摂取基準（2025年版）に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["β-カロテンを食品から多量に摂取すると、ビタミンA過剰症による頭蓋内圧亢進が起こる。", "妊婦に対する推奨量の付加量は、妊娠初期から設定されている。", "レチノール活性当量の算出では、β-カロテン6 μgをレチノール1 μgとして換算する。", "妊娠初期にレチノールを過剰に摂取すると、胎児の先天異常のリスクが高まる。", "ビタミンA過剰症では、ロドプシンの再合成が障害されて夜盲症が起こる。"], "answer": ["4"], "comment": "1：誤。β-カロテンなどのプロビタミンAは、体内のビタミンAが不足したときに必要な量だけがレチノールに変換されるため、食品からの多量摂取でビタミンA過剰症は起こらない。皮膚が黄色くなる柑皮症がみられることはある。\n2：誤。妊婦の付加量は妊娠後期にのみ設定されており（推奨量で＋80 μgRAE/日）、妊娠初期・中期には設定されていない。\n3：誤。β-カロテンは12 μgをレチノール1 μgとして換算する。レチノール活性当量（μgRAE）＝レチノール＋β-カロテン×1/12＋α-カロテン×1/24＋β-クリプトキサンチン×1/24＋その他のプロビタミンAカロテノイド×1/24。\n4：正。妊娠初期のレチノール（既成ビタミンA）の過剰摂取は、胎児の奇形の原因となる。なお、食事摂取基準（2025年版）の耐容上限量（成人2,700 μgRAE/日）は、プロビタミンAカロテノイドを含まない値として示されている。\n5：誤。ロドプシン（11-cis-レチナールとオプシンの複合体）の再合成障害による夜盲症は、ビタミンAの欠乏症である。過剰症の主な症状は頭蓋内圧亢進（頭痛、悪心・嘔吐）、皮膚の落屑、肝障害などである。", "dropImage": false}, "summary": "骨格（β-カロテンでは過剰症が起きない・妊娠初期の催奇形性）は残し、素朴だった誤答（Aは水溶性、RAEにDを含む）を、2025年版の知識で判別させる攪乱肢（妊婦付加量は後期のみ、β-カロテンの換算係数1/12、欠乏症と過剰症の取り違え）に差し替えました。耐容上限量の注記（プロビタミンAカロテノイドを含まない）は F1127 の誤答と重なるため選択肢にはせず、解説で触れるにとどめています。", "sources": ["https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf", "https://hfnet.nibn.go.jp/vitamin/detail171/", "https://www.dobun.co.jp/scbookdata/stofcj2025.pdf"], "check": "合格"}, {"id": "F235", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ビタミンDと骨代謝に関する記述のうち、誤っているのはどれか。1つ選べ。", "choices": ["ビタミンDは皮膚で紫外線（UVB）照射により7-デヒドロコレステロールから合成される", "活性型ビタミンD₃（カルシトリオール）は、肝臓で25位、腎臓で1α位が水酸化されて生成する", "ビタミンD欠乏では小腸からのカルシウム吸収が低下し、骨石灰化が障害される", "ビタミンD欠乏による骨疾患は、成人ではくる病、小児では骨軟化症と呼ばれる", "骨粗鬆症の予防には、カルシウムとビタミンDの十分な摂取が重要である"], "answer": ["4"], "comment": "1：正。皮膚に存在する7-デヒドロコレステロール（プロビタミンD₃）がUVB照射によりビタミンD₃（コレカルシフェロール）に変換される。\n2：正。ビタミンD₃は肝臓のCYP2R1等により25位が水酸化され25(OH)D₃となり、さらに腎臓のCYP27B1（1α-水酸化酵素）により1,25(OH)₂D₃（カルシトリオール：活性型）となる。\n3：正。活性型ビタミンDは小腸でのカルシウム結合タンパク質（カルバインジン）の発現を誘導し、Ca²⁺吸収を促進する。欠乏すると骨の石灰化が障害される。\n4：誤。逆である。小児ではくる病（骨端の成長障害、O脚・X脚）、成人では骨軟化症（骨痛、筋力低下）と呼ばれる。\n5：正。骨粗鬆症予防にはカルシウム（目安量：成人650〜800 mg/日）とビタミンD（目安量：8.5 μg/日）の十分な摂取に加え、適度な運動と日光浴が重要である。", "image": false}, "issues": ["正答4は『くる病と骨軟化症の入れ替え』で、知識の浅い学生でも気づきやすい", "肢1・2がF468・F779・F1273と同一の知識点（皮膚合成・肝臓25位/腎臓1α位）", "解説5の数値が古い・指標名が誤っている（下記）", "「誤っているのはどれか」形式で、国試の『正しいのはどれか』主体の文体と合わない", "解説5：ビタミンDの目安量を8.5 μg/日としているが、2025年版の成人の目安量は9.0 μg/日", "解説5：カルシウムを『目安量：成人650〜800 mg/日』としているが、カルシウムは推奨量で示される指標（2025年版、18〜29歳：男性800 mg/日、女性650 mg/日）"], "after": {"section": "理論", "text": "ビタミンDの代謝と調節に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["血中25-ヒドロキシビタミンD濃度は、ビタミンDの栄養状態の指標として用いられる。", "シイタケなどのきのこ類に含まれるビタミンDは、主にビタミンD3である。", "活性型ビタミンDは、細胞膜のGタンパク質共役型受容体を介して作用する。", "血中カルシウム濃度の低下は、腎臓での1α位の水酸化を抑制する。", "副甲状腺ホルモンは、腎臓での25-ヒドロキシビタミンDの1α位の水酸化を促進する。"], "answer": ["1", "5"], "comment": "1：正。血中半減期が長い25-ヒドロキシビタミンDは、体内のビタミンDレベルを反映する指標として用いられる。活性型の1,25-ジヒドロキシビタミンDは厳密に調節されているため、栄養状態の指標には適さない。\n2：誤。きのこ類に含まれるのは、エルゴステロールから紫外線により生じるビタミンD2（エルゴカルシフェロール）である。ビタミンD3（コレカルシフェロール）は魚類などの動物性食品に含まれ、皮膚でも7-デヒドロコレステロールから生成する。\n3：誤。活性型ビタミンD（1,25-ジヒドロキシビタミンD）は、核内受容体であるビタミンD受容体（VDR）に結合し、カルシウム吸収に関わるタンパク質などの遺伝子の転写を調節する。\n4：誤。血中カルシウム濃度が低下するとPTHの分泌が増え、腎臓での1α位の水酸化は促進される。その結果、腸管からのカルシウム吸収が高まる。\n5：正。副甲状腺ホルモン（PTH）は、腎臓の1α-水酸化酵素を活性化して活性型ビタミンDの生成を促進する。\nポイント：食事摂取基準（2025年版）では、ビタミンDは目安量（成人9.0 μg/日）と耐容上限量（成人100 μg/日）で示されている。", "dropImage": false}, "summary": "皮膚合成と活性化部位は F779、くる病は F752 と重なるため、本問は調節（PTH・血中カルシウム）と指標（25-ヒドロキシビタミンD）、D2/D3の供給源、受容体の種類を問う「2つ選べ」の機序問題に作り直しました。解説の数値は2025年版（目安量9.0 μg、耐容上限量100 μg）に更新し、カルシウムを「目安量」とした誤りは削除しました。", "sources": ["https://hfnet.nibn.go.jp/vitamin/detail221/", "https://www.ejim.mhlw.go.jp/pro/overseas/c03/17.html", "https://webview.isho.jp/journal/detail/abs/10.11477/mf.2425101217", "https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf"], "check": "合格"}, {"id": "F237", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "polish", "before": {"section": "理論", "text": "葉酸に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["葉酸の欠乏により、MCV 70 fL以下の小球性低色素性貧血が生じる", "葉酸は100℃の加熱調理30分で95%以上が残存する安定なビタミンである", "葉酸はプリンヌクレオチドやチミジル酸の合成において補因子としての役割を担うが、律速段階には関与しないとされる", "ビタミンB12欠乏時に葉酸5 mg/日を投与すると貧血と神経症状の両方が同時に改善し、潜在的なB12欠乏を早期発見できる", "神経管閉鎖障害の予防のため、妊娠前から葉酸400 μg/日の付加的摂取が推奨されている"], "answer": ["5"], "comment": "1：誤。葉酸の欠乏により生じるのは巨赤芽球性貧血（大球性貧血）であり、小球性低色素性貧血は鉄欠乏性貧血の特徴。\n2：誤。葉酸は水溶性で熱に不安定であり、加熱調理により大きく損失する。\n3：誤。葉酸はテトラヒドロ葉酸としてDNA合成（チミジル酸合成等）に必須である。\n4：誤。ビタミンB12欠乏時に大量の葉酸を投与すると貧血は改善するが、B12欠乏による神経症状がマスクされ進行する危険がある。「全く影響しない」は誤り。\n5：正。神経管閉鎖障害のリスク低減のため、妊娠を計画している女性に葉酸400 μg/日の付加的摂取が推奨されている。", "image": false}, "issues": ["解説4に『「全く影響しない」は誤り』とあり、選択肢4の文面と食い違っている（旧版の残骸）", "選択肢2の『100℃30分で95%以上残存』は根拠の取れない具体値で、裏取りできない記述を使わないという基準に合わない", "選択肢3『律速段階には関与しないとされる』は誤りの方向が曖昧で、正誤判断が知識に依存しない", "正答5の言い回しが2025年版の表現（通常の食品以外の食品に含まれる葉酸を400 μg/日）と異なる", "選択肢5・解説5：2025年版の注記は『妊娠を計画している女性、妊娠の可能性がある女性及び妊娠初期の妊婦は、胎児の神経管閉鎖障害のリスク低減のために、通常の食品以外の食品に含まれる葉酸を400 μg/日摂取することが望まれる』であり、『付加的摂取』や単に『葉酸』と書くと、食品中の葉酸でよいように読める"], "after": {"section": "理論", "text": "葉酸に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["葉酸欠乏では、血中メチルマロン酸濃度が上昇する。", "食品中の葉酸の多くは、モノグルタミン酸型として存在する。", "葉酸の吸収には、胃壁細胞から分泌される内因子が必要である。", "葉酸欠乏による巨赤芽球では、核の成熟が細胞質の成熟より先行する。", "葉酸は、補酵素としてチミジル酸の合成に関与する。"], "answer": ["5"], "comment": "1：誤。メチルマロン酸が上昇するのはビタミンB12欠乏である（メチルマロニルCoAムターゼの補酵素がB12のため）。葉酸欠乏ではホモシステインは上昇するが、メチルマロン酸は上昇しないため、両者の鑑別に用いられる。\n2：誤。食品中の葉酸の多くはポリグルタミン酸型であり、消化管でモノグルタミン酸型に分解されてから小腸で吸収される。サプリメントなどに用いられる葉酸（プテロイルモノグルタミン酸）がモノグルタミン酸型である。\n3：誤。内因子を必要とするのはビタミンB12の吸収である。\n4：誤。DNA合成の障害により核の成熟が遅れる一方、細胞質の成熟はほぼ正常に進むため、核と細胞質の成熟に解離が生じて細胞が大きくなる。\n5：正。チミジル酸合成酵素は、5,10-メチレンテトラヒドロ葉酸を補酵素としてdUMPからdTMPを生成する。葉酸が欠乏するとDNA合成が障害され、巨赤芽球性貧血が生じる。", "dropImage": false}, "summary": "妊娠前の葉酸摂取は F469（実践）、B12欠乏時の葉酸投与のマスキングは F249（実践）で扱うため、本問は機序（チミジル酸合成）を正答とし、B12との取り違え（メチルマロン酸・内因子）や食品中の形態（ポリグルタミン酸型）を攪乱肢にしました。裏取りできない数値（100℃30分で95%残存）と、解説4の旧版の残骸を削除しています。", "sources": ["https://hfnet.nibn.go.jp/vitamin/detail652/", "https://www.city.fukuoka.med.or.jp/kensa/ensinbunri/enshin_44_x.pdf", "https://ja.wikipedia.org/wiki/%E5%B7%A8%E8%B5%A4%E8%8A%BD%E7%90%83", "https://www.tokyokita-jadecom.jp/resident/rollcabbage/tips/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3b12%E6%AC%A0%E4%B9%8F%E3%81%A8%E8%91%89%E9%85%B8%E6%AC%A0%E4%B9%8F/"], "check": "合格"}, {"id": "F239", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "polish", "before": {"section": "理論", "text": "ナイアシン（ニコチン酸・ニコチン酸アミド）に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ペラグラの3D症状は、皮膚炎（Dermatitis）、下痢（Diarrhea）、認知症（Dementia）である", "ナイアシンは必須アミノ酸メチオニンから肝臓で合成され、トリプトファンからの合成経路は副次的とされる", "ナイアシン欠乏症は、玄米を主食とする地域で多発する一方、トウモロコシ主食地域では稀とされる", "ナイアシンの活性型はフラビンアデニンジヌクレオチド（FAD）およびフラビンモノヌクレオチド（FMN）である", "ペラグラは脂溶性ビタミンであるビタミンA・Dの複合欠乏により発症するとされる"], "answer": ["1"], "comment": "1：正。ペラグラの3D症状は、Dermatitis（日光曝露部の対称性皮膚炎）、Diarrhea（下痢）、Dementia（認知症）である。重症例では死（Death）に至り、4Dとも呼ばれる。\n2：誤。ナイアシンは必須アミノ酸のトリプトファンから体内で合成される（トリプトファン60 mg → ナイアシン1 mg相当）。このためナイアシン当量（NE）で評価される。\n3：誤。ペラグラはトウモロコシを主食とする地域で多発する。トウモロコシはトリプトファン含量が低く、またナイアシンが結合型で利用されにくいためである。\n4：誤。ナイアシンの活性型はNAD⁺（ニコチンアミドアデニンジヌクレオチド）およびNADP⁺である。FADはビタミンB2（リボフラビン）の活性型である。\n5：誤。ナイアシンは水溶性ビタミンである。", "image": false}, "issues": ["骨格は良い（肢2のメチオニン/トリプトファン、肢3の玄米/トウモロコシは知識を要する攪乱肢）", "誤答5（ペラグラはA・Dの複合欠乏）は素朴すぎる", "F471とほぼ同一の論点（3D、トリプトファン、FAD/NAD）で重複", "選択肢の文末に句点がない"], "after": {"section": "理論", "text": "ナイアシン（ニコチン酸・ニコチンアミド）に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ナイアシンは、体内では主に必須アミノ酸のメチオニンから生合成される。", "ペラグラの主な症状は、皮膚炎、下痢および認知症である。", "ペラグラは、歴史的に玄米を主食とする地域で多発した。", "ナイアシンは、FADの構成成分として酸化還元反応に関与する。", "カルチノイド症候群では、トリプトファンからのナイアシン生成が増加する。"], "answer": ["2"], "comment": "1：誤。ナイアシンは必須アミノ酸のトリプトファンから体内で生合成される。食事摂取基準（2025年版）では、ナイアシン当量（mgNE）＝ナイアシン＋1/60トリプトファンとして示される。\n2：正。ペラグラは皮膚炎（Dermatitis：日光にさらされる部位に左右対称に生じる）、下痢（Diarrhea）、認知症（Dementia）を主徴とし、3Dと呼ばれる。\n3：誤。ペラグラはトウモロコシを主食とする地域で多発した。トウモロコシはトリプトファン含量が少なく、含まれるナイアシンも結合型でアルカリ処理をしないと利用されにくい。\n4：誤。ナイアシンはNAD⁺およびNADP⁺の構成成分である。FADとFMNはビタミンB2（リボフラビン）から生成する。\n5：誤。カルチノイド症候群では、腫瘍がトリプトファンを大量にセロトニン合成に用いるため、ナイアシンの生成が減少し、ペラグラを起こすことがある。", "dropImage": false}, "summary": "骨格（3D、メチオニン/トリプトファン、玄米/トウモロコシ、FAD/NAD）は残し、素朴すぎた誤答（ペラグラはA・Dの複合欠乏）を、トリプトファン代謝の理解を問うカルチノイド症候群の肢に差し替えました。イソニアジドは F466（医薬品とビタミン）と重なるため使っていません。文末をそろえ、「とされる」などのあいまいな表現を除きました。", "sources": ["https://www.msdmanuals.com/ja-jp/home/11-%E6%A0%84%E9%A4%8A%E9%9A%9C%E5%AE%B3/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3/%E3%83%8A%E3%82%A4%E3%82%A2%E3%82%B7%E3%83%B3%E6%AC%A0%E4%B9%8F%E7%97%87", "https://ja.wikipedia.org/wiki/%E3%83%9A%E3%83%A9%E3%82%B0%E3%83%A9", "https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf"], "check": "合格"}, {"id": "F240", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "polish", "before": {"section": "理論", "text": "ビタミンKと血液凝固に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["ビタミンKは、血液凝固因子（II、VII、IX、X）のグルタミン酸残基のγ-カルボキシル化に必要である", "新生児ビタミンK欠乏性出血症の予防として、出生後にビタミンK₂シロップを投与する", "ワルファリンはビタミンKの作用を増強することで抗凝固作用を示す", "ビタミンKは腸内細菌によっては合成されない", "ビタミンK₁（フィロキノン）は主に動物性食品に含まれる"], "answer": ["1", "2"], "comment": "1：正。ビタミンKはγ-グルタミルカルボキシラーゼの補因子として、凝固因子II（プロトロンビン）、VII、IX、Xのグルタミン酸残基をγ-カルボキシグルタミン酸（Gla）に変換する。GlaはCa²⁺結合能を持ち、凝固反応に必須である。\n2：正。新生児はビタミンK貯蔵が少なく、腸内細菌叢が未発達であるため、ビタミンK欠乏性出血症（新生児メレナ、頭蓋内出血）のリスクがある。予防としてビタミンK₂シロップを出生時・生後1週間・生後1か月に投与する。\n3：誤。ワルファリンはビタミンKエポキシド還元酵素（VKORC1）を阻害し、ビタミンKの再生を妨げることで抗凝固作用を示す。ビタミンKの作用を「拮抗」する。\n4：誤。ビタミンK₂（メナキノン）は腸内細菌（大腸菌、バクテロイデス等）により合成される。\n5：誤。ビタミンK₁（フィロキノン）は緑黄色野菜（ほうれん草、ブロッコリー等）に多く含まれる植物性ビタミンKである。動物性食品に多いのはK₂（メナキノン）である。", "image": false}, "issues": ["解説2の予防投与法（出生時・生後1週間・生後1か月の3回）が古い。2021年の学会提言で3か月法（生後3か月まで週1回、計13回）が推奨に変わった", "誤答4『腸内細菌によっては合成されない』は否定の絶対化表現に近く、知識なしで疑える", "誤答3（ワルファリンが作用を増強）は単純反転", "F467・F509・F780とビタミンK・新生児・腸内細菌で重複", "解説2：新生児のビタミンK2シロップ投与を『出生時・生後1週間・生後1か月』の3回法としているが、日本小児科学会等の2021年11月の提言では、哺乳確立時、生後1週（または産科退院時）、その後生後3か月まで週1回の3か月法が推奨されている"], "after": {"section": "理論", "text": "ビタミンKの作用と血液凝固に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["納豆に多く含まれるビタミンKは、主にフィロキノンである。", "ビタミンKは、凝固因子のグルタミン酸残基のγ-カルボキシ化に必要である。", "ワルファリンは、ビタミンKエポキシド還元酵素を阻害する。", "オステオカルシンは、ビタミンKに依存せずにCa²⁺結合能を獲得する。", "PIVKA-IIは、γ-カルボキシ化が過剰に進んだプロトロンビンである。"], "answer": ["2", "3"], "comment": "1：誤。納豆には納豆菌が産生するメナキノン-7（ビタミンK2）が多く含まれる。フィロキノン（ビタミンK1）は緑黄色野菜や海藻に多い。\n2：正。ビタミンKはγ-グルタミルカルボキシラーゼの補因子として、凝固因子II、VII、IX、Xのグルタミン酸（Glu）残基をγ-カルボキシグルタミン酸（Gla）残基に変換する。Gla残基はCa²⁺を介してリン脂質膜に結合するのに必要である。\n3：正。ワルファリンはビタミンKエポキシド還元酵素（VKORC1）を阻害し、ビタミンKサイクルでの還元型ビタミンKの再生を妨げて、Gla化された凝固因子の生成を抑える。\n4：誤。骨のオステオカルシンもビタミンK依存的にGla化されてCa²⁺結合能を得る。Gla化が不十分なオステオカルシンの血中濃度が高いと、骨折リスクが高いことが報告されている。\n5：誤。PIVKA-IIは、ビタミンKの欠乏やワルファリンの作用によりγ-カルボキシ化が不十分なまま産生されたプロトロンビンである。", "dropImage": false}, "summary": "新生児の予防投与は F509（実践）に移すため本問から外し、γ-カルボキシ化とワルファリン（VKORC1）の機序に絞りました。単純反転の誤答（ワルファリンが作用を増強）と絶対化に近い誤答（腸内細菌では合成されない）を、メナキノン-7とフィロキノンの取り違え、オステオカルシン、PIVKA-IIの意味を問う肢に替えています。旧解説の3回法は削除しました（F509では2021年提言の3か月法を使うこと）。", "sources": ["https://jsth.medical-words.jp/words/word-360/", "https://jsth.medical-words.jp/words/word-78/", "https://bukai.pharm.or.jp/bukai_kanei/topics/topics12.html", "https://www.jpeds.or.jp/modules/guidelines/index.php?content_id=134"], "check": "合格"}, {"id": "F241", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ビタミンB12欠乏に関する記述のうち、誤っているのはどれか。1つ選べ。", "choices": ["ビタミンB12の吸収には、胃壁細胞から分泌される内因子（Castle因子）が必要である", "胃全摘術後は、内因子欠乏によりビタミンB12の吸収障害が生じる", "ビタミンB12欠乏では、巨赤芽球性貧血（大球性貧血）を呈する", "ビタミンB12欠乏による神経障害は、亜急性連合性脊髄変性症と呼ばれる", "ビタミンB12は植物性食品に広く含まれるため、菜食主義者は欠乏しにくい"], "answer": ["5"], "comment": "1：正。ビタミンB12は胃壁細胞から分泌される内因子（intrinsic factor）と結合し、回腸末端のキュビリン受容体を介して吸収される。\n2：正。胃全摘術後は内因子が産生されなくなるため、ビタミンB12の吸収障害が生じ、数年後に悪性貧血（pernicious anemia）を発症する。\n3：正。ビタミンB12欠乏ではDNA合成が障害され、骨髄で巨赤芽球が出現し、大球性（高色素性）貧血を呈する。MCV > 100 fLとなる。\n4：正。ビタミンB12欠乏による神経障害は亜急性連合性脊髄変性症（SACD）と呼ばれ、脊髄の後索・側索の脱髄が生じる。深部感覚障害、歩行障害を呈する。\n5：誤。ビタミンB12は動物性食品（肉、魚、卵、乳製品）にほぼ限定して含まれ、植物性食品にはほとんど含まれない。厳格な菜食主義者（ビーガン）はB12欠乏のリスクが高い。", "image": false}, "issues": ["「誤っているのはどれか」形式で、誤答（正答）5が『植物性食品に広く含まれる』という単純な誤りで、知識が浅くても選べる", "解説2で胃全摘後のB12欠乏を『悪性貧血』としている（用語の誤用）", "F472・F249・F233・F762とB12で重複", "解説2：胃全摘術後のビタミンB12吸収障害で『悪性貧血を発症する』としているが、悪性貧血は自己免疫性萎縮性胃炎を病因とする疾患名で、胃切除後のB12欠乏性（巨赤芽球性）貧血とは区別される"], "after": {"section": "理論", "text": "ビタミンB12の吸収・輸送と代謝に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["ビタミンB12の吸収に必要な内因子は、胃の主細胞から分泌される。", "食品中のビタミンB12は、胃で遊離した後、唾液由来のハプトコリンと結合する。", "血中のビタミンB12は、主にトランスフェリンと結合して組織へ運ばれる。", "ビタミンB12は、ホモシステインからメチオニンを生成する反応の補酵素である。", "ビタミンB12は、メチルマロニルCoAをプロピオニルCoAに変換する反応の補酵素である。"], "answer": ["2", "4"], "comment": "1：誤。内因子は胃の壁細胞から分泌される（主細胞が分泌するのはペプシノーゲン）。内因子と結合したビタミンB12は、回腸末端で受容体を介して吸収される。\n2：正。食品中のビタミンB12は胃酸とペプシンによりタンパク質から遊離し、唾液由来のハプトコリンと結合する。十二指腸でハプトコリンが分解されると、内因子と結合する。\n3：誤。吸収されたビタミンB12は、血中でトランスコバラミンと結合して組織へ運ばれる。トランスフェリンは鉄の輸送タンパク質である。\n4：正。ビタミンB12（メチルコバラミン）は、メチオニン合成酵素の補酵素として、5-メチルテトラヒドロ葉酸のメチル基をホモシステインに渡しメチオニンを生成する。欠乏するとホモシステインが増加し、テトラヒドロ葉酸の再生も滞る。\n5：誤。ビタミンB12（アデノシルコバラミン）は、メチルマロニルCoAムターゼの補酵素としてメチルマロニルCoAをスクシニルCoAに変換する。欠乏するとメチルマロン酸が増加する。", "dropImage": false}, "summary": "「誤っているのはどれか」で正答が素朴（植物性食品に広く含まれる）だったため、吸収経路（ハプトコリン・壁細胞・トランスコバラミン）と補酵素としての反応を問う「2つ選べ」に作り直しました。似た名前の取り違え（主細胞/壁細胞、トランスフェリン/トランスコバラミン、スクシニルCoA/プロピオニルCoA）で攪乱肢を作り、F472の論点もここに統合しています。胃全摘後の欠乏を「悪性貧血」とした誤用は削除しました。", "sources": ["https://www.ejim.mhlw.go.jp/pro/overseas/c03/14.html", "https://hfnet.nibn.go.jp/vitamin/detail177/", "https://www.city.fukuoka.med.or.jp/kensa/ensinbunri/enshin_44_x.pdf"], "check": "合格"}, {"id": "F249", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "実践", "text": "68歳男性。6年前に胃がんで胃全摘術を受けた。最近、倦怠感と舌のヒリヒリ感を訴えて受診した。下表に血液検査結果を示す。この患者に最も考えられる疾患と、その原因となる栄養素の正しい組合せはどれか。1つ選べ。", "choices": ["鉄欠乏性貧血 — 鉄", "巨赤芽球性貧血 — ビタミンB12", "溶血性貧血 — ビタミンE", "巨赤芽球性貧血 — 葉酸", "再生不良性貧血 — ビタミンB6"], "answer": ["2"], "comment": "1：誤。鉄欠乏性貧血ではMCVが低下する（小球性貧血）。本症例ではMCV 115 fLと大球性であり、鉄欠乏性貧血には合致しない。\n2：正。MCV 115 fL（大球性貧血）、血清ビタミンB12低値（82 pg/mL）、LDH高値（無効造血による）、胃全摘術後6年の経過から、内因子欠乏によるビタミンB12吸収障害に基づく巨赤芽球性貧血（悪性貧血）と診断される。舌炎（Hunter舌炎）も特徴的所見である。\n3：誤。ビタミンE欠乏による溶血性貧血では検査所見が異なる（間接ビリルビン上昇、ハプトグロビン低下等）。\n4：誤。葉酸でも巨赤芽球性貧血を生じるが、本症例では血清葉酸値は正常範囲内（8.5 ng/mL）であり、ビタミンB12が低値である。胃全摘後の病歴からもB12欠乏が原因である。\n5：誤。再生不良性貧血は汎血球減少を呈し、本症例の検査所見とは異なる。", "image": true}, "issues": ["画像確認済み：Hb 8.2、MCV 115、血清B12 82 pg/mL低値、葉酸正常、LDH高値、網状赤血球低値。表と正答は整合している", "過去問107236（68歳男性・6年前に胃全摘・大球性貧血・欠乏ビタミンを問う）とほぼ同じ設定・同じ問いで、予想問題として新規性がない", "解説2で胃全摘後の病態を『悪性貧血』と診断している（用語の誤用）", "F241・F233とB12・胃全摘で重複", "解説2：胃全摘術後6年の内因子欠乏によるB12欠乏を『巨赤芽球性貧血（悪性貧血）と診断される』としているが、悪性貧血は自己免疫性の疾患名で、胃切除後のB12欠乏性貧血とは区別される"], "after": {"section": "実践", "text": "74歳男性。2型糖尿病のため10年以上前からメトホルミン塩酸塩を服用している。胃の手術歴はなく、飲酒は機会飲酒程度である。数か月前から両足先のしびれとふらつき、舌の痛みを自覚し、受診した。血液検査の結果は以下のとおりであった。（検査値）Hb 10.2 g/dL、MCV 114 fL、血清ビタミンB12 120 pg/mL（基準値 180〜914 pg/mL）、血清葉酸 9.6 ng/mL（基準値 4.0 ng/mL以上）、血漿総ホモシステイン 32 nmol/mL（基準値 5〜15 nmol/mL）。この患者の病態と対応に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["メトホルミンの長期服用によるビタミンB12の吸収低下が考えられる。", "ビタミンB12は、高用量であれば経口投与でも補充できる。", "葉酸を補充すれば、貧血とともに足のしびれも改善すると考えられる。", "ホモシステインの高値は、主に葉酸の不足によるものと考えられる。", "MCVの値から、鉄の不足による貧血と考えられる。"], "answer": ["1", "2"], "comment": "1：正。メトホルミンの長期服用はビタミンB12の吸収を低下させ、血清B12濃度を下げることが知られている。本症例は胃の手術歴がなく、大球性貧血と血清B12低値を示しており、この機序が考えられる。\n2：正。内因子を介さなくても、高用量のビタミンB12は受動拡散によりおよそ1%が吸収される。高用量（1,000〜2,000 μg）の経口投与で筋肉内投与と同等に血清値が回復したとの報告がある。\n3：誤。ビタミンB12欠乏に葉酸だけを補充すると、貧血は改善しても神経障害は改善せず、進行するおそれがある。B12の補充が必要である。\n4：誤。血清葉酸は基準値内であり、血清B12が低値である。B12はメチオニン合成酵素の補酵素であるため、B12欠乏でもホモシステインが上昇する。\n5：誤。MCV 114 fLは大球性貧血を示す。鉄欠乏性貧血はMCVが低下する小球性貧血である。", "dropImage": true}, "summary": "胃全摘後の大球性貧血という設定は過去問107236とほぼ同じだったため、メトホルミン長期服用者のB12欠乏に設定を変え、検査値（基準値付き）を問題文中に記載して図を不要にしました（drop_image: true）。疾患名を当てる1つ選べから、葉酸単独補充の危険（マスキング）、ホモシステイン高値の解釈、経口補充の可否を判断させる「2つ選べ」の実践問題にしています。「悪性貧血」の誤用も解消しました。", "sources": ["https://www.ejim.mhlw.go.jp/pro/overseas/c03/14.html", "https://test-directory.srl.info/akiruno/test/detail/000260200", "https://data.medience.co.jp/guide/icd10-e72_1_3.html", "https://www.tokyokita-jadecom.jp/resident/rollcabbage/tips/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3b12%E6%AC%A0%E4%B9%8F%E3%81%A8%E8%91%89%E9%85%B8%E6%AC%A0%E4%B9%8F/"], "check": "合格"}, {"id": "F465", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "keep", "before": {"section": "必須", "text": "ビタミンB1の欠乏症はどれか。1つ選べ。", "choices": ["壊血病", "ペラグラ", "脚気", "くる病", "夜盲症"], "answer": ["3"], "comment": "1：誤。壊血病はビタミンCの欠乏症である。\n2：誤。ペラグラはナイアシンの欠乏症である。\n3：正。脚気はビタミンB1（チアミン）の欠乏症であり、末梢神経障害、心臓障害、浮腫などを主症状とする。\n4：誤。くる病はビタミンDの欠乏症（小児）である。\n5：誤。夜盲症はビタミンAの欠乏症である。", "image": false}, "issues": ["必須の基本問題として妥当。選択肢は欠乏症名で揃っており、過去問111018（ウェルニッケ脳症→B1）と同水準"], "after": {"section": "必須", "text": "ビタミンB1の欠乏症はどれか。1つ選べ。", "choices": ["壊血病", "ペラグラ", "脚気", "くる病", "夜盲症"], "answer": ["3"], "comment": "1：誤。壊血病はビタミンCの欠乏症である。\n2：誤。ペラグラはナイアシンの欠乏症である。\n3：正。脚気はビタミンB1（チアミン）の欠乏症であり、末梢神経障害、心不全（脚気心）、浮腫などを主症状とする。B1欠乏ではウェルニッケ脳症も起こる。\n4：誤。くる病はビタミンDの欠乏症（小児）である。成人では骨軟化症となる。\n5：誤。夜盲症はビタミンAの欠乏症である。", "dropImage": false}, "summary": "必須の基本問題として妥当なため、問題文・選択肢は変更していません。解説に脚気心・ウェルニッケ脳症・骨軟化症を短く補っただけです。", "sources": [], "check": "合格"}, {"id": "F466", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ビタミンとその欠乏症の組合せとして、正しいのはどれか。1つ選べ。", "choices": ["ビタミンA ── くる病", "ビタミンE ── 溶血性貧血", "ビタミンD ── 夜盲症", "ビタミンK ── 壊血病", "ナイアシン ── 脚気"], "answer": ["2"], "comment": "1：誤。くる病はビタミンDの欠乏症である。ビタミンAの欠乏症は夜盲症や皮膚・粘膜の乾燥である。\n2：正。ビタミンEの欠乏症には溶血性貧血がある。ビタミンEは抗酸化作用で赤血球膜を保護しており、不足すると赤血球膜が酸化障害を受けて溶血する。\n3：誤。夜盲症はビタミンAの欠乏症である。ビタミンDの欠乏症はくる病（小児）・骨軟化症（成人）である。\n4：誤。壊血病はビタミンCの欠乏症である。ビタミンKの欠乏症は出血傾向や新生児ビタミンK欠乏性出血である。\n5：誤。脚気はビタミンB1の欠乏症である。ナイアシンの欠乏症はペラグラである。", "image": false}, "issues": ["F1271・F465・F473・F1127と同じ『ビタミン名と欠乏症の対応』の重複", "誤答4つがすべて名前の入れ替え"], "after": {"section": "理論", "text": "医薬品とビタミンの関係に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["イソニアジドの長期服用により、ビタミンB6の欠乏による末梢神経障害が起こることがある。", "メトトレキサートによる骨髄抑制などの毒性の軽減には、ビタミンB12製剤が用いられる。", "フェニトインの長期服用は、ビタミンDの不活性化を促進して高カルシウム血症を起こすことがある。", "レボドパ単剤の服用中は、その作用を補うためにピリドキシンの併用が勧められる。", "抗菌薬の長期投与により腸内細菌叢が乱れると、ビタミンKの欠乏による出血傾向が起こることがある。"], "answer": ["1", "5"], "comment": "1：正。イソニアジドはピリドキサール（ピリドキサールリン酸）とヒドラゾンを形成して尿中排泄を増やすなどして、ビタミンB6不足の状態をつくり、末梢神経障害を起こす。予防のためビタミンB6製剤を併用することが多い。\n2：誤。メトトレキサートはジヒドロ葉酸還元酵素を阻害する葉酸拮抗薬であり、毒性の軽減（救援療法）には活性型葉酸であるホリナートカルシウム（ロイコボリン）が用いられる。\n3：誤。フェニトインは肝臓の薬物代謝酵素を誘導してビタミンDの不活性化を促進するため、長期服用により低カルシウム血症や、くる病・骨軟化症を起こすことがある。高カルシウム血症ではない。\n4：誤。ピリドキシンはドパ脱炭酸酵素の補酵素であり、末梢でのレボドパの脱炭酸を促進して脳へ届く量を減らすため、レボドパ単剤の作用を減弱させる（併用注意）。\n5：正。ビタミンK2（メナキノン類）の一部は腸内細菌によって供給される。抗菌薬の長期投与で腸内細菌叢が乱れるとビタミンK欠乏となり、プロトロンビン時間の延長や出血傾向が起こることがある。\nポイント：ビタミンの欠乏や作用の変化は、薬物の作用機序（酵素阻害・酵素誘導・補酵素との結合）から説明できる。", "dropImage": false}, "summary": "「ビタミン名と欠乏症の対応」はF465と重複していたため、抜けていた「医薬品とビタミンの関係」を問う理論・2つ選べの問題に作り替えました。メトホルミンとB12はF249、ワルファリンはF240・F467で扱うため避け、イソニアジド（B6）・抗菌薬（K）を正答に、メトトレキサートの救援薬・フェニトインとビタミンD・レボドパとB6を誤答にしました。誤答は「薬物の作用機序を知らないと見抜けない」形にしています。", "sources": ["https://www.fpa.or.jp/johocenter/yakuji-main/_1635.html?blockId=39307&dbMode=article", "https://www.kegg.jp/medicus-bin/japic_med?japic_code=00014256", "https://medicalnote.jp/diseases/%E3%83%93%E3%82%BF%E3%83%9F%E3%83%B3%EF%BC%AB%E6%AC%A0%E4%B9%8F%E7%97%87", "https://www.msdmanuals.com/professional/nutritional-disorders/vitamin-deficiency-dependency-and-toxicity/vitamin-k-deficiency", "https://pins.japic.or.jp/pdf/newPINS/00048194.pdf", "https://www.kegg.jp/medicus-bin/japic_med?japic_code=00056046"], "check": "小修正のうえ合格", "checkNote": "選択肢4は『代謝を阻害して』と『高カルシウム血症』の2点を誤りにしている。フェニトインは酵素誘導でビタミンDの不活性化を促進するので、『阻害』の部分が誤りなのか結果が誤りなのかが分かれ、1選択肢1論点の原則（RUBRIC A-3）から外れる。誤りは1点に絞るべき。；解説1の『ピリドキサールリン酸とキレートを形成する』は用語が不正確。イソニアジドはピリドキサール（リン酸）とヒドラゾンを形成する（加えてピリドキサールキナーゼを阻害する）。キレートは金属配位の用語。；そのほかの選択肢（2：ロイコボリンとB12の入れ替え、5：レボドパ単剤とピリドキシン）は中途半端な知識で選びやすい良い攪乱肢。"}, {"id": "F467", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ビタミンKに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ビタミンKは水溶性ビタミンである", "新生児はビタミンK欠乏になりにくい", "ワルファリン服用中の患者は納豆を積極的に摂取すべきである", "ビタミンK2は腸内細菌により合成される", "ビタミンKの過剰症は重篤である"], "answer": ["4"], "comment": "1：誤。ビタミンKは脂溶性ビタミンである。\n2：誤。新生児はビタミンKが胎盤を通過しにくく、腸内細菌叢も未発達であるため、ビタミンK欠乏になりやすい。\n3：誤。ワルファリン（抗血液凝固薬）服用中の患者はビタミンKの摂取を制限する必要があり、納豆などビタミンKが豊富な食品の摂取は禁忌である。\n4：正。ビタミンK2（メナキノン類）は腸内細菌によって合成される。そのため通常の食事をしていれば不足しにくいが、抗生物質の長期投与で腸内細菌叢が変化した場合に欠乏することがある。\n5：誤。ビタミンK1およびK2の過剰摂取による毒性は認められておらず、耐容上限量も設定されていない。", "image": false}, "issues": ["誤答1（Kは水溶性）、誤答5（過剰症は重篤）は素朴すぎる", "誤答3は当為表現（すべきである）で作られており、ガイドラインの攪乱肢ルールに抵触", "解説3の『納豆の摂取は禁忌』は添付文書上の『禁忌』とは異なる用語の使い方（相互作用として摂取を控えるよう指導、が正確）", "F240・F509・F780と重複"], "after": {"section": "実践", "text": "72歳男性。心房細動のためワルファリンカリウム錠を服用しており、PT-INRは2.0〜2.5で安定していた。2週間前から、健康のためにと毎朝、納豆と青汁をとるようになった。服薬状況に変化はない。本日の定期受診でPT-INRが1.4に低下しており、処方箋を持って薬局を訪れた。この患者への薬剤師の対応として、最も適切なのはどれか。1つ選べ。", "choices": ["納豆を食べる時刻とワルファリンの服用時刻を12時間以上あけるよう説明する。", "青汁をやめる代わりに、クロレラ食品で野菜の不足を補うよう説明する。", "納豆と青汁の摂取をやめるよう説明し、処方医に情報提供する。", "納豆中のビタミンKの吸収を抑えるため、油を使った料理と一緒に食べるよう説明する。", "INRの低下は、ビタミンKがワルファリンの肝臓での代謝を促進したためと説明する。"], "answer": ["3"], "comment": "1：誤。納豆はビタミンKを多く含むうえ、納豆菌が腸内でビタミンKを産生するため、影響は数日間続く。服用時刻をずらしても影響は避けられない。\n2：誤。クロレラもビタミンKを多く含み、ワルファリンの作用を減弱させる食品である。\n3：正。納豆と青汁はビタミンKを多く含み、ワルファリンの作用を減弱させる。INR低下の原因と考えられるため摂取をやめるよう説明し、用量調節の判断に必要な情報として処方医に伝える。\n4：誤。ビタミンKは脂溶性であり、油と一緒にとると吸収率は上がる。また、納豆の摂取そのものを避ける必要がある。\n5：誤。ワルファリンはビタミンKエポキシド還元酵素を阻害して還元型ビタミンKの再生を妨げる。食品から大量のビタミンKが補給されると凝固因子のγ-カルボキシ化が回復し、作用が減弱する。代謝の促進によるものではない。\nポイント：緑黄色野菜は一度に大量にとらず、摂取量を一定に保つよう指導する。", "dropImage": false}, "summary": "素朴な正誤問題を、ワルファリン服用中にPT-INRが下がった患者への対応を問う実践の事例問題に作り替えました。誤答は「時間をずらせばよい」「クロレラで代用」「油と一緒に」「代謝促進と説明」など、中途半端な知識で選びやすい対応にし、当為表現や「禁忌」という誤った用語は使っていません。ワルファリンの作用機序（VKOR阻害）の本格的な出題はF240に任せています。", "sources": ["https://www.pmda.go.jp/safety/consultation-for-patients/on-drugs/qa/0016.html", "https://www.shizuyaku.or.jp/soudan/2663/", "https://www.tyojyu.or.jp/net/kenkou-tyoju/eiyouso/vitamin-k.html"], "check": "合格"}, {"id": "F468", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "merge_delete", "before": {"section": "理論", "text": "ビタミンDに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ビタミンDは水溶性ビタミンである", "成人のビタミンD欠乏症は壊血病である", "ビタミンDの活性型は肝臓と腎臓の両方で生成され、組織分布により活性形態が異なる", "ビタミンDはカルシウム代謝のうちリン酸化反応のみに関与し、吸収・骨形成には別経路が機能する", "紫外線照射により皮膚で合成される"], "answer": ["5"], "comment": "1：誤。ビタミンDは脂溶性ビタミンである。\n2：誤。成人のビタミンD欠乏症は骨軟化症である。壊血病はビタミンCの欠乏症。\n3：誤。ビタミンDは肝臓で25-ヒドロキシビタミンDに変換された後、腎臓で活性型の1α,25-ジヒドロキシビタミンDに変換される。肝臓のみではない。\n4：誤。ビタミンDはカルシウムとリンの吸収促進、骨の形成に関与する重要なビタミンである。\n5：正。ビタミンD3は紫外線照射により皮膚で7-デヒドロコレステロールから合成される。そのため日光浴が不足するとビタミンD不足になりやすい。", "image": false}, "issues": ["F235・F779・F1273と同じ論点（皮膚合成・肝臓/腎臓での活性化）の重複", "誤答1・2が素朴すぎる。誤答4は『のみ』の絶対化表現を含む", "誤答3の解説が『肝臓のみではない』となっており、選択肢の文面と食い違う"], "summary": "削除。ビタミンDの活性化部位は F779（必須）、調節・指標は F235（理論）に集約。", "sources": []}, {"id": "F469", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "葉酸に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["葉酸は脂溶性ビタミンである", "葉酸の欠乏は鉄欠乏性貧血を引き起こす", "葉酸はDNA合成のうちピリミジン代謝経路には関与せず、プリン合成のみに補酵素として機能する", "妊娠初期の葉酸不足は胎児の神経管閉鎖障害のリスクを高める", "葉酸とビタミンB12は別々の代謝経路で作用し、両者の相互的影響は認められないとされる"], "answer": ["4"], "comment": "1：誤。葉酸は水溶性ビタミン（ビタミンB群）である。\n2：誤。葉酸の欠乏は巨赤芽球性貧血を引き起こす。鉄欠乏性貧血ではない。\n3：誤。葉酸はテトラヒドロ葉酸としてヌクレオチド合成（DNA合成）に必要な一炭素単位の転移反応に関与する。\n4：正。妊娠初期の葉酸不足は胎児の神経管閉鎖障害（二分脊椎等）のリスクを高める。このため妊娠を計画している女性には葉酸の十分な摂取が推奨される。\n5：誤。葉酸とビタミンB12はメチオニン合成において相互に関連しており、いずれの欠乏でも巨赤芽球性貧血を引き起こす。", "image": false}, "issues": ["誤答3は『のみ』の絶対化表現、誤答5は『認められない』の否定表現で、知識なしでも消去できる", "誤答1・2が素朴すぎる", "F237と同じ論点（巨赤芽球性貧血・神経管閉鎖障害）の重複"], "after": {"section": "実践", "text": "28歳女性。1年以内の妊娠を希望しており、薬局で葉酸のサプリメントについて相談した。普段から野菜をよく食べているという。この女性の葉酸摂取に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["葉酸の不足により母体に起こる貧血は、小球性低色素性貧血である。", "サプリメントの葉酸はポリグルタミン酸型であり、消化管で分解されてから吸収される。", "サプリメントなど通常の食品以外の食品に含まれる葉酸には、耐容上限量が設定されていない。", "食事に加えて、通常の食品以外の食品から葉酸を400 μg/日摂取することが望まれる。", "妊娠の1か月以上前から摂取を始め、妊娠3か月まで続けることが勧められる。"], "answer": ["4", "5"], "comment": "1：誤。葉酸の不足はDNA合成の障害により巨赤芽球性貧血（大球性貧血）を起こす。小球性低色素性貧血は鉄欠乏性貧血でみられる。\n2：誤。サプリメントや強化食品に用いられる葉酸はモノグルタミン酸型（プテロイルモノグルタミン酸）で、そのまま吸収される。食品中の葉酸の多くはポリグルタミン酸型で、利用率は約50%と見積もられている。\n3：誤。耐容上限量は通常の食品以外の食品に含まれる葉酸に適用され、18〜29歳で900 μg/日、30〜64歳で1,000 μg/日である。\n4：正。日本人の食事摂取基準（2025年版）では、妊娠を計画している女性、妊娠の可能性がある女性及び妊娠初期の妊婦は、胎児の神経管閉鎖障害のリスク低減のために、通常の食品以外の食品に含まれる葉酸を400 μg/日摂取することが望まれるとしている。\n5：正。神経管は受胎後28日ごろまでに形成されるため、妊娠に気づいてからでは間に合わないことが多い。厚生労働省は、妊娠1か月以上前から妊娠3か月までの摂取を勧めている。", "dropImage": false}, "summary": "F237と重なる知識問題を、妊娠を希望する女性からの相談という実践の事例問題（2つ選べ）に作り替えました。2025年版の付記（通常の食品以外の食品から400 μg/日）、耐容上限量の適用範囲、モノグルタミン酸型とポリグルタミン酸型の違いを攪乱肢にし、互いに裏返しになる選択肢は置かないようにしました。「のみ」「認められない」などの絶対化・否定表現は除いています。", "sources": ["https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf", "https://kennet.mhlw.go.jp/information/information/food/e-05-002.html", "https://hfnet.nibn.go.jp/wp/wp-content/uploads/2023/03/FA2-1.pdf"], "check": "小修正のうえ合格", "checkNote": "選択肢2は『胎児の神経管閉鎖障害（正しい）に加えて母体の鉄欠乏性貧血（誤り）』で、前半が正しく後半が誤りの『半分正しい』選択肢になっている（RUBRIC A-3違反）。前半に引かれて正と判断する受験者と、後半で誤と判断する受験者に分かれる作りは避けるべき。；1・4・5の内容は2025年版食事摂取基準（付記：通常の食品以外の食品に含まれる葉酸400 μg/日、耐容上限量は通常の食品以外の食品の葉酸に適用）および厚生労働省の通知（妊娠1か月以上前から妊娠3か月まで）と一致することを確認した。"}, {"id": "F470", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "merge_delete", "before": {"section": "理論", "text": "ビタミンCに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ビタミンCは脂溶性ビタミンである", "ビタミンCの欠乏症はペラグラである", "ビタミンCの過剰症は重篤で耐容上限量が厳密に設定されている", "ビタミンCは酸化促進作用をもつ", "ビタミンCはコラーゲン合成に必要である"], "answer": ["5"], "comment": "1：誤。ビタミンCは水溶性ビタミンである。\n2：誤。ビタミンCの欠乏症は壊血病である。ペラグラはナイアシンの欠乏症。\n3：誤。ビタミンCは水溶性であり過剰分は尿中に排泄されるため、重篤な過剰症は報告されていない。\n4：誤。ビタミンCは還元作用（抗酸化作用）をもつ。酸化促進ではない。\n5：正。ビタミンCはコラーゲン合成においてプロリンやリシンの水酸化反応に必要な補因子である。不足するとコラーゲン合成が障害され壊血病を引き起こす。", "image": false}, "issues": ["誤答1・2・4が素朴すぎ、誤答3は『厳密に』で語感消去できる", "F232・F751とビタミンC＝コラーゲン合成・壊血病で重複"], "summary": "削除。ビタミンCは F751（必須・壊血病の機序）と F232（理論・還元作用）に集約。", "sources": []}, {"id": "F471", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ナイアシンに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ナイアシンの欠乏症はペラグラであり皮膚炎・下痢・認知症を三主徴とする", "ナイアシンはビタミンB12の別名である", "ナイアシンはトリプトファンからは合成されない", "ナイアシンはFADの構成成分である", "ナイアシンの過剰摂取による副作用は報告されていない"], "answer": ["1"], "comment": "1：正。ナイアシンの欠乏症はペラグラであり、皮膚炎（dermatitis）、下痢（diarrhea）、認知症（dementia）を三主徴（3D）とする。\n2：誤。ナイアシンはニコチン酸とニコチンアミドの総称であり、ビタミンB12とは異なる。\n3：誤。ナイアシンは体内でトリプトファンから合成される。ただしその変換効率は低い。\n4：誤。ナイアシンはNAD（ニコチンアミドアデニンジヌクレオチド）やNADP（ニコチンアミドアデニンジヌクレオチドリン酸）の構成成分である。FADはリボフラビン（ビタミンB2）の構成成分。\n5：誤。ナイアシンの過剰摂取では皮膚紅潮、掻痒感、消化不良、肝機能低下などの副作用が報告されている。", "image": false}, "issues": ["F239とほぼ同じ論点（ペラグラの3D、トリプトファン、FAD/NAD）の重複", "誤答2（ナイアシンはB12の別名）は素朴すぎる。誤答5『報告されていない』は否定表現", "解説3『変換効率は低い』は値（1/60）を示しておらず曖昧"], "after": {"section": "理論", "text": "ある日の食事に、ナイアシンが12 mg、トリプトファンが720 mg含まれていた。日本人の食事摂取基準（2025年版）の定義に従って求めたこの食事のナイアシン当量として、正しいのはどれか。1つ選べ。", "choices": ["12 mgNE", "24 mgNE", "36 mgNE", "132 mgNE", "732 mgNE"], "answer": ["2"], "comment": "1：誤。トリプトファン由来のナイアシンを加えていない値である。トリプトファンは体内でナイアシンに変換されるため、ナイアシン当量に含める。\n2：正。ナイアシン当量（NE）＝ナイアシン＋1/60トリプトファンで定義される。12＋720/60＝12＋12＝24 mgNEとなる。\n3：誤。換算係数を1/30として計算した値（12＋720/30＝36）である。\n4：誤。換算係数を1/6として計算した値（12＋720/6＝132）である。\n5：誤。トリプトファンをそのままナイアシンとして足した値（12＋720＝732）である。\nポイント：トリプトファン60 mgがナイアシン1 mgに相当する。ペラグラはナイアシンとトリプトファンの両方が不足すると起こりやすい。", "dropImage": false}, "summary": "F239とほぼ同じ論点（ペラグラの3D、NAD）だったため、ナイアシン当量の計算問題に作り替えました（講義回で唯一の計算問題）。誤答は換算係数の取り違え（1/30、1/6）やトリプトファンの足し忘れ・単純加算で作り、検算済みです（12＋720/60＝24）。定義は2025年版の脚注で確認しました。", "sources": ["https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf"], "check": "合格"}, {"id": "F472", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "merge_delete", "before": {"section": "理論", "text": "ビタミンB12に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ビタミンB12は植物性食品に広く含まれる", "ビタミンB12の欠乏症は巨赤芽球性貧血である", "ビタミンB12の吸収に胃の内因子は不要である", "ビタミンB12は鉄を含む補酵素である", "ビタミンB12の欠乏は脚気を引き起こす"], "answer": ["2"], "comment": "1：誤。ビタミンB12は主に動物性食品（レバー、牡蠣、アサリ、シジミ等）に含まれ、植物性食品にはほとんど含まれない。\n2：正。ビタミンB12の欠乏症は巨赤芽球性貧血（悪性貧血）と末梢神経障害である。\n3：誤。ビタミンB12の吸収には胃の壁細胞から分泌される内因子（キャッスル因子）が必要である。\n4：誤。ビタミンB12はコバルトを含む補酵素（コバラミン）である。鉄ではない。\n5：誤。脚気はビタミンB1の欠乏症である。ビタミンB12の欠乏は巨赤芽球性貧血を引き起こす。", "image": false}, "issues": ["F241・F249・F762とB12の知識点（動物性食品・内因子・コバルト・巨赤芽球性貧血）が重複", "誤答がすべて素朴な取り違え"], "summary": "削除。B12は F241（理論・吸収と代謝）、F249（実践）、F762（必須・コバルト）に集約。", "sources": []}, {"id": "F473", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "必須", "text": "ビタミンAの欠乏症はどれか。1つ選べ。", "choices": ["壊血病", "夜盲症", "脚気", "ペラグラ", "くる病"], "answer": ["2"], "comment": "1：誤。壊血病はビタミンCの欠乏症である。\n2：正。夜盲症はビタミンAの欠乏症である。ビタミンA（レチナール）は網膜の桿体細胞でロドプシンの構成成分として暗順応に関与しており、不足すると夜盲症を引き起こす。\n3：誤。脚気はビタミンB1の欠乏症である。\n4：誤。ペラグラはナイアシンの欠乏症である。\n5：誤。くる病はビタミンDの欠乏症（小児）である。", "image": false}, "issues": ["F465と同じ形式（欠乏症名を選ぶ必須問題）で、同じ5つの病名を並べており重複感が強い"], "after": {"section": "必須", "text": "網膜の桿体細胞でオプシンと結合し、ロドプシンを形成するのはどれか。1つ選べ。", "choices": ["全trans-レチナール", "レチノール", "全trans-レチノイン酸", "β-カロテン", "11-cis-レチナール"], "answer": ["5"], "comment": "1：誤。全trans-レチナールは、ロドプシンが光を受けて11-cis-レチナールが異性化して生じる。オプシンから解離し、網膜色素上皮で11-cis型に戻されて再利用される。\n2：誤。レチノールは血中を輸送されるビタミンAの形であり、網膜で酸化されてレチナールとなってから視覚に利用される。\n3：誤。全trans-レチノイン酸は核内受容体（RAR）に結合して遺伝子発現を調節する形であり、視覚には関与しない。\n4：誤。β-カロテンはプロビタミンAであり、小腸でレチナールに開裂されてからビタミンAとして利用される。\n5：正。ロドプシンは、オプシンのリシン残基に11-cis-レチナールがシッフ塩基結合したものである。不足すると暗順応が障害され、夜盲症となる。", "dropImage": false}, "summary": "F465と同じ5つの病名を並べた「欠乏症名を選ぶ」問題だったため、物質名を問う必須問題に変えて角度を分けました。過去問109127（レチノイン酸を攪乱肢とする）と同水準で、11-cis型と全trans型の区別まで問います。", "sources": ["https://bsd.neuroinf.jp/wiki/%E3%83%AD%E3%83%89%E3%83%97%E3%82%B7%E3%83%B3"], "check": "合格"}, {"id": "F474", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ビタミンB2に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ビタミンB2はチアミンとも呼ばれる", "ビタミンB2はNADの構成成分である", "ビタミンB2の欠乏症は壊血病である", "ビタミンB2はFMNおよびFADの構成成分である", "ビタミンB2は脂溶性ビタミンである"], "answer": ["4"], "comment": "1：誤。チアミンはビタミンB1の別名である。ビタミンB2はリボフラビンとも呼ばれる。\n2：誤。NADの構成成分はナイアシン（ニコチンアミド）である。\n3：誤。ビタミンB2の欠乏症は口唇炎、口角炎、舌炎、皮膚炎、成長障害である。壊血病はビタミンCの欠乏症。\n4：正。ビタミンB2（リボフラビン）はFMN（フラビンモノヌクレオチド）およびFAD（フラビンアデニンジヌクレオチド）の構成成分であり、酸化還元反応の補酵素として機能する。\n5：誤。ビタミンB2は水溶性ビタミンである。", "image": false}, "issues": ["誤答1（B2＝チアミン）、3（壊血病）、5（脂溶性）が素朴すぎる", "正答4（FMN/FAD）がF226と重複"], "after": {"section": "必須", "text": "欠乏により口角炎や口唇炎を起こすビタミンはどれか。1つ選べ。", "choices": ["ビタミンA", "ビタミンB2", "ビタミンB1", "ビタミンC", "ビタミンK"], "answer": ["2"], "comment": "1：誤。ビタミンAの欠乏では夜盲症や皮膚・角膜の乾燥がみられる。\n2：正。ビタミンB2（リボフラビン）の欠乏では口角炎、口唇炎、舌炎、脂漏性皮膚炎などがみられる。\n3：誤。ビタミンB1の欠乏では脚気やウェルニッケ脳症がみられる。\n4：誤。ビタミンCの欠乏では壊血病（歯肉出血、皮下出血など）がみられる。\n5：誤。ビタミンKの欠乏では血液凝固能の低下による出血傾向がみられる。\nポイント：ビタミンB2は光により分解されやすい。口角炎や舌炎はビタミンB6やナイアシンの欠乏でもみられる。", "dropImage": false}, "summary": "誤答が素朴すぎ、正答（FMN/FAD）がF226と重なっていたため、ビタミンB2の欠乏症を問う必須問題にしました。同じ口腔症状を起こすビタミンB6・ナイアシンは選択肢に入れず、正答が一意になるようにしています。", "sources": ["https://www.tyojyu.or.jp/net/kenkou-tyoju/eiyouso/vitamin-b2.html"], "check": "合格"}, {"id": "F508", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "keep", "before": {"section": "必須", "text": "ビタミンB6の生理作用として最も関連が深いのはどれか。1つ選べ。", "choices": ["コラーゲン合成", "血液凝固", "抗酸化作用", "カルシウム吸収促進", "アミノ基転移反応の補酵素"], "answer": ["5"], "comment": "1：誤。コラーゲン合成に関与するのはビタミンCである。\n2：誤。血液凝固に関与するのはビタミンKである。\n3：誤。抗酸化作用に関与するのはビタミンEやビタミンCである。\n4：誤。カルシウム吸収促進に関与するのはビタミンDである。\n5：正。ビタミンB6はピリドキサールリン酸（PLP）として、アミノ基転移反応（トランスアミナーゼ反応）をはじめとするアミノ酸代謝の補酵素として機能する。", "image": false}, "issues": ["必須として妥当。誤答はいずれも別のビタミンの生理作用で、長さもそろっている"], "after": {"section": "必須", "text": "ビタミンB6の生理作用として最も関連が深いのはどれか。1つ選べ。", "choices": ["コラーゲン合成", "血液凝固", "抗酸化作用", "カルシウム吸収促進", "アミノ基転移反応"], "answer": ["5"], "comment": "1：誤。コラーゲン合成（プロリン・リシンの水酸化）に関与するのはビタミンCである。\n2：誤。血液凝固（凝固因子のγ-カルボキシ化）に関与するのはビタミンKである。\n3：誤。抗酸化作用の代表はビタミンEやビタミンCである。\n4：誤。小腸でのカルシウム吸収促進に関与するのはビタミンDである。\n5：正。ビタミンB6はピリドキサールリン酸（PLP）として、アミノ基転移反応やアミノ酸の脱炭酸反応など、アミノ酸代謝の補酵素としてはたらく。", "dropImage": false}, "summary": "内容はそのままです。正答だけ「〜の補酵素」と長く具体的だったので、他の選択肢にそろえて「アミノ基転移反応」とし、解説に各ビタミンの具体的な作用を補いました。", "sources": ["https://www.kegg.jp/medicus-bin/japic_med?japic_code=00056046"], "check": "合格"}, {"id": "F509", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "新生児ビタミンK欠乏性出血症に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["人工乳栄養児で母乳栄養児より発症頻度が高い", "ビタミンKは胎盤を容易に通過するため新生児に欠乏しない", "ビタミンKの欠乏は脚気を引き起こす", "母乳栄養児では発症頻度が高くビタミンKの予防投与が行われる", "新生児は腸内細菌によるビタミンK合成が活発で、欠乏は起こりにくい"], "answer": ["4"], "comment": "1：誤。人工乳栄養児よりも母乳栄養児の方が発症頻度が高い。母乳中のビタミンK含量が少ないためである。\n2：誤。ビタミンKは胎盤を通過しにくいため、新生児はビタミンK不足になりやすい。\n3：誤。脚気はビタミンB1の欠乏症である。ビタミンKの欠乏は出血傾向を引き起こす。\n4：正。母乳栄養児では母乳中のビタミンK含量が少なく、腸内細菌叢も未発達であるため、ビタミンK欠乏による出血（頭蓋内出血等）のリスクが高い。現在は新生児にビタミンKの予防投与が行われている。\n5：誤。新生児の腸内細菌叢は未発達であり、ビタミンK2の合成が十分ではない。", "image": false}, "issues": ["選択肢1と4が互いに裏返しの関係（人工乳＞母乳／母乳で高い）で、片方を選べばもう片方が消え、推測で解ける", "誤答3（Kの欠乏は脚気）は素朴すぎ、他の肢と論点がずれている", "誤答2・5は『容易に』『活発で』の単純反転", "予防投与法（3か月法）が解説に書かれていない", "F240・F467・F780と重複"], "after": {"section": "実践", "text": "生後6週の男児。在胎39週、出生体重3,100 gで出生し、完全母乳栄養である。ビタミンK2シロップは哺乳確立時と産科退院時に投与されたが、その後は投与されていなかった。2日前から不機嫌で哺乳力が低下し、嘔吐がみられたため受診した。頭部CTで頭蓋内出血を認め、血液検査ではプロトロンビン時間の延長とPIVKA-IIの高値を認めた。血小板数は基準範囲内であった。この児の病態と予防に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["ビタミンKは胎盤を通過しやすく、出生時の体内貯蔵量は多い。", "PIVKA-IIの高値は、凝固因子のγ-カルボキシ化の亢進を示す。", "母乳は人工乳に比べてビタミンKの含量が少ない。", "本症の出血は、主に血小板の産生低下によって起こる。", "現在は、生後3か月まで週1回のビタミンK2シロップ投与が推奨されている。"], "answer": ["3", "5"], "comment": "1：誤。ビタミンKは胎盤を通過しにくく、新生児は出生時の体内貯蔵量が少ない。腸内細菌叢も未発達で、ビタミンK2の供給も少ない。\n2：誤。PIVKA-IIは、ビタミンKの欠乏やワルファリンの作用によりγ-カルボキシ化を受けていない異常プロトロンビンであり、高値はγ-カルボキシ化が不十分であることを示す。\n3：正。母乳はビタミンKの含量が少なく、人工乳には十分量が含まれている。そのため乳児ビタミンK欠乏性出血症は母乳栄養児に多く、生後1〜2か月ごろに頭蓋内出血として発症しやすい。\n4：誤。本症ではビタミンK依存性凝固因子（II、VII、IX、X）の活性が低下して出血する。本児でも血小板数は基準範囲内である。\n5：正。日本小児科学会などの提言（2021年）では、哺乳確立時、生後1週または産科退院時のいずれか早い時期、その後は生後3か月まで週1回、ビタミンK2シロップを投与する方法（3か月法）が推奨されている。", "dropImage": false}, "summary": "選択肢1と4が裏返しの関係で推測で解けたため、母乳栄養児の頭蓋内出血の事例を読ませる実践・2つ選べの問題に作り替えました。現在の予防法（3か月法、2021年提言）を正答に入れ、PIVKA-IIの意味や出血の機序（凝固因子か血小板か）を攪乱肢にしています。脚気の選択肢など論点のずれた肢は削除しました。", "sources": ["https://www.jpeds.or.jp/modules/guidelines/index.php?content_id=134", "https://www.jschild.or.jp/archives/3546/", "https://www.jaog.or.jp/sep2012/know/kisyakon/46_110713.pdf", "https://ja.wikipedia.org/wiki/PIVKA-II"], "check": "合格"}, {"id": "F647", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "polish", "before": {"section": "必須", "text": "ビオチンの欠乏症はどれか。1つ選べ。", "choices": ["壊血病", "脚気", "ペラグラ", "皮膚炎・脱毛", "夜盲症"], "answer": ["4"], "comment": "1：誤。壊血病はビタミンCの欠乏症である。\n2：誤。脚気はビタミンB1の欠乏症である。\n3：誤。ペラグラはナイアシンの欠乏症である。\n4：正。ビオチンの欠乏症は皮膚炎、脱毛、舌炎等である。生卵白中のアビジンがビオチンと結合してその吸収を阻害するため、生卵白の大量摂取で欠乏が起こりうる。\n5：誤。夜盲症はビタミンAの欠乏症である。", "image": false}, "issues": ["正答4だけが症状（皮膚炎・脱毛）で、他の4肢は疾患名。形式の違いから正答が推測できる"], "after": {"section": "必須", "text": "生の卵白に含まれるアビジンと強く結合し、消化管からの吸収が妨げられるビタミンはどれか。1つ選べ。", "choices": ["パントテン酸", "ビタミンB6", "葉酸", "ビタミンB2", "ビオチン"], "answer": ["5"], "comment": "1：誤。パントテン酸はCoAの構成成分であり、アビジンとは結合しない。広く食品に含まれ、欠乏症はまれである。\n2：誤。ビタミンB6はピリドキサールリン酸としてアミノ基転移反応などの補酵素となる。アビジンとは結合しない。イソニアジドの長期服用で欠乏しやすい。\n3：誤。葉酸はテトラヒドロ葉酸として一炭素単位の転移に関わる。アビジンとは結合しない。\n4：誤。ビタミンB2はFMN・FADの構成成分である。アビジンとは結合しない。光で分解されやすい。\n5：正。ビオチンは卵白中の糖タンパク質アビジンと強く結合し、消化管から吸収されにくくなる。生卵白を大量に摂り続けると欠乏し、皮膚炎・脱毛・舌炎などを生じる。ビオチンはピルビン酸カルボキシラーゼなどのカルボキシラーゼの補酵素である。\nポイント：アビジンは加熱で変性して結合能を失うため、加熱した卵ではビオチンの吸収は妨げられない。", "dropImage": false}, "summary": "原文は正答だけが症状（皮膚炎・脱毛）で他が疾患名だったため、形式の違いで答えが分かってしまいました。欠乏症の対応はF465などと重なるので、問いを「アビジンと結合するビタミン」に変え、選択肢を水溶性ビタミン名にそろえました。", "sources": ["https://hfnet.nibn.go.jp/vitamin/detail180/", "https://bifidus-fund.jp/keyword/kw073.shtml"], "check": "合格"}, {"id": "F648", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "merge_delete", "before": {"section": "理論", "text": "パントテン酸に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["パントテン酸は脂溶性ビタミンである", "パントテン酸はDNA合成に必要な補酵素である", "パントテン酸の欠乏症は頻繁にみられる", "パントテン酸はコエンザイムA（CoA）の構成成分である", "パントテン酸はFADの構成成分である"], "answer": ["4"], "comment": "1：誤。パントテン酸は水溶性ビタミン（ビタミンB群）である。\n2：誤。DNA合成に必要な補酵素は葉酸（テトラヒドロ葉酸）である。\n3：誤。パントテン酸は広く食品に含まれるため（「パントテン」はギリシャ語で「どこにでもある」の意）、通常の食事で欠乏することは稀である。\n4：正。パントテン酸はコエンザイムA（CoA）およびアシルキャリアタンパク質（ACP）の構成成分であり、脂肪酸代謝、TCA回路等多くの代謝経路に関与する。\n5：誤。FADの構成成分はリボフラビン（ビタミンB2）である。", "image": false}, "issues": ["誤答1（脂溶性）、3（欠乏は頻繁）、5（FADの構成成分）が素朴すぎる", "パントテン酸は国試での出題頻度が低く、単独の理論問題にするより F226 の一肢として扱う方がよい"], "summary": "削除。パントテン酸（CoA）の論点は F226 の誤答または正答の一肢として取り込む。", "sources": []}, {"id": "F649", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ビタミンEに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ビタミンEは水溶性ビタミンである", "ビタミンEの化学名はレチノールである", "ビタミンEは生体膜のリン脂質中に存在し脂質の過酸化を防ぐ抗酸化作用をもつ", "ビタミンEは血液凝固に関与する", "ビタミンEの欠乏症はペラグラである"], "answer": ["3"], "comment": "1：誤。ビタミンEは脂溶性ビタミンである。\n2：誤。レチノールはビタミンAの化学名である。ビタミンEの化学名はトコフェロール。\n3：正。ビタミンE（トコフェロール）は生体膜のリン脂質二重層に存在し、脂質ペルオキシラジカルを捕捉して脂質の過酸化連鎖反応を停止させる抗酸化作用をもつ。\n4：誤。血液凝固に関与するのはビタミンKである。\n5：誤。ペラグラはナイアシンの欠乏症である。ビタミンEの欠乏症は溶血性貧血等。", "image": false}, "issues": ["誤答1（水溶性）、2（化学名がレチノール）、4（血液凝固）、5（ペラグラ）がすべて素朴な取り違え", "ビタミンEを扱う問題がこれしかなく、内容が定義の想起にとどまる"], "after": {"section": "理論", "text": "ビタミンEに関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["α-トコフェロールは、脂質ペルオキシルラジカルを捕捉して、脂質過酸化の連鎖反応を停止させる。", "肝臓のα-トコフェロール輸送タンパク質は、γ-トコフェロールを優先的に結合して血中へ送り出す。", "抗酸化反応で生じたトコフェロキシルラジカルは、ビタミンKにより還元されてトコフェロールに戻る。", "未熟児にみられるビタミンE欠乏では、赤血球の成熟が障害されて巨赤芽球性貧血が起こる。", "日本人の食事摂取基準（2025年版）では、α-トコフェロールのみを対象として指標が算定されている。"], "answer": ["1", "5"], "comment": "1：正。α-トコフェロールは生体膜中で脂質ペルオキシルラジカルに水素原子を与えて捕捉し、脂質過酸化の連鎖反応を断ち切る（連鎖切断型抗酸化剤）。\n2：誤。肝臓のα-トコフェロール輸送タンパク質（α-TTP）はα-トコフェロールを優先的に結合し、VLDLに組み込んで血中へ送り出す。γ-トコフェロールなど他の同族体は肝細胞内で代謝される。\n3：誤。トコフェロキシルラジカルをトコフェロールに戻すのは主にビタミンC（アスコルビン酸）である。ビタミンKはγ-グルタミルカルボキシラーゼの補酵素として働く。\n4：誤。未熟児のビタミンE欠乏では、赤血球膜の脂質が過酸化されて溶血性貧血が起こる。巨赤芽球性貧血はビタミンB12や葉酸の欠乏で起こる。\n5：正。2025年版の表の注に「α-トコフェロールについて算定した。α-トコフェロール以外のビタミンEは含まない」とある。指標は目安量と耐容上限量である。", "dropImage": false}, "summary": "原文は「水溶性」「レチノール」「ペラグラ」など素朴な取り違えばかりで、ビタミンEを扱う唯一の問題としては浅かったため、理論・2つ選べに作り直しました。抗酸化の機序、α-TTPの選択性、ビタミンCによる再生、2025年版の算定対象、欠乏症（溶血性貧血）を一度に確認できるようにしています。", "sources": ["https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf", "https://lpi.oregonstate.edu/mic/vitamins/vitamin-E", "https://hfnet.nibn.go.jp/vitamin/detail176/"], "check": "合格"}, {"id": "F660", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ウェルニッケ脳症に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["アルコールの過剰摂取やTPN時のビタミンB1不足により発症する", "ウェルニッケ脳症はビタミンCの欠乏で発症する", "ウェルニッケ脳症の主症状は出血傾向である", "ウェルニッケ脳症は葉酸投与で改善する", "ウェルニッケ脳症は栄養管理とは無関係である"], "answer": ["1"], "comment": "1：正。ウェルニッケ脳症はアルコールの過剰摂取（ビタミンB1の吸収阻害・需要増大）や中心静脈栄養（TPN）時のビタミンB1補充不足により発症する中枢性疾患であり、眼球運動障害、運動失調、意識障害を三主徴とする。\n2：誤。ウェルニッケ脳症はビタミンB1（チアミン）の欠乏で発症する。ビタミンCではない。\n3：誤。出血傾向はビタミンKの欠乏症である。ウェルニッケ脳症の主症状は眼球運動障害、運動失調、意識障害。\n4：誤。ウェルニッケ脳症の治療にはビタミンB1（チアミン）の速やかな投与が必要である。葉酸ではない。\n5：誤。ウェルニッケ脳症はTPN時のビタミンB1管理が不適切な場合にも発症するため、栄養管理と密接に関連する。", "image": false}, "issues": ["誤答2〜5（ビタミンC欠乏で発症、主症状は出血傾向、葉酸で改善、栄養管理と無関係）はいずれも素朴で、正答1だけが具体的で長い", "F231・F465・F1271とB1で重複"], "after": {"section": "実践", "text": "58歳男性。30年以上にわたり毎日多量の飲酒を続け、この1か月は食事をほとんどとっていなかった。数日前から歩くとふらつくようになり、本日、つじつまの合わない言動がみられたため救急搬送された。診察では眼振と眼球運動障害を認めた。この患者に対する初期対応として、適切なのはどれか。1つ選べ。", "choices": ["ブドウ糖を含む輸液の開始前に、ビタミンB1を静脈内投与する。", "ブドウ糖を含む輸液を先に開始し、経口摂取の回復後にビタミンB1を補う。", "内因子の欠乏を補うため、ビタミンB12を筋肉内投与する。", "DNA合成の障害を是正するため、葉酸を経口投与する。", "アミノ基転移反応を回復させるため、ビタミンB6を投与する。"], "answer": ["1"], "comment": "1：正。長期の大量飲酒と低栄養に、意識障害・運動失調・眼球運動障害がそろっており、ビタミンB1欠乏によるウェルニッケ脳症が疑われる。ブドウ糖を含む輸液より前に、ビタミンB1を非経口投与する。\n2：誤。ビタミンB1が欠乏した状態でブドウ糖を負荷すると、糖代謝でチアミンピロリン酸がさらに消費され、ウェルニッケ脳症を誘発・悪化させるおそれがある。ビタミンB1の補充を後回しにしてはならない。\n3：誤。胃切除歴などの内因子欠乏を示す所見はない。ビタミンB12欠乏の神経症状は亜急性連合性脊髄変性症であり、本症例の症状とは異なる。\n4：誤。葉酸欠乏ではDNA合成障害による巨赤芽球性貧血が起こるが、本症例の神経症状の原因ではない。\n5：誤。ビタミンB6はアミノ基転移反応の補酵素であるが、本症例の神経症状の原因ではない。\nポイント：高カロリー輸液でビタミンB1を補わないと、乳酸アシドーシスやウェルニッケ脳症を起こすことがある。", "dropImage": false}, "summary": "原文は正答だけが具体的で長く、誤答（ビタミンC欠乏、出血傾向など）が語感で消せる問題でした。B1の欠乏症の対応はF465、代謝の機序はF231に任せ、本問はアルコール多飲者の事例から「ブドウ糖より先にビタミンB1」を判断させる実践問題に作り直しました。", "sources": ["https://www.msdmanuals.com/professional/special-subjects/illicit-drugs-and-intoxicants/wernicke-encephalopathy", "https://www.lab.toho-u.ac.jp/med/omori/eiyo_chiryo/guide/lt3f020000000038-att/center_010.pdf"], "check": "合格"}, {"id": "F751", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "keep", "before": {"section": "必須", "text": "壊血病の原因として正しいのはどれか。1つ選べ。", "choices": ["ビタミンA の不足によるロドプシン再合成障害", "ビタミンB1の不足によるピルビン酸脱水素酵素活性の低下", "ビタミンCの不足によるコラーゲン合成障害", "ビタミンDの不足による腸管からのカルシウム吸収低下", "ビタミンKの不足によるγ-カルボキシグルタミン酸残基形成の障害"], "answer": ["3"], "comment": "1：誤。ビタミンA不足ではロドプシン再合成が障害され夜盲症を生じるが、壊血病ではない。\n2：誤。ビタミンB1不足ではピルビン酸脱水素酵素等のチアミンピロリン酸依存酵素活性が低下し脚気やウェルニッケ脳症を生じる。\n3：正。壊血病はビタミンC（アスコルビン酸）の欠乏によりプロリルヒドロキシラーゼおよびリシルヒドロキシラーゼの補因子が不足し、コラーゲンのヒドロキシプロリン・ヒドロキシリシン形成が障害されることで発症する。血管壁の脆弱化による出血傾向が特徴。\n4：誤。ビタミンD不足では活性型1α,25-(OH)₂D₃の不足により腸管からのCa吸収が低下し、小児ではくる病、成人では骨軟化症を生じる。\n5：誤。ビタミンK不足ではビタミンK依存性カルボキシラーゼによるγ-カルボキシグルタミン酸残基形成が障害され、凝固因子（II, VII, IX, X）の活性化が阻害されて出血傾向を生じる。", "image": false}, "issues": ["必須として妥当。各肢が『ビタミン不足→分子機序』の形でそろい、作用の理解も問える良問"], "after": {"section": "必須", "text": "壊血病の原因として正しいのはどれか。1つ選べ。", "choices": ["ビタミンAの不足によるロドプシン再合成障害", "ビタミンB1の不足によるピルビン酸脱水素酵素活性の低下", "ビタミンCの不足によるコラーゲン合成障害", "ビタミンDの不足による腸管からのカルシウム吸収低下", "ビタミンKの不足によるγ-カルボキシグルタミン酸残基形成の障害"], "answer": ["3"], "comment": "1：誤。ビタミンA不足ではロドプシンの再合成が障害されて夜盲症を生じるが、壊血病の原因ではない。\n2：誤。ビタミンB1不足ではピルビン酸脱水素酵素などチアミンピロリン酸を補酵素とする酵素の活性が低下し、脚気やウェルニッケ脳症を生じる。\n3：正。ビタミンC（アスコルビン酸）はプロリンやリシンを水酸化する酵素の働きに必要である。不足するとコラーゲンの合成が障害されて血管壁がもろくなり、歯肉出血や皮下出血を生じる。\n4：誤。ビタミンD不足では活性型ビタミンDが不足して腸管からのカルシウム吸収が低下し、小児ではくる病、成人では骨軟化症を生じる。\n5：誤。ビタミンK不足ではγ-カルボキシグルタミン酸残基の形成が障害され、凝固因子（II、VII、IX、X）が働かずに出血傾向を生じる。", "dropImage": false}, "summary": "内容は国試レベルのため変更していません。選択肢1の不要な空白を削除し、解説の化学式を平文にそろえました。", "sources": ["https://www.pharm.or.jp/words/c.html"], "check": "合格"}, {"id": "F752", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "keep", "before": {"section": "必須", "text": "小児のくる病の病態として正しいのはどれか。1つ選べ。", "choices": ["ビタミンA欠乏による網膜桿体細胞の機能障害", "ビタミンB12欠乏による巨赤芽球の出現と無効造血", "ビタミンC欠乏による結合組織の脆弱化", "ビタミンD欠乏による骨端軟骨の石灰化障害", "ビタミンE欠乏による赤血球膜リン脂質の過酸化"], "answer": ["4"], "comment": "1：誤。ビタミンA欠乏では網膜桿体細胞のロドプシン再合成が障害され夜盲症を生じるが、くる病ではない。\n2：誤。ビタミンB12欠乏ではDNA合成障害により巨赤芽球性貧血を生じるが、くる病ではない。\n3：誤。ビタミンC欠乏ではコラーゲン合成障害により壊血病を生じるが、くる病ではない。\n4：正。くる病はビタミンD欠乏により腸管からのCa・P吸収が低下し、骨端軟骨の石灰化が障害されて骨変形（O脚・X脚等）を生じる小児の疾患。成人では骨軟化症となる。\n5：誤。ビタミンE欠乏では抗酸化作用の低下により赤血球膜リン脂質が過酸化され溶血性貧血を生じるが、くる病ではない。", "image": false}, "issues": ["必須として妥当。F751と同じ型だが疾患・ビタミンが異なり重複ではない"], "after": {"section": "必須", "text": "小児のくる病の病態として正しいのはどれか。1つ選べ。", "choices": ["ビタミンD欠乏による骨端軟骨の石灰化障害", "ビタミンA欠乏による網膜桿体細胞の機能障害", "ビタミンB12欠乏による巨赤芽球の出現と無効造血", "ビタミンC欠乏による結合組織の脆弱化", "ビタミンE欠乏による赤血球膜リン脂質の過酸化"], "answer": ["1"], "comment": "1：正。くる病はビタミンD欠乏により腸管からのカルシウム・リンの吸収が低下し、骨端軟骨の石灰化が障害されて骨の変形（O脚・X脚など）を生じる小児の疾患である。成人では骨軟化症となる。\n2：誤。ビタミンA欠乏では網膜桿体細胞のロドプシン再合成が障害されて夜盲症を生じるが、くる病の病態ではない。\n3：誤。ビタミンB12欠乏ではDNA合成障害により巨赤芽球性貧血を生じるが、くる病の病態ではない。\n4：誤。ビタミンC欠乏ではコラーゲン合成障害により壊血病を生じるが、くる病の病態ではない。\n5：誤。ビタミンE欠乏では赤血球膜の脂質が過酸化されて溶血性貧血を生じるが、くる病の病態ではない。", "dropImage": false}, "summary": "内容は国試レベルのため変更していません。解説の表現を少し整えただけです。", "sources": ["https://www.pharm.or.jp/words/d.html"], "check": "合格"}, {"id": "F762", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "polish", "before": {"section": "必須", "text": "ビタミンB12（コバラミン）の構成成分として含まれる金属元素はどれか。1つ選べ。", "choices": ["鉄（ヘモグロビンのヘムに含まれる）", "銅（セルロプラスミンに含まれる）", "亜鉛（亜鉛フィンガーモチーフに含まれる）", "コバルト（コリン環の中心に配位する）", "セレン（グルタチオンペルオキシダーゼに含まれる）"], "answer": ["4"], "comment": "1：誤。鉄はヘモグロビンのヘム、ミオグロビン、シトクロム等に含まれるが、ビタミンB12には含まれない。\n2：誤。銅はセルロプラスミン、チロシナーゼ等に含まれるが、ビタミンB12には含まれない。\n3：誤。亜鉛は転写因子の亜鉛フィンガーモチーフや多数の酵素に含まれるが、ビタミンB12には含まれない。\n4：正。ビタミンB12（コバラミン）はコリン環（4つのピロール環からなる大環状化合物）の中心にコバルト（Co）が配位した構造をもつ。メチルマロニルCoAムターゼやメチオニン合成酵素の補酵素として機能する。\n5：誤。セレンはグルタチオンペルオキシダーゼ等のセレノシステイン含有酵素に含まれるが、ビタミンB12には含まれない。", "image": false}, "issues": ["選択肢に括弧書きの補足があり、正答4だけが『コリン環の中心に配位する』とB12の構造そのものを述べていて答えが透けて見える", "必須の選択肢としては長すぎる"], "after": {"section": "必須", "text": "ビタミンB12の分子に含まれる金属元素はどれか。1つ選べ。", "choices": ["コバルト", "鉄", "銅", "亜鉛", "セレン"], "answer": ["1"], "comment": "1：正。ビタミンB12（コバラミン）はコリン環の中心にコバルトが配位した化合物の総称である。メチルマロニルCoAムターゼやメチオニン合成酵素の補酵素として働く。\n2：誤。鉄はヘモグロビンのヘム、ミオグロビン、シトクロムなどに含まれるが、ビタミンB12には含まれない。\n3：誤。銅はセルロプラスミンやシトクロムcオキシダーゼなどに含まれるが、ビタミンB12には含まれない。\n4：誤。亜鉛は亜鉛フィンガーをもつ転写因子や多くの酵素に含まれるが、ビタミンB12には含まれない。\n5：誤。セレンはグルタチオンペルオキシダーゼなどのセレノタンパク質にセレノシステインとして含まれるが、ビタミンB12には含まれない。", "dropImage": false}, "summary": "選択肢の括弧書きで正答（コリン環の中心に配位）が分かってしまうため、括弧書きをすべて削除して元素名だけにし、補足は解説に移しました。問題文の「（コバラミン）」も「コバルト」を連想させるので外しました。", "sources": ["https://www.pharm.or.jp/words/b12.html"], "check": "合格"}, {"id": "F779", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "polish", "before": {"section": "必須", "text": "ビタミンDの活性化において最終段階の1α-水酸化が行われる臓器はどれか。1つ選べ。", "choices": ["肝臓（25-水酸化を行う臓器）", "腎臓（1α-水酸化を行う臓器）", "皮膚（紫外線による光化学反応が起こる部位）", "小腸（カルシウム吸収が行われる部位）", "骨（カルシウムが沈着する組織）"], "answer": ["2"], "comment": "1：誤。肝臓ではビタミンDの25位の水酸化（CYP2R1等）が行われ25-ヒドロキシビタミンD（25(OH)D₃）が生成される。これは中間体であり最終活性化ではない。\n2：正。腎臓の近位尿細管において1α-ヒドロキシラーゼ（CYP27B1）により25(OH)D₃が1α位で水酸化され、最も活性の高い1α,25-ジヒドロキシビタミンD₃（カルシトリオール）が生成される。\n3：誤。皮膚では紫外線（UV-B）照射により7-デヒドロコレステロールからプレビタミンD₃が生成される。これはビタミンD合成の最初の段階。\n4：誤。小腸は活性型ビタミンDの作用部位（Ca吸収促進）であるが、ビタミンDの活性化が行われる臓器ではない。\n5：誤。骨は活性型ビタミンDの作用部位（Ca動員）であるが、活性化の場ではない。", "image": false}, "issues": ["正答2の選択肢に『（1α-水酸化を行う臓器）』と答えそのものが書かれており、問題として成立していない", "他の肢の括弧書きも作用部位を説明しており、必須の選択肢として長すぎる"], "after": {"section": "必須", "text": "ビタミンDの活性化において、1α位の水酸化が主に行われる臓器はどれか。1つ選べ。", "choices": ["肝臓", "皮膚", "腎臓", "小腸", "骨"], "answer": ["3"], "comment": "1：誤。肝臓ではビタミンDの25位が水酸化されて25-ヒドロキシビタミンDとなる。これは血中に多い中間体で、活性型ではない。\n2：誤。皮膚では紫外線（UV-B）により7-デヒドロコレステロールからプレビタミンD3が生じ、ビタミンD3となる。皮膚にも1α-水酸化酵素は発現するが局所での作用にとどまり、血中の活性型ビタミンDは主に腎臓で生成される。\n3：正。腎臓の近位尿細管で1α-ヒドロキシラーゼ（CYP27B1）により25-ヒドロキシビタミンDの1α位が水酸化され、活性型の1α,25-ジヒドロキシビタミンD（カルシトリオール）が生成する。\n4：誤。小腸は活性型ビタミンDの作用部位（カルシウム吸収の促進）であり、活性化の場ではない。\n5：誤。骨は活性型ビタミンDの作用部位であり、活性化の場ではない。\nポイント：慢性腎不全では1α位の水酸化が低下するため、アルファカルシドールなどの活性型ビタミンD製剤が用いられる。", "dropImage": false}, "summary": "正答の選択肢に「1α-水酸化を行う臓器」と答えそのものが書かれていたため、括弧書きをすべて削除して臓器名だけにしました。腎臓以外の組織でも1α位の水酸化はわずかに起こるので、問題文に「主に」を入れて正答が一つに決まるようにしました。", "sources": ["https://www.pharm.or.jp/words/d.html", "https://www.yodosha.co.jp/jikkenigaku/keyword/1180.html"], "check": "小修正のうえ合格", "checkNote": "問題・正答は問題ない（「主に」があるため一意）。ただし解説3の「1α位の水酸化は行われない」は不正確。皮膚のケラチノサイトにも1α-水酸化酵素（CYP27B1）が発現し、局所で活性型ビタミンDが生成される（マクロファージなど他の腎外組織も同様）。"}, {"id": "F780", "lec": 2, "lecTitle": "第2回 ビタミンと欠乏症", "verdict": "polish", "before": {"section": "必須", "text": "腸内細菌により合成されるビタミンはどれか。1つ選べ。", "choices": ["ビタミンA（レチノール、動物性食品に多い）", "ビタミンC（アスコルビン酸、野菜・果物に多い）", "ビタミンD（コレカルシフェロール、皮膚で紫外線により合成）", "ビタミンK₂（メナキノン類、腸内細菌により合成）", "ビタミンE（トコフェロール、植物油に多い）"], "answer": ["4"], "comment": "1：誤。ビタミンA（レチノール）は腸内細菌では合成されない。動物性食品（レバー、ウナギ等）やプロビタミンA（β-カロテン、緑黄色野菜）から摂取する。\n2：誤。ビタミンCは腸内細菌では合成されない。ヒトはL-グロノラクトンオキシダーゼを欠損しているためビタミンCを体内で合成できず、食事からの摂取が必須。\n3：誤。ビタミンD₃は皮膚で紫外線照射により7-デヒドロコレステロールから合成されるが、腸内細菌による合成ではない。\n4：正。ビタミンK₂（メナキノン類）は大腸の腸内細菌（Bacteroides属等）により合成される。そのため通常の食事をしている健常者ではビタミンK欠乏症は起こりにくい。ただし抗生物質の長期投与で腸内細菌叢が破綻した場合や新生児（腸内細菌叢が未発達）では欠乏しうる。\n5：誤。ビタミンEは腸内細菌では合成されない。植物油（アーモンド、大豆油等）に多く含まれる。", "image": false}, "issues": ["正答4の選択肢に『（メナキノン類、腸内細菌により合成）』と答えそのものが書かれており、問題として成立していない", "他の肢の括弧書きも主な供給源を述べており、必須の選択肢として長すぎる"], "after": {"section": "必須", "text": "ヒトの腸内細菌によって合成され、体内への供給源の一つとなるビタミンはどれか。1つ選べ。", "choices": ["ビタミンA", "ビタミンC", "ビタミンD", "ビタミンK", "ビタミンE"], "answer": ["4"], "comment": "1：誤。ビタミンAは腸内細菌では合成されない。レバーなどの動物性食品や、緑黄色野菜のβ-カロテン（プロビタミンA）から摂取する。\n2：誤。ビタミンCは腸内細菌では合成されない。ヒトはL-グロノ-γ-ラクトンオキシダーゼを欠くため体内で合成できず、野菜・果物などから摂取する必要がある。\n3：誤。ビタミンD3は皮膚で紫外線により7-デヒドロコレステロールから合成されるが、腸内細菌による合成ではない。\n4：正。ビタミンK2（メナキノン類）は腸内細菌によって合成される。腸内細菌叢が未発達な新生児や、抗菌薬を長期間使用している人では欠乏しやすい。\n5：誤。ビタミンEは腸内細菌では合成されない。植物油や種実類から摂取する。", "dropImage": false}, "summary": "正答の選択肢に「腸内細菌により合成」と答えそのものが書かれていたため、括弧書きを削除し、全選択肢を「ビタミン＋記号」にそろえました（「K2」も「K」にして目立たないようにしています）。主な供給源などの補足は解説に移しました。", "sources": ["https://www.pharm.or.jp/words/k.html", "https://bifidus-fund.jp/keyword/kw073.shtml", "https://www.pharm.or.jp/words/c.html"], "check": "合格"}, {"id": "F228", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ミネラルに関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["鉄の吸収は、ビタミンCにより促進される", "カルシウムの吸収は、ビタミンDにより抑制される", "亜鉛の欠乏は、味覚障害の原因となる", "ナトリウムの過剰摂取は、低血圧の原因となる", "ヨウ素の欠乏は、鉄欠乏性貧血の原因となる"], "answer": ["1", "3"], "comment": "1：正。ビタミンCはFe³⁺（非ヘム鉄）をFe²⁺に還元し、小腸からの吸収を促進する。\n2：誤。ビタミンDはカルシウムの吸収を促進する。小腸でのCa²⁺吸収に関わるカルシウム結合タンパク質の発現を誘導する。\n3：正。亜鉛は味蕾の味覚受容体や細胞分裂に関与しており、欠乏すると味覚障害や創傷治癒遅延を生じる。\n4：誤。ナトリウムの過剰摂取は高血圧の原因となる。食事摂取基準では食塩相当量の目標量が設定されている。\n5：誤。ヨウ素の欠乏は甲状腺機能低下症（甲状腺腫）の原因となる。鉄欠乏性貧血は鉄の欠乏が原因である。", "image": false}, "issues": ["正答以外の4肢が、Ca吸収をビタミンDが「抑制」、Naで「低血圧」と単純に反転させたものと、ヨウ素→鉄欠乏性貧血という明らかに無関係な組合せで、知識がなくても消去できる", "鉄・Ca・亜鉛・Na・ヨウ素を浅く並べただけで、F629・F246・F480・F245などと知識点がすべて重なる", "解説3の「亜鉛は味蕾の味覚受容体…に関与」は不正確（亜鉛は味細胞の代謝回転に必要）"], "after": {"section": "理論", "text": "微量元素と、それを構成成分（補因子）とする酵素との組合せのうち、正しいのはどれか。2つ選べ。", "choices": ["銅 ― 炭酸脱水酵素", "モリブデン ― 亜硫酸オキシダーゼ", "亜鉛 ― キサンチンオキシダーゼ", "マンガン ― アルギナーゼ", "コバルト ― グルタチオンペルオキシダーゼ"], "answer": ["2", "4"], "comment": "1：誤。炭酸脱水酵素は亜鉛を含む酵素である。銅を含む酵素・タンパク質にはシトクロムcオキシダーゼ、Cu,Zn-SOD、セルロプラスミンなどがある。\n2：正。モリブデンはモリブデン補欠因子として、亜硫酸オキシダーゼ（亜硫酸→硫酸）、キサンチンオキシダーゼ、アルデヒドオキシダーゼに含まれる。\n3：誤。キサンチンオキシダーゼは、モリブデン（モリブデン補欠因子）、鉄硫黄クラスター、FADを含む。亜鉛を含む酵素には炭酸脱水酵素、アルコールデヒドロゲナーゼ、アルカリホスファターゼなどがある。\n4：正。マンガンは、尿素回路でアルギニンを尿素とオルニチンに分解するアルギナーゼや、ミトコンドリアのMn-SODの構成成分である。\n5：誤。グルタチオンペルオキシダーゼはセレンをセレノシステインとして含む。コバルトはビタミンB12（コバラミン）の構成成分である。", "dropImage": false}, "summary": "鉄・Ca・亜鉛・Na・ヨウ素を浅く並べた問題は他問と知識点が重なり、誤答肢も単純な反転だったため、講義回に欠けていた「微量元素と酵素の組合せ」の問題に作り直しました。過去問097226と同じ型ですが、亜硫酸オキシダーゼ・アルギナーゼを正答にし、誤答肢は実在の酵素の元素を入れ替えたものにしています。", "sources": ["https://www.mhlw.go.jp/shingi/2009/05/dl/s0529-4ao.pdf", "https://hfnet.nibn.go.jp/mineral/detail681/", "https://www.jstage.jst.go.jp/article/brte/21/1/21_38/_pdf", "https://www.mhlw.go.jp/shingi/2009/05/dl/s0529-4am.pdf"], "check": "小修正のうえ合格", "checkNote": "選択肢4「亜鉛 ― シトクロムcオキシダーゼ」は国試の水準では誤り（銅酵素）と扱われるが、哺乳類（ウシ心筋）のシトクロムcオキシダーゼはサブユニットVbに構造亜鉛を1原子含むことが結晶構造で確認されている。「構成成分（補因子）とする」と問うているので、詳しい受験生ほど迷う。解説4の「銅とヘム鉄を含む」も亜鉛・マグネシウムに触れていない。"}, {"id": "F236", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "鉄欠乏性貧血に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["鉄欠乏性貧血では、平均赤血球容積（MCV）が増大する大球性貧血を呈する", "ヘム鉄は非ヘム鉄に比べて小腸からの吸収率が高い", "血清フェリチン値は、体内貯蔵鉄量を反映する指標である", "鉄の吸収は胃酸分泌の低下により促進される", "月経のある女性は、男性よりも鉄の必要量が少ない"], "answer": ["2", "3"], "comment": "1：誤。鉄欠乏性貧血ではMCVが低下する小球性低色素性貧血を呈する。大球性貧血はビタミンB12や葉酸の欠乏で見られる。\n2：正。ヘム鉄（肉・魚に含まれる）はヘムトランスポーターにより直接吸収され、吸収率は15〜25%と高い。非ヘム鉄（植物性食品）はFe²⁺に還元されて吸収され、吸収率は2〜5%と低い。\n3：正。フェリチンは貯蔵鉄タンパク質であり、血清フェリチン値は体内鉄貯蔵量の最も鋭敏な指標である。鉄欠乏では最も早期に低下する。\n4：誤。胃酸はFe³⁺をFe²⁺に還元して可溶化し、吸収を促進する。胃酸分泌の低下は鉄の吸収を阻害する。\n5：誤。月経のある女性は月経による鉄損失があるため、男性よりも鉄の必要量が多い。食事摂取基準でも月経あり女性のEARは高く設定されている。", "image": false}, "issues": ["MCV「増大」、胃酸低下で「促進」、月経女性の必要量が「少ない」はどれも単純な反転で、語感で消去できる", "F475（小球性・フェリチン）、F629（ヘム鉄/非ヘム鉄・ビタミンC）と知識点が重なる", "解説2のヘム鉄15〜25%、非ヘム鉄2〜5%は資料によって幅があり、数値を断定する根拠には向かない", "解説4「胃酸はFe³⁺をFe²⁺に還元して可溶化し」は誤り。胃酸はFe³⁺を可溶な状態に保つ働きをし、Fe²⁺への還元は十二指腸の膜結合型還元酵素（Dcytb）やアスコルビン酸による"], "after": {"section": "実践", "text": "22歳女性。大学生。半年前から減量のため朝食を抜き、昼食はサラダとパン、夕食は野菜中心の少量の食事にしている。食事中や食後に緑茶をよく飲む。月経は規則的にある。最近、階段を上ると息切れがするため受診した。（検査値）Hb 9.6 g/dL（基準値 11.6〜14.8）、MCV 70 fL（基準値 83.6〜98.2）、血清鉄 22 µg/dL（基準値 40〜188）、総鉄結合能（TIBC）450 µg/dL（高値）、血清フェリチン 4 ng/mL（低値）　この女性の病態と鉄の栄養に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["血清フェリチンの低値は、貯蔵鉄が減少していることを示している", "食事とともに飲む緑茶は、非ヘム鉄の吸収を妨げる要因となる", "検査値からは、葉酸の欠乏による大球性貧血が疑われる", "食事摂取基準（2025年版）の鉄の推奨量は、月経の有無で区別されていない", "食事摂取基準（2025年版）では、成人の鉄に耐容上限量が設定されている"], "answer": ["1", "2"], "comment": "1：正。フェリチンは肝臓・脾臓・骨髄などで鉄を貯蔵するタンパク質で、血清フェリチン値は貯蔵鉄量を反映する。鉄欠乏では貧血が現れる前の段階から低下する。\n2：正。茶に含まれるタンニンなどのポリフェノールは非ヘム鉄の吸収を妨げる。野菜やパンが中心の食事では鉄の大部分が非ヘム鉄であり、その影響を受けやすい。\n3：誤。MCV 70 fLは小球性であり、血清鉄低値・TIBC高値・フェリチン低値とあわせて鉄欠乏性貧血と判断される。葉酸やビタミンB12の欠乏では大球性貧血となる。\n4：誤。日本人の食事摂取基準（2025年版）では、18〜29歳女性の鉄の推奨量は月経なしで6.0 mg/日、月経ありで10.0 mg/日と、月経の有無で分けて示されている。\n5：誤。2025年版では鉄の耐容上限量は削除され、設定されていない。ただし、推奨量を大きく超える摂取は、貧血の治療などを目的とする場合を除き控えるべきとされている。\nポイント：小球性貧血で、血清鉄低値・TIBC高値・血清フェリチン低値がそろえば鉄欠乏性貧血と判断できる。", "dropImage": false}, "summary": "単純な反転の誤答肢が多く、F475・F629と知識点が重なっていたため、検査値を読ませる実践の事例問題（2つ選べ）に作り直しました。誤答肢には、2025年版での変更点（鉄の耐容上限量の削除、月経の有無で異なる推奨量）を入れています。もとの解説4の「胃酸がFe³⁺をFe²⁺に還元する」という誤りは削除しました。", "sources": ["https://hfnet.nibn.go.jp/mineral/detail675/", "https://nsmc.hosp.go.jp/Journal/2017-7/SMCJ2017-7_review01.pdf", "https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf", "https://www.dobun.co.jp/scbookdata/stofcj2025.pdf", "https://sndj-web.jp/news/003031.php", "https://jcog.jp/assets/JCOG_kyouyoukijunchi.pdf"], "check": "合格"}, {"id": "F245", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ヨウ素に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ヨウ素は海藻類では数µg/g程度の微量にとどまり、主な供給源は乳製品や魚介類とされる", "ヨウ素の欠乏は、甲状腺機能亢進症（バセドウ病）の原因となる", "日本人はヨウ素摂取量が世界的に見て少ない集団である", "ヨウ素の過剰摂取による健康影響は知られていない", "ヨウ素は甲状腺ホルモン（T₃、T₄）の構成成分である"], "answer": ["5"], "comment": "1：誤。海藻類、特に昆布はヨウ素含量が非常に高い食品である。\n2：誤。ヨウ素欠乏は甲状腺機能低下症および甲状腺腫の原因となる。バセドウ病は自己免疫疾患であり、ヨウ素欠乏とは直接関係しない。\n3：誤。日本人は海藻類（昆布、わかめ等）を多く摂取するため、世界的に見てヨウ素摂取量が多い集団である。\n4：誤。ヨウ素の過剰摂取は甲状腺機能低下症を引き起こすことがある（Wolff-Chaikoff効果）。食事摂取基準で耐容上限量が設定されている。\n5：正。ヨウ素は甲状腺ホルモンであるトリヨードチロニン（T₃：ヨウ素3個）およびチロキシン（T₄：ヨウ素4個）の構成成分である。甲状腺に集積し、チロシンのヨウ素化を経て合成される。", "image": false}, "issues": ["肢1は「海藻は数µg/gの微量」（誤り）と「主な供給源は乳製品や魚介類」（欧米では正しい）の2つの論点を1肢に入れており、半分だけ正しい", "肢2・4はバセドウ病・「知られていない」と単純で、肢4は絶対化に近い表現", "F478と同じ知識点（構成成分・日本人の摂取量・過剰症）を同じ角度で問うている", "肢1の前半は誤り（刻み昆布は約230,000 µg/100 g）。後半は欧米の食事なら正しいので、誤りの根拠が一つに定まらない"], "after": {"section": "理論", "text": "ヨウ素に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["甲状腺ホルモンは、サイログロブリンのトリプトファン残基がヨウ素化されて合成される", "欠乏しても、過剰に摂取しても甲状腺腫を生じることがある", "妊婦・授乳婦の耐容上限量は、非妊娠時の成人より高い値に設定されている", "食事摂取基準（2025年版）では、成人の耐容上限量は3,000 µg/日である", "ヨウ素欠乏による甲状腺腫は、甲状腺ホルモンの分泌過剰によって生じる"], "answer": ["2", "4"], "comment": "1：誤。甲状腺ホルモン（T₄、T₃）は、サイログロブリンのチロシン残基がヨウ素化され、縮合して合成される。\n2：正。ヨウ素欠乏では甲状腺ホルモンの合成が減り、下垂体からのTSH分泌が増えて甲状腺腫を生じる。過剰摂取が続いた場合も、甲状腺機能低下症や甲状腺腫を生じることがある。\n3：誤。妊婦・授乳婦の耐容上限量は2,000 µg/日で、非妊娠時の成人（3,000 µg/日）より低く設定されている。\n4：正。日本人の食事摂取基準（2025年版）では、18歳以上の耐容上限量は3,000 µg/日である。日本人は昆布などの海藻から多くのヨウ素を摂っており（刻み昆布には約230,000 µg/100 g）、食事からの摂取量は1〜3 mg/日と推定され、推奨量（成人140 µg/日）を大きく上回る。\n5：誤。ヨウ素欠乏では甲状腺ホルモンが不足し、TSHの刺激によって甲状腺が肥大する。妊娠中の重いヨウ素欠乏は、児のクレチン症（精神発達の遅れを伴う甲状腺機能低下）の原因となる。\nポイント：ヨウ素の過剰症は甲状腺機能低下と甲状腺腫が中心だが、甲状腺中毒症や機能亢進を起こすこともある。", "dropImage": false}, "summary": "F478を統合し、1つ選べから「2つ選べ」に変えました。もとの肢1は「海藻のヨウ素は微量」（誤）と「乳製品・魚介が主な供給源」（欧米では正）が1肢に混在していたため削除し、欠乏・過剰いずれでも起こる甲状腺腫、2025年版の耐容上限量（成人3,000 µg、妊婦・授乳婦2,000 µg）、ホルモン合成（チロシン）を問う形にしました。F478で正答が揺れた「過剰で甲状腺機能が亢進する」点は選択肢にせず、ポイントで補っています。", "sources": ["https://hfnet.nibn.go.jp/mineral/detail680/", "https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf"], "check": "合格"}, {"id": "F246", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "polish", "before": {"section": "理論", "text": "微量元素の欠乏症に関する記述のうち、正しい組合せはどれか。1つ選べ。", "choices": ["亜鉛欠乏 — メンケス病、銅欠乏 — 克山病、セレン欠乏 — 味覚障害", "亜鉛欠乏 — 甲状腺腫、銅欠乏 — ペラグラ、セレン欠乏 — 壊血病", "亜鉛欠乏 — 克山病、銅欠乏 — 味覚障害、セレン欠乏 — メンケス病", "亜鉛欠乏 — 味覚障害、銅欠乏 — メンケス病、セレン欠乏 — 克山病", "亜鉛欠乏 — 壊血病、銅欠乏 — 克山病、セレン欠乏 — 甲状腺腫"], "answer": ["4"], "comment": "1：誤。組合せが逆になっている。\n2：誤。甲状腺腫はヨウ素欠乏、ペラグラはナイアシン欠乏、壊血病はビタミンC欠乏である。\n3：誤。克山病はセレン欠乏、味覚障害は亜鉛欠乏、メンケス病は銅欠乏である。\n4：正。亜鉛欠乏→味覚障害（味蕾細胞の新陳代謝障害）・皮膚炎・成長遅延。銅欠乏→メンケス病（先天性銅吸収障害、毛髪異常・知的障害）・貧血。セレン欠乏→克山病（心筋症、中国で報告）・カシン・ベック病（関節症）。\n5：誤。壊血病はビタミンC欠乏、甲状腺腫はヨウ素欠乏である。", "image": false}, "issues": ["組合せ型で国試に近い形だが、誤りの組合せのうち2・5（ペラグラ・壊血病・甲状腺腫）はビタミンやヨウ素の欠乏症で、ミネラルの知識が曖昧でも消去できる", "解説1が「組合せが逆」だけで、根拠が書かれていない"], "after": {"section": "理論", "text": "微量元素と、その欠乏によって生じる疾患・症状の組合せとして、正しいのはどれか。1つ選べ。", "choices": ["亜鉛 ― 味覚障害、銅 ― メンケス病、セレン ― 克山病", "亜鉛 ― 腸性肢端皮膚炎、銅 ― ウィルソン病、セレン ― 克山病", "亜鉛 ― 克山病、銅 ― メンケス病、セレン ― 味覚障害", "亜鉛 ― メンケス病、銅 ― 腸性肢端皮膚炎、セレン ― カシン・ベック病", "亜鉛 ― 腸性肢端皮膚炎、銅 ― カシン・ベック病、セレン ― 味覚障害"], "answer": ["1"], "comment": "1：正。亜鉛欠乏では味細胞の新生が妨げられて味覚障害を生じる。メンケス病はATP7A遺伝子の異常により腸管からの銅の吸収が障害され、銅欠乏状態となる疾患である。克山病は中国東北部の低セレン地域でみられたセレン欠乏による心筋症である。\n2：誤。亜鉛と腸性肢端皮膚炎、セレンと克山病の組合せは正しいが、ウィルソン病は銅の胆汁中への排泄障害により銅が蓄積する疾患で、欠乏症ではない。\n3：誤。克山病はセレン欠乏、メンケス病は銅欠乏、味覚障害は亜鉛欠乏による。\n4：誤。メンケス病は銅の欠乏、腸性肢端皮膚炎（SLC39A4〔ZIP4〕遺伝子の異常による亜鉛の吸収障害）は亜鉛の欠乏による。カシン・ベック病はセレン欠乏との関連が知られる。\n5：誤。カシン・ベック病はセレン欠乏、味覚障害は亜鉛欠乏との関連が知られる。腸性肢端皮膚炎は亜鉛の欠乏による。", "dropImage": false}, "summary": "組合せ型の形式は維持し、ペラグラ・壊血病・甲状腺腫など他の栄養素の欠乏症を外して、亜鉛・銅・セレンに関わる疾患（腸性肢端皮膚炎、カシン・ベック病、ウィルソン病）の入れ替えだけで誤答肢を作り直しました。解説1にも根拠を書き、メンケス病はATP7Aの異常による銅の吸収障害と正確に記載しています。", "sources": ["https://www.shouman.jp/disease/details/08_08_112/", "https://grj.umin.jp/grj/atp7a.htm", "https://www.mhlw.go.jp/file/06-Seisakujouhou-10900000-Kenkoukyoku/0000101049.pdf", "https://www.mhlw.go.jp/shingi/2009/05/dl/s0529-4am.pdf", "https://hfnet.nibn.go.jp/mineral/detail672/"], "check": "合格"}, {"id": "F247", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "カルシウムとリンの代謝に関する記述のうち、誤っているのはどれか。1つ選べ。", "choices": ["血中カルシウム濃度は、パラソルモン（PTH）とカルシトニンにより調節されている", "パラソルモンは、骨吸収を促進し血中カルシウム濃度を上昇させる", "カルシトニンは甲状腺C細胞から分泌され、血中カルシウム濃度を低下させる", "リンの過剰摂取は、カルシウムの吸収を促進する", "牛乳・乳製品は、カルシウムの吸収率が高い食品群である"], "answer": ["4"], "comment": "1：正。血中Ca²⁺濃度は、副甲状腺ホルモン（PTH：上昇作用）、カルシトニン（低下作用）、活性型ビタミンD₃（上昇作用）の3つのホルモンにより厳密に調節されている。\n2：正。PTHは破骨細胞を活性化して骨吸収を促進し、腎臓でのCa²⁺再吸収を増加させ、血中Ca²⁺濃度を上昇させる。また腎臓での1α-水酸化酵素を活性化してビタミンD₃の活性化も促進する。\n3：正。カルシトニンは甲状腺の傍濾胞細胞（C細胞）から分泌され、破骨細胞の機能を抑制して骨吸収を阻害し、血中Ca²⁺濃度を低下させる。\n4：誤。リンの過剰摂取はカルシウムの吸収を阻害する。Ca/P比が不適切になると腸管でリン酸カルシウムを形成し、Ca²⁺の吸収効率が低下する。加工食品のリン酸塩過剰摂取が問題視されている。\n5：正。牛乳・乳製品のカルシウム吸収率は約40%と高く、小魚（約33%）や野菜（約19%）と比べて吸収効率が良い。", "image": false}, "issues": ["肢1「PTHとカルシトニンにより調節」は活性型ビタミンDが抜けており、「誤っているもの」を選ぶ問題では正誤の判断が揺れる", "肢4（リン過剰でCa吸収促進）がF476肢3・F652肢2と同じで、3問重複している", "肢5の吸収率（牛乳約40%など）は解説だけにある数値で、論点が散っている"], "after": {"section": "理論", "text": "血中カルシウム濃度の調節に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["カルシトニンは、副甲状腺から分泌されて骨吸収を抑制する", "PTHは、腎尿細管でのリン酸の再吸収を促進する", "副甲状腺ホルモン（PTH）は、腎臓での活性型ビタミンDの産生を促進する", "低カルシウム血症では、神経・筋の興奮性が高まってテタニーを起こす", "血中カルシウムのうち、生理活性を示すのは主にアルブミン結合型である"], "answer": ["3", "4"], "comment": "1：誤。カルシトニンは甲状腺の傍濾胞細胞（C細胞）から分泌され、破骨細胞による骨吸収を抑えて血中Ca²⁺濃度を下げる。副甲状腺から分泌されるのはPTHである。\n2：誤。PTHは近位尿細管のナトリウム-リン共輸送体によるリン酸の再吸収を抑制し、尿中へのリン酸排泄を増やす。一方、遠位尿細管ではCa²⁺の再吸収を促進する。\n3：正。PTHは腎臓の1α-水酸化酵素を活性化し、25-ヒドロキシビタミンDから活性型の1α,25-ジヒドロキシビタミンDの産生を促す。活性型ビタミンDは小腸でのカルシウム吸収を高める。\n4：正。細胞外液のCa²⁺濃度が下がると神経・筋細胞の興奮性が高まり、テタニー（手足の筋の強直性けいれん）を起こす。\n5：誤。血中カルシウムの約40%はアルブミンなどのタンパク質と結合しており、生理活性を示すのはイオン化（遊離）カルシウム（総カルシウムの約50%）である。", "dropImage": false}, "summary": "「誤っているもの」を選ぶ形で、肢1（活性型ビタミンDの記載漏れ）の正誤が揺れ、F476・F652と「リン過剰でCa吸収促進」が重複していたため、Ca調節ホルモンの作用部位と機序を比べる「2つ選べ」に作り直しました。リン過剰とCa吸収の論点はF476に移し、本問ではPTHのリン利尿作用やイオン化Caなど別の角度を問うています。", "sources": ["https://jsn.or.jp/journal/document/56_8/1201-1209.pdf", "https://data.medience.co.jp/guide/guide-03030001.html", "https://www.msdmanuals.com/ja-jp/professional/10-内分泌疾患と代謝性疾患/電解質障害/カルシウム濃度の異常の概要"], "check": "合格"}, {"id": "F248", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "ナトリウムとカリウムに関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["食塩摂取量の目標量は、成人男性で7.5 g/日未満である", "カリウムの摂取は、ナトリウムの腎臓からの排泄を促進し血圧降下に寄与する", "日本人の食塩摂取量は平均7 g/日以下であり目標量を十分に下回っている", "カリウムは主に細胞外液に分布し血清濃度は3.5〜5.0 mEq/Lに維持される", "高血圧患者でもナトリウム摂取量を10 g/日以上に維持することが推奨される"], "answer": ["1", "2"], "comment": "1：正。日本人の食事摂取基準（2025年版）でも、食塩相当量の目標量は成人男性7.5 g/日未満、成人女性6.5 g/日未満であり、2020年版から据え置かれている。なお高血圧の重症化予防のためには6.0 g/日未満が示されている。\n2：正。カリウムはナトリウムの腎排泄を促進し、血圧降下作用がある。野菜・果物の摂取が推奨される。\n3：誤。日本人の食塩摂取量は平均約10 g/日であり、目標量を大幅に超過している。\n4：誤。カリウムは主に細胞内液に分布する（約98%）。細胞外液に主に分布するのはナトリウムである。血清カリウム濃度は3.5〜5.0 mEq/Lに維持されるが、これは細胞外の少量部分である。\n5：誤。高血圧患者では減塩（6 g/日未満）が推奨されており、10 g/日以上の摂取は推奨されない。", "image": false}, "issues": ["肢4は「主に細胞外液に分布」（誤）と「血清濃度3.5〜5.0 mEq/L」（正）を合わせた半分だけ正しい肢", "肢5（高血圧患者に10 g/日以上を推奨）はありえない内容で、攪乱肢として働かない", "肢2がF651肢1と同じ内容", "解説3「日本人の食塩摂取量は平均約10 g/日」は最新値に合わない。令和6年国民健康・栄養調査（2026年1月公表）では平均9.6 g（男性10.5 g、女性8.9 g）、令和5年は9.8 g"], "after": {"section": "理論", "text": "健康な40歳女性（高血圧や腎臓病はない）の1日の食事を日本食品標準成分表を用いて計算したところ、ナトリウム摂取量は3,150 mgであった。この女性の食塩相当量と、日本人の食事摂取基準（2025年版）の目標量との関係として、正しいのはどれか。1つ選べ。", "choices": ["食塩相当量は約1.2 gで、目標量を下回っている", "食塩相当量は約3.2 gで、目標量を下回っている", "食塩相当量は約8.0 gで、目標量を約0.5 g上回っている", "食塩相当量は約8.0 gで、目標量を約1.5 g上回っている", "食塩相当量は約8.0 gで、目標量を約2.0 g上回っている"], "answer": ["4"], "comment": "1：誤。3,150 mg÷2.54÷1,000≒1.2 gで、換算係数で割ってしまった値である。食塩相当量（g）＝ナトリウム（mg）×2.54÷1,000で求める。\n2：誤。ナトリウム量3,150 mgをそのまま約3.2 gとした値で、NaClとNaの質量比（58.5÷23.0≒2.54）を掛けていない。\n3：誤。目標量7.5 g/日未満は成人男性の値である。\n4：正。3,150×2.54÷1,000≒8.0 g。成人女性の目標量は6.5 g/日未満なので、約1.5 g上回っている。なお、令和6年国民健康・栄養調査では、20歳以上女性の食塩摂取量の平均値は8.9 gであった。\n5：誤。6.0 g/日未満は、高血圧及び慢性腎臓病（CKD）の重症化予防のための量であり、この女性には当てはまらない。\nポイント：食品表示基準の栄養成分表示でも、食塩相当量は同じ式（ナトリウム×2.54÷1,000）で算出する。", "dropImage": false}, "summary": "肢4が半分だけ正しい内容で、「食塩摂取量は平均約10 g」も最新値に合っていなかったため、講義回に1問もなかった食塩相当量の計算問題に作り直しました。誤答肢は、2.54の掛け忘れ・割り算、男性の目標量や重症化予防の6.0 gとの比較など、計算や基準の取り違えで生じる値にしています。解説に令和6年国民健康・栄養調査の女性平均8.9 gを添えました。なお、食塩を添加した加工食品はナトリウム単独での表示が認められないため、栄養成分表示ではなく成分表による計算という設定にしています。", "sources": ["https://www.hokeniryo1.metro.tokyo.lg.jp/shokuhin/hyouji/shokuhyouhou_eiyou_houhou.html", "https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf", "https://www.mhlw.go.jp/content/10900000/001603146.pdf"], "check": "合格"}, {"id": "F475", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "polish", "before": {"section": "必須", "text": "鉄欠乏性貧血に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["巨赤芽球性貧血とも呼ばれる", "血清フェリチン値は上昇する", "ビタミンB12の補充で改善する", "小球性低色素性貧血を呈する", "溶血性貧血と同義である"], "answer": ["4"], "comment": "1：誤。巨赤芽球性貧血は葉酸やビタミンB12の欠乏による貧血である。\n2：誤。鉄欠乏性貧血では鉄の貯蔵量を反映する血清フェリチン値は低下する。\n3：誤。鉄欠乏性貧血は鉄剤の補充で改善する。ビタミンB12の補充は巨赤芽球性貧血に対して行う。\n4：正。鉄欠乏性貧血は小球性低色素性貧血を呈する。ヘモグロビン合成に必要な鉄が不足するため、赤血球が小さく（小球性）色素が薄く（低色素性）なる。\n5：誤。溶血性貧血は赤血球の破壊（溶血）が亢進する貧血であり、鉄欠乏性貧血とは異なる。", "image": false}, "issues": ["必須として形式・長さは適切", "肢5「溶血性貧血と同義」や肢1「巨赤芽球性貧血とも呼ばれる」は貧血の分類を知らなくても消去しやすく、攪乱肢として弱い"], "after": {"section": "必須", "text": "鉄欠乏性貧血に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["総鉄結合能（TIBC）が低下する", "小球性低色素性貧血を呈する", "血清フェリチン値が上昇する", "ビタミンB12の補充で改善する", "間接ビリルビン値が上昇する"], "answer": ["2"], "comment": "1：誤。鉄欠乏ではトランスフェリンが増えるため、TIBCは上昇する。\n2：正。ヘモグロビンの合成に必要な鉄が不足するため、赤血球が小さく（小球性、MCV低値）、色素が薄く（低色素性）なる。\n3：誤。血清フェリチン値は貯蔵鉄量を反映し、鉄欠乏性貧血では低下する。\n4：誤。鉄欠乏性貧血は鉄の補充で改善する。ビタミンB12の補充は、B12欠乏による巨赤芽球性貧血に対して行う。\n5：誤。間接ビリルビン値の上昇は、赤血球の破壊が亢進する溶血性貧血でみられる所見であり、鉄欠乏性貧血ではみられない。鉄欠乏性貧血では血清鉄は低下する。", "dropImage": false}, "summary": "必須の形式はそのままに、貧血の分類を知らなくても消去しやすかった肢1（巨赤芽球性貧血）・肢5（溶血性貧血と同義）を、TIBC・血清鉄の向きを問う肢に替えました。事例での判断はF236に任せ、本問は鉄欠乏性貧血の検査所見の基本に絞っています。", "sources": ["https://hfnet.nibn.go.jp/mineral/detail675/", "https://nsmc.hosp.go.jp/Journal/2017-7/SMCJ2017-7_review01.pdf"], "check": "小修正のうえ合格", "checkNote": "誤りの選択肢4つのうち3つ（1 TIBC低下、2 フェリチン上昇、5 血清鉄上昇）が「上昇↔低下」の単純反転で、RUBRIC A-3が極力避けるとする作り方に偏っている。特に5の「血清鉄が上昇する」は、鉄欠乏という病名から語感だけで消去できる。；事実関係・正答の一意性・解説の書式には問題なし。"}, {"id": "F476", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "カルシウムの代謝とその調節に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["カルシトニンは破骨細胞を活性化して血中カルシウム濃度を上昇させる", "血中カルシウムの生理活性は主にアルブミンと結合した型が担う", "食事中のリン酸の過剰摂取は腸管でのカルシウム吸収を促進する", "副甲状腺ホルモン（PTH）は腎臓でのカルシウム再吸収を促進し、血中カルシウム濃度を上昇させる", "血中カルシウム濃度の低下は弛緩性麻痺を引き起こす"], "answer": ["4"], "comment": "1：誤。カルシトニンは破骨細胞の活性を抑制して骨吸収を抑え、血中カルシウム濃度を低下させる。血中カルシウムを上昇させるのは副甲状腺ホルモン（PTH）である。\n2：誤。血中カルシウムの約半分はイオン型（遊離型）として存在し、生理活性を担うのはこのイオン型である。アルブミン結合型は生理活性をもたない。\n3：誤。リン酸の過剰摂取は腸管で難溶性のリン酸カルシウムを形成し、カルシウムの吸収を阻害する。促進ではない。\n4：正。PTHは腎尿細管でのカルシウム再吸収促進、骨吸収促進、活性型ビタミンD生成促進を介して血中カルシウム濃度を上昇させる。\n5：誤。血中カルシウム濃度の低下（低カルシウム血症）は神経筋の興奮性を高め、テタニー（筋の強直性けいれん）を引き起こす。弛緩性麻痺ではない。", "image": false}, "issues": ["肢3がF247・F652と重複（リン過剰とCa吸収）", "肢1（カルシトニンが破骨細胞を活性化）・肢5（弛緩性麻痺）は作用の単純な反転", "F247と同じくPTH・カルシトニンの想起問題で、角度が同じ"], "after": {"section": "実践", "text": "68歳女性。52歳で閉経した。市の骨密度検診で腰椎骨密度が若年成人平均値（YAM）の68%と判定され、薬局で食生活の相談を受けた。乳製品は苦手でほとんど摂らず、カルシウム源として毎日ほうれん草のおひたしを食べている。主食は玄米で、昼食はハムやソーセージなどの加工食品が多い。この女性の食生活とカルシウムの吸収に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["納豆に多いビタミンKは、小腸でのカルシウム吸収を促進する", "ほうれん草に多いシュウ酸は、カルシウムと難溶性の塩をつくって吸収を妨げる", "牛乳のカゼインが消化されて生じるカゼインホスホペプチド（CPP）は、カルシウムの不溶化を防いで吸収を助ける", "ほうれん草のカルシウムは、牛乳のカルシウムより吸収率が高い", "食事摂取基準（2025年版）では、1,000 mg/日以上のカルシウムサプリメントの使用が勧められている"], "answer": ["2", "3"], "comment": "1：誤。小腸でのカルシウム吸収を促進するのは活性型ビタミンDである。ビタミンKはオステオカルシンのγ-カルボキシ化に必要で、骨形成に関わる。\n2：正。シュウ酸はカルシウムと難溶性のシュウ酸カルシウムをつくり、腸管からの吸収を妨げる。玄米などの穀物に多いフィチン酸や、加工食品に多いリンの過剰摂取もカルシウムの吸収を妨げる。\n3：正。カゼインの消化により生じるCPPは、腸管内でリン酸カルシウムが沈殿するのを防ぎ、カルシウムの吸収を促進する。牛乳では乳糖も吸収を助けるとされる。\n4：誤。ほうれん草のカルシウムはシュウ酸と結合して吸収されにくい。牛乳のカルシウム吸収率は約40%で、吸収率が最も高い食品の一つである。\n5：誤。日本人の食事摂取基準（2025年版）では、1,000 mg/日以上のカルシウムサプリメントの使用は心筋梗塞のリスク上昇が報告されていることから、慎重になるべきとされている。\nポイント：2025年版では骨粗鬆症が初めて取り上げられ、カルシウムや、血中25-ヒドロキシビタミンD濃度を20 ng/mL以上に保つことの重要性が示された。", "dropImage": false}, "summary": "F247と同じPTH・カルシトニンの想起問題で、リン過剰の肢も3問で重複していたため、Ca吸収の促進・阻害因子を食事内容から判断させる実践の事例問題（2つ選べ）に
