作り直しました。過去問107234（CKD・PTH高値）とは病態を変え、2025年版でのCaサプリメントへの注意と骨粗鬆症の追加も取り込んでいます。リン過剰によるCa吸収阻害は、講義回の中で本問の解説だけに残しました。", "sources": ["https://hfnet.nibn.go.jp/mineral/detail660/", "https://www.j-milk.jp/knowledge/nutrition/berohe000000oedv.html", "https://www.health.ne.jp/library/detail?slug=hcl_0300_w0305014", "https://www.kameda.com/pr/osteoporosis/post_38.html", "https://sndj-web.jp/news/003031.php", "https://hfnet.nibn.go.jp/mineral/detail661/"], "check": "小修正のうえ合格", "checkNote": "選択肢2「牛乳に含まれるカゼインホスホペプチド（CPP）」：CPPは牛乳中のカゼインが消化されて生じるペプチドであり、牛乳そのものに含まれるとは言いにくい。厳しく読む受験者が「誤」と判断する余地があり、正答の一意性がわずかに揺らぐ。；事例中の玄米（フィチン酸）や加工食品（リン）の情報は解説でしか使われておらず、選択肢3〜5は事例を読まなくても解ける。実践問題としては事例の使い方が弱い（作り直すほどではない）。；解説5（1,000 mg/日以上のカルシウムサプリメントで心筋梗塞リスク上昇の報告）とポイント（骨粗鬆症の新規収載、25-ヒドロキシビタミンD 20 ng/mL以上）は2025年版の記載と一致する。"}, {"id": "F477", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "亜鉛に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["亜鉛の欠乏は甲状腺腫を引き起こす", "亜鉛の欠乏は日本人ではみられない", "亜鉛はヘモグロビンの構成成分である", "亜鉛は脂溶性ビタミンの一種である", "亜鉛は多くの酵素の構成成分であり欠乏すると味覚障害を引き起こす"], "answer": ["5"], "comment": "1：誤。甲状腺腫はヨウ素の欠乏症である。亜鉛の欠乏症ではない。\n2：誤。高齢者や偏食者、過度のダイエットをしている人などで亜鉛欠乏がみられることがある。\n3：誤。ヘモグロビンの構成成分は鉄である。亜鉛ではない。\n4：誤。亜鉛はミネラル（微量元素）であり、ビタミンではない。\n5：正。亜鉛は300種以上の酵素の構成成分として重要であり、欠乏すると味覚障害、成長障害、皮膚炎、免疫機能低下などを引き起こす。", "image": false}, "issues": ["肢4「脂溶性ビタミンの一種」、肢3「ヘモグロビンの構成成分」は、ミネラルの知識がなくても消去できる", "肢2「日本人ではみられない」は誤答肢に絶対化表現を使っている", "正答肢5が「多くの酵素の構成成分」と「味覚障害」の2つの論点を含み、他の肢より長く具体的"], "after": {"section": "実践", "text": "76歳男性。パーキンソン病のためレボドパを長期服用している。一人暮らしで、食事はパンや麺類が中心である。数か月前から「何を食べても味が薄い」と訴えて来局した。医療機関での血液検査では、血清亜鉛 52 µg/dL（基準値 80〜130）であった。この患者の味覚障害の原因と考えられる元素に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["欠乏症として、心筋症を主徴とする克山病が知られている", "食事摂取基準（2025年版）では、通常の食品以外からの摂取に限って耐容上限量が設定されている", "成人の体内含量は、鉄の体内含量より多い", "炭酸脱水酵素やアルコールデヒドロゲナーゼの構成成分である", "欠乏の治療には、キレート作用をもつペニシラミンが用いられる"], "answer": ["4"], "comment": "1：誤。克山病は、中国東北部の低セレン地域でみられたセレン欠乏による心筋症である。\n2：誤。亜鉛の耐容上限量は、食品を含む総摂取量に対して設定されている（成人男性40〜45 mg/日、成人女性35 mg/日）。通常の食品以外からの摂取に限って耐容上限量が設定されているのはマグネシウムである。\n3：誤。体内の亜鉛は約2,000 mgで、鉄（約3〜5 g）より少ない。\n4：正。亜鉛は炭酸脱水酵素、アルコールデヒドロゲナーゼ、アルカリホスファターゼ、DNAポリメラーゼなど多くの酵素の構成成分である。味細胞の新生にも亜鉛が必要で、欠乏すると味覚障害を生じる。\n5：誤。ペニシラミンは銅のキレート剤でウィルソン病の治療に用いられ、むしろ亜鉛キレート作用により亜鉛欠乏や味覚障害の原因となる薬剤である。レボドパにも同様の作用がある。亜鉛欠乏の治療には亜鉛製剤を用いる。\nポイント：亜鉛欠乏症の診療指針2024では、血清亜鉛60 µg/dL未満を亜鉛欠乏、60〜80 µg/dL未満を潜在性亜鉛欠乏としている。", "dropImage": false}, "summary": "「脂溶性ビタミンの一種」「ヘモグロビンの構成成分」など知識なしで消去できる肢と、絶対化表現（日本人ではみられない）があったため、薬剤性の亜鉛欠乏を背景にした実践の事例問題に作り直しました。誤答肢は、セレン欠乏症、マグネシウムの耐容上限量の設定方法、体内含量、ウィルソン病の治療薬との取り違えにしています。なお、2024年改訂の診療指針で診断基準からALP低値が外れたため、事例にはALPを入れていません。", "sources": ["https://www.jstage.jst.go.jp/article/brte/21/1/21_38/_pdf", "https://hfnet.nibn.go.jp/mineral/detail672/", "https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf", "https://www.mhlw.go.jp/shingi/2009/05/dl/s0529-4am.pdf", "https://nsmc.hosp.go.jp/Journal/2017-7/SMCJ2017-7_review01.pdf", "https://pharmacista.jp/contents/skillup/academic_info/other/4198/", "https://www.mhlw.go.jp/file/06-Seisakujouhou-10900000-Kenkoukyoku/0000101049.pdf", "https://www.carenet.com/news/general/carenet/60577"], "check": "小修正のうえ合格", "checkNote": "解説3の数値に誤りがある。2025年版の亜鉛の耐容上限量は、成人女性では全年齢区分で35 mg/日（2020年版にあった75歳以上の30 mg/日はなくなった）。解説の「成人女性30〜35 mg/日」は2025年版と合わない。男性の40〜45 mg/日は正しい。；問題文・選択肢・正答には問題なし。選択肢3（マグネシウムとの取り違え）、4（鉄との体内量比較）、5（ペニシラミンの作用の取り違え）はいずれも中途半端な知識を引っかける良い攪乱肢。血清亜鉛52 µg/dLとポイントの閾値（60未満で欠乏、60〜80未満で潜在性欠乏）は診療指針2024でも変わっていない。"}, {"id": "F478", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "merge_delete", "before": {"section": "理論", "text": "ヨウ素に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["ヨウ素は甲状腺ホルモンの構成成分である", "ヨウ素の欠乏は貧血を引き起こす", "日本人はヨウ素の摂取量が不足しやすい", "ヨウ素はビタミンDの合成に必要である", "ヨウ素を過剰摂取すると、甲状腺機能を高める作用をもつ"], "answer": ["1"], "comment": "1：正。ヨウ素は甲状腺ホルモン（チロキシンT4、トリヨードチロニンT3）の構成成分であり、エネルギー代謝や成長に重要な役割を果たす。\n2：誤。ヨウ素の欠乏は甲状腺腫やクレチン症（先天性甲状腺機能低下症）を引き起こす。貧血は主に鉄の欠乏症である。\n3：誤。日本人は海藻類を多く摂取するため、ヨウ素の摂取量は十分であることが多い。むしろ過剰摂取に注意が必要な場合もある。\n4：誤。ヨウ素はビタミンDの合成には関与しない。甲状腺ホルモンの合成に関与する。\n5：誤。ヨウ素の過剰摂取は甲状腺機能低下症や甲状腺腫を引き起こすことがある。", "image": false}, "issues": ["F245と知識点（甲状腺ホルモンの構成成分・日本人の摂取量・過剰症）が同じ角度で重なる", "肢2（貧血）・肢4（ビタミンD合成）は無関係な内容で、攪乱肢として働かない", "肢5「過剰摂取すると、甲状腺機能を高める作用をもつ」を誤りとしているが、ヨウ素の過剰摂取で甲状腺機能亢進が起こる場合もある（ヨウ素誘発性甲状腺機能亢進症）。見方によっては正しくなり、正答が一意に定まらない"], "summary": "F245に統合して削除する。ヨウ素の過剰症は「甲状腺機能の低下と甲状腺腫を中心に、亢進を起こすこともある」として、F245の解説で扱う。", "sources": ["https://hfnet.nibn.go.jp/mineral/detail680/"]}, {"id": "F479", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "polish", "before": {"section": "理論", "text": "必須微量元素であるセレンに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["セレンはグルタチオンペルオキシダーゼの構成成分であり、セレノシステインとして抗酸化作用に寄与する。", "セレン欠乏症の克山病は、土壌のセレンが豊富な地域で発生する風土病である。", "セレンはナトリウムポンプ（Na⁺/K⁺-ATPase）の活性中心に含まれ、細胞の浸透圧調節に直接関与する。", "セレンは生体内で硫黄から変換・合成されるため、通常の食事からの補充は不要である。", "セレンの過剰摂取（セレノーシス）では、主要な症状として高度の貧血や骨軟化症が認められる。"], "answer": ["1"], "comment": "1：正。セレンは、グルタチオンペルオキシダーゼ（GPx）やチオレドキシンレダクターゼなどの活性中心にアミノ酸のセレノシステインとして組み込まれ、活性酸素を除去する重要な抗酸化酵素として機能する。\n2：誤。セレン欠乏症は土壌中のセレン濃度が低い地域（中国の一部など）で、心筋症を主徴とする克山病（けしゃんびょう）や軟骨発育不全を伴うカシン・ベック病といった深刻な風土病として報告されている。\n3：誤。セレンはNa⁺/K⁺-ATPaseの構成成分ではない。抗酸化酵素のほか、甲状腺ホルモン（T4）をT3に活性化する脱ヨード酵素（デヨージナーゼ）などの構成成分として重要である。\n4：誤。セレンはヒトにとって必須微量元素であり、体内で合成することはできない。食事から適量を摂取する必要がある。\n5：誤。セレン過剰摂取（セレノーシス）の特徴的症状は、脱毛、爪の変形・脱落、呼気のニンニク臭、末梢神経障害などである。貧血や骨軟化症はカドミウムなど他の金属毒性で見られる所見であり、セレンの主症状ではない。", "image": false}, "issues": ["選択肢が長く、文末に句点がある（ほかの問題と書き方が揃っていない）", "肢4（硫黄から体内で合成）は知識がなくても消去できる。肢3（Na⁺/K⁺-ATPase）は無関係な内容", "肢2は「豊富↔低い」の単純な反転"], "after": {"section": "理論", "text": "セレンに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["グルタチオンペルオキシダーゼの活性中心にセレノシステインとして含まれる", "甲状腺ホルモンのT₃をT₄に変換する脱ヨウ素酵素の構成成分である", "欠乏症の克山病は、骨・関節の変形を主徴とする", "過剰症では、呼気のアセトン臭が特徴的である", "スーパーオキシドジスムターゼの構成成分として、スーパーオキシドを消去する"], "answer": ["1"], "comment": "1：正。セレンはセレノシステインとしてグルタチオンペルオキシダーゼ（GPx）の活性中心に組み込まれ、還元型グルタチオンを用いて過酸化水素や過酸化脂質を分解する。\n2：誤。セレンを含むヨードチロニン脱ヨウ素酵素は、T₄（チロキシン）からヨウ素を1原子除き、活性の高いT₃（トリヨードチロニン）に変換する。\n3：誤。克山病は心筋症を主徴とする。骨・関節の変形を主徴とするのは、思春期の小児にみられるカシン・ベック病（地方病性変形性骨軟骨関節症）である。\n4：誤。慢性セレン中毒で最も多い症状は毛髪と爪の脆弱化・脱落で、呼気のニンニク臭も特徴である。アセトン臭は糖尿病ケトアシドーシスなどでみられる。\n5：誤。SODの金属は銅・亜鉛（細胞質）やマンガン（ミトコンドリア）である。セレンを含むGPxは、SODが生成する過酸化水素などを分解する。", "dropImage": false}, "summary": "正答肢を短くし、選択肢を句点のない短文にそろえました。知識なしで消去できた肢（硫黄から合成、Na⁺/K⁺-ATPase）と単純な反転（土壌のセレンが豊富）を、T₄→T₃の向き、克山病とカシン・ベック病、ニンニク臭、SODとの取り違えに替えています。", "sources": ["https://www.mhlw.go.jp/shingi/2009/05/dl/s0529-4am.pdf", "https://lpi.oregonstate.edu/jp/mic/%E3%83%9F%E3%83%8D%E3%83%A9%E3%83%AB/%E3%82%BB%E3%83%AC%E3%83%B3", "https://hfnet.nibn.go.jp/mineral/detail681/"], "check": "合格"}, {"id": "F480", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "keep", "before": {"section": "必須", "text": "ナトリウムの過剰摂取と最も関連が深い疾患はどれか。1つ選べ。", "choices": ["骨粗鬆症", "高血圧", "鉄欠乏性貧血", "甲状腺腫", "くる病"], "answer": ["2"], "comment": "1：誤。骨粗鬆症はカルシウムの不足やビタミンDの欠乏等と関連が深い。\n2：正。ナトリウム（食塩）の過剰摂取は高血圧と最も関連が深い。食塩の摂取制限は高血圧の予防・治療において重要である。\n3：誤。鉄欠乏性貧血は鉄の不足と関連が深い。\n4：誤。甲状腺腫はヨウ素の過不足と関連が深い。\n5：誤。くる病はビタミンDの欠乏と関連が深い。", "image": false}, "issues": ["必須として簡潔で、誤答肢も他のミネラル・ビタミンの代表的な疾患で揃っている"], "after": {"section": "必須", "text": "ナトリウムの過剰摂取と最も関連が深い疾患はどれか。1つ選べ。", "choices": ["骨粗鬆症", "鉄欠乏性貧血", "高血圧", "甲状腺腫", "くる病"], "answer": ["3"], "comment": "1：誤。骨粗鬆症は、カルシウムやビタミンDの不足、閉経後のエストロゲン低下などと関連が深い。\n2：誤。鉄欠乏性貧血は鉄の不足と関連が深い。\n3：正。ナトリウム（食塩）の過剰摂取は高血圧と最も関連が深い。日本人の食事摂取基準（2025年版）では食塩相当量の目標量（成人男性7.5 g/日未満、成人女性6.5 g/日未満）が示され、高血圧の重症化予防には6.0 g/日未満とされている。\n4：誤。甲状腺腫はヨウ素の欠乏や過剰と関連が深い。\n5：誤。くる病はビタミンDの欠乏と関連が深い。", "dropImage": false}, "summary": "必須として簡潔で誤答肢もそろっているため、問題文と選択肢は変えていません。解説2に2025年版の食塩の目標量と重症化予防の値を加えました。", "sources": ["https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf"], "check": "合格"}, {"id": "F629", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "鉄の吸収と代謝に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["非ヘム鉄はヘム鉄より吸収効率が高い", "ビタミンCは非ヘム鉄の吸収を促進する", "鉄は主に大腸で吸収される", "トランスフェリンは鉄の貯蔵タンパク質である", "フェリチンは鉄の輸送タンパク質である"], "answer": ["2"], "comment": "1：誤。ヘム鉄（肉・魚に多い）は非ヘム鉄（野菜・穀物に多い）より吸収効率が高い。\n2：正。ビタミンC（アスコルビン酸）はFe³⁺をFe²⁺に還元して非ヘム鉄の吸収を促進する。\n3：誤。鉄は主に十二指腸〜空腸上部で吸収される。大腸ではない。\n4：誤。トランスフェリンは鉄の血中輸送タンパク質である。貯蔵タンパク質はフェリチン。\n5：誤。フェリチンは鉄の貯蔵タンパク質（主に肝臓・脾臓・骨髄に存在）である。輸送タンパク質はトランスフェリン。", "image": false}, "issues": ["肢2（ビタミンCで吸収促進）がF228肢1、過去問101016と同じ", "肢1（非ヘム鉄の吸収効率が高い）がF236肢2の反転で重複", "肢4・5のトランスフェリン/フェリチンの入れ替えは良い攪乱肢なので残したい"], "after": {"section": "理論", "text": "鉄の吸収と体内動態に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["非ヘム鉄は、Fe²⁺に還元されたのちDMT1を介して十二指腸から吸収される", "トランスフェリンは、肝臓や脾臓で鉄を貯蔵するタンパク質である", "肝臓で産生されるヘプシジンは、フェロポルチンの分解を促して鉄の吸収を抑える", "体内で余った鉄は、主に尿中に排泄されて体内量が調節される", "ビタミンCは、Fe²⁺をFe³⁺に酸化して非ヘム鉄の吸収を高める"], "answer": ["1", "3"], "comment": "1：正。食品中の非ヘム鉄の多くはFe³⁺で、十二指腸の上皮細胞膜にある還元酵素（Dcytb）などによりFe²⁺に還元され、二価金属輸送体（DMT1）を介して細胞内に取り込まれる。ヘム鉄は別の経路（HCP1など）で取り込まれる。\n2：誤。トランスフェリンは血中で鉄を運ぶ輸送タンパク質である。肝臓・脾臓・骨髄などで鉄を貯蔵するのはフェリチン（およびヘモシデリン）である。\n3：正。ヘプシジンは肝臓から分泌されるペプチドホルモンで、小腸上皮細胞などの鉄排出タンパク質であるフェロポルチンの分解を促し、血中への鉄の移行を抑える。\n4：誤。ヒトには鉄を積極的に体外へ排泄するしくみがない。体内の鉄量は、主にヘプシジンを介した腸管からの吸収量の調節によって保たれる。\n5：誤。ビタミンCは還元作用によりFe³⁺をFe²⁺に還元し、非ヘム鉄の吸収を高める。", "dropImage": false}, "summary": "ビタミンC・ヘム鉄の吸収効率がF228・F236・過去問101016と重なっていたため、吸収・輸送・調節の機序（Dcytb・DMT1、ヘプシジン・フェロポルチン、排泄経路がないこと）を問う「2つ選べ」に作り直しました。良い攪乱肢だったトランスフェリンとフェリチンの入れ替えは残し、ビタミンCは酸化と還元の取り違えとして使っています。", "sources": ["https://nsmc.hosp.go.jp/Journal/2017-7/SMCJ2017-7_review01.pdf", "https://hfnet.nibn.go.jp/mineral/detail675/"], "check": "合格"}, {"id": "F630", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "銅に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["銅はヘモグロビンの構成成分である", "銅の欠乏症はウィルソン病である", "銅は体内で合成できるため食事からの摂取は不要である", "銅はセルロプラスミンの構成成分であり鉄代謝に関与する", "銅の過剰摂取は健康に影響しない"], "answer": ["4"], "comment": "1：誤。ヘモグロビンの構成成分は鉄である。銅ではない。\n2：誤。ウィルソン病は銅の排泄障害による銅の過剰蓄積疾患であり、銅の欠乏症ではない。銅の欠乏症にはメンケス病がある。\n3：誤。銅は必須微量元素であり、食事からの摂取が必要である。\n4：正。銅はセルロプラスミン（フェロキシダーゼ活性をもつ銅含有タンパク質）の構成成分であり、Fe²⁺をFe³⁺に酸化してトランスフェリンへの鉄の結合を促進する。銅欠乏では鉄の利用障害が生じ貧血が起こる。\n5：誤。銅の過剰摂取は肝障害等を引き起こす。ウィルソン病では銅の蓄積により肝障害や神経障害が生じる。", "image": false}, "issues": ["肢3「体内で合成できる」、肢5「健康に影響しない」は、誤答肢の絶対化表現や知識なしで消去できる内容", "肢1（ヘモグロビン）はF477・F761と同じ消去パターン", "ウィルソン病とメンケス病の比較という、良い論点が肢2の1肢だけにとどまっている"], "after": {"section": "理論", "text": "銅の代謝とその異常に関する記述のうち、正しいのはどれか。2つ選べ。", "choices": ["ウィルソン病は、ATP7A遺伝子の異常により腸管からの銅の吸収が障害される疾患である", "メンケス病では、血清セルロプラスミン値が上昇する", "ウィルソン病の治療に用いる酢酸亜鉛は、体内の銅をキレートして尿中への排泄を促す", "セルロプラスミンは、Fe²⁺をFe³⁺に酸化してトランスフェリンへの鉄の結合を助ける", "亜鉛を過剰に摂取すると、小腸でメタロチオネインが誘導されて銅の吸収が低下する"], "answer": ["4", "5"], "comment": "1：誤。ウィルソン病はATP7B遺伝子の異常により銅の胆汁中への排泄が障害され、肝臓などに銅が蓄積する疾患である。ATP7Aの異常で腸管からの銅の吸収が障害されるのはメンケス病である。\n2：誤。メンケス病では銅が欠乏し、血清銅と血清セルロプラスミンはいずれも低値となる。ウィルソン病でも血清セルロプラスミンは低値となる。\n3：誤。銅をキレートして排泄を促すのはD-ペニシラミンやトリエンチンである。酢酸亜鉛は腸管でメタロチオネインを誘導し、銅の吸収を抑える。\n4：正。銅を含むセルロプラスミンはフェロキシダーゼ活性をもち、Fe²⁺をFe³⁺に酸化してトランスフェリンへの結合を助ける。銅が欠乏すると鉄の利用が障害され、鉄剤に反応しない貧血や白血球減少がみられる。\n5：正。亜鉛は小腸上皮細胞でメタロチオネインの合成を誘導し、これに結合した銅は血中に移行せずに排泄される。亜鉛の過剰摂取が続くと銅欠乏とそれに伴う貧血を生じる。", "dropImage": false}, "summary": "「体内で合成できる」「健康に影響しない」など絶対化・知識不要の誤答肢を除き、セルロプラスミンと鉄代謝、亜鉛による銅吸収の抑制、ウィルソン病（ATP7B）とメンケス病（ATP7A）の比較を問う「2つ選べ」に作り直しました。講義回に欠けていた亜鉛と銅の拮抗、酢酸亜鉛の作用機序を取り込んでいます。", "sources": ["https://nsmc.hosp.go.jp/Journal/2017-7/SMCJ2017-7_review01.pdf", "https://hfnet.nibn.go.jp/mineral/detail674/", "https://www.mhlw.go.jp/file/06-Seisakujouhou-10900000-Kenkoukyoku/0000101049.pdf", "https://grj.umin.jp/grj/atp7a.htm", "https://medical.nikkeibp.co.jp/leaf/all/series/drug/update/200803/505701.html"], "check": "合格"}, {"id": "F631", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "マグネシウムに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["マグネシウムは体内に最も多く存在するミネラルである", "マグネシウムは300種以上の酵素反応の補因子として機能する", "マグネシウムの欠乏症は報告されていない", "マグネシウムは甲状腺ホルモンの構成成分である", "マグネシウムは、その大部分が血漿中に遊離した状態で存在する"], "answer": ["2"], "comment": "1：誤。体内に最も多く存在するミネラルはカルシウムである。\n2：正。マグネシウムは300種以上の酵素反応の補因子として機能し、ATP代謝、核酸合成、筋収縮等に関与する。体内のマグネシウムの約60%は骨に存在する。\n3：誤。マグネシウムの欠乏は筋肉のけいれん、不整脈、テタニー等を引き起こす。\n4：誤。甲状腺ホルモンの構成成分はヨウ素である。\n5：誤。体内のマグネシウムの約60%は骨に存在する。", "image": false}, "issues": ["肢3「欠乏症は報告されていない」は絶対化に近く、知識がなくても消去しやすい", "肢4（甲状腺ホルモン）は無関係な内容", "肢1と肢5は解説の根拠が重なり、肢5の解説が肢1の言い換えにとどまっている"], "after": {"section": "理論", "text": "マグネシウムに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["食事摂取基準（2025年版）では、通常の食品からの摂取にも成人の耐容上限量が設定されている", "体内のマグネシウムの大部分は、血漿などの細胞外液に存在する", "腎機能が低下した高齢者では、酸化マグネシウムの服用により低マグネシウム血症を起こしやすい", "低マグネシウム血症では、PTHの分泌と作用が障害されて低カルシウム血症を伴いやすい", "高マグネシウム血症では、神経・筋の興奮性が高まってテタニーを起こす"], "answer": ["4"], "comment": "1：誤。日本人の食事摂取基準（2025年版）では、マグネシウムの耐容上限量は通常の食品以外（サプリメントなど）からの摂取に限り、成人で350 mg/日とされている。通常の食品からの摂取については設定されていない。\n2：誤。体内のマグネシウムの大部分は骨や軟部組織に存在し、細胞外液中には全体の約1%しか存在しない。\n3：誤。マグネシウムは主に腎臓から排泄されるため、腎機能が低下した患者や高齢者では、酸化マグネシウムの服用で高マグネシウム血症を起こすおそれがあり、注意喚起が行われている。\n4：正。マグネシウムが不足すると、副甲状腺でのPTHの合成・分泌が障害され、標的臓器でのPTHの作用も弱まるため、二次的に低カルシウム血症を生じる。\n5：誤。高マグネシウム血症では神経・筋の働きが抑えられ、脱力、徐脈、傾眠などがみられる。テタニーは低マグネシウム血症や低カルシウム血症でみられる。", "dropImage": false}, "summary": "「欠乏症は報告されていない」（絶対化に近い）や甲状腺ホルモンなど無関係な肢を除き、マグネシウムに特有の論点（低Mg血症による低Ca血症、通常の食品以外に限った耐容上限量、体内分布、酸化マグネシウムによる高Mg血症）に絞って作り直しました。形式は理論・1つ選べのままです。", "sources": ["https://www.nagasaki-clinic.com/hypomagnesemia/", "https://www.jmedj.co.jp/blogs/2017/d070909", "https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf", "https://www.pmda.go.jp/files/000235889.pdf"], "check": "合格"}, {"id": "F632", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "merge_delete", "before": {"section": "理論", "text": "体液の酸塩基平衡に関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["血液のpHは通常7.0付近に維持される", "腎臓は、二酸化炭素の排出を介して血液のpHを調節する", "代謝性アシドーシスでは血液のpHが上昇する", "呼吸性アルカローシスでは血液のCO2分圧が上昇する", "重炭酸・炭酸緩衝系は血液のpH調節に最も重要な緩衝系である"], "answer": ["5"], "comment": "1：誤。血液のpHは通常7.35〜7.45付近に維持される。7.0ではない。\n2：誤。腎臓はHCO3⁻の再吸収やH⁺の排泄を通じてpH調節に重要な役割を果たす。\n3：誤。代謝性アシドーシスでは血液のpHが低下する。上昇するのはアルカローシス。\n4：誤。呼吸性アルカローシスでは過換気により血液のCO2分圧が低下し、pHが上昇する。\n5：正。重炭酸（HCO3⁻）・炭酸（H2CO3）緩衝系は血液（細胞外液）のpH調節に最も重要な緩衝系であり、肺と腎臓による調節と連動している。", "image": false}, "issues": ["酸塩基平衡は生理学・病態の内容で、新コアカリE-2-1（栄養）の「ミネラルと欠乏症」の範囲外", "肢1（pH 7.0）・肢3（アシドーシスでpH上昇）は誤答肢が単純な反転"], "summary": "この回からは削除する（扱うなら生理・病態の回へ移す）。空いた枠は、扱いのないフッ素（う蝕予防と歯のフッ素症）か、Mo・Mn・Crなど抜けている微量元素の問題にあてることを勧める。", "sources": []}, {"id": "F651", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "カリウムに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["カリウムの摂取はナトリウムの排泄を促進し血圧を低下させる", "カリウムは主に細胞外液に存在する", "カリウムは骨の主要構成成分である", "日本人はカリウムを過剰に摂取している", "腎不全患者ではカリウムの積極的摂取が推奨される"], "answer": ["1"], "comment": "1：正。カリウムの十分な摂取はナトリウムの腎臓からの排泄を促進し、血圧を低下させる効果がある。高血圧の予防・管理に重要。\n2：誤。カリウムは主に細胞内液に存在する（細胞内の主要な陽イオン）。細胞外液の主要陽イオンはナトリウム。\n3：誤。骨の主要構成成分はカルシウムとリンである。\n4：誤。日本人のカリウム摂取量は目標量を下回っており、摂取不足が指摘されている。\n5：誤。腎不全患者ではカリウムの排泄が低下するため、高カリウム血症予防のためにカリウム制限が必要となる。", "image": false}, "issues": ["肢1（Kによる降圧）・肢2（細胞内液）がF248肢2・肢4と同じ内容", "肢3（骨の主要構成成分）は無関係な内容", "肢5「積極的摂取が推奨される」は、腎不全でK制限を知らなくても語感で消去しやすい"], "after": {"section": "理論", "text": "ナトリウムとカリウムに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["食事摂取基準（2025年版）では、ナトリウムとカリウムのいずれにも推奨量が設定されている", "細胞内液に最も多く含まれる陽イオンは、Na⁺である", "食事摂取基準（2025年版）では、カリウムの目標量は成人男女とも3,000 mg/日以上である", "令和6年国民健康・栄養調査では、20歳以上女性の食塩摂取量の平均値は目標量を下回っている", "食事摂取基準（2025年版）では、ナトリウムの目標量は「未満」、カリウムの目標量は「以上」で示されている"], "answer": ["5"], "comment": "1：誤。ナトリウムには推定平均必要量（600 mg/日、食塩相当量1.5 g/日）と目標量が、カリウムには目安量と目標量が設定されており、どちらにも推奨量はない。\n2：誤。細胞内液の主な陽イオンはK⁺であり、Na⁺は細胞外液の主な陽イオンである。\n3：誤。カリウムの目標量は成人男性3,000 mg/日以上、成人女性2,600 mg/日以上で、男女で異なる。\n4：誤。令和6年国民健康・栄養調査では、20歳以上の食塩摂取量の平均値は9.6 g（男性10.5 g、女性8.9 g）で、女性でも目標量（6.5 g/日未満）を上回っている。\n5：正。日本人の食事摂取基準（2025年版）では、ナトリウムは食塩相当量の目標量が「未満」（成人男性7.5 g/日未満、成人女性6.5 g/日未満）、カリウムは目標量が「以上」（成人男性3,000 mg/日以上、成人女性2,600 mg/日以上）で示されている。", "dropImage": false}, "summary": "Kによる降圧・Kの細胞内分布がF248と重複し、「骨の主要構成成分」など無関係な肢があったため、NaとKを比べる問題に作り直しました。食事摂取基準での指標の種類（Na：推定平均必要量・目標量、K：目安量・目標量）、目標量の向き（未満／以上）、令和6年国民健康・栄養調査の値を読み取らせています。", "sources": ["https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf", "https://www.dobun.co.jp/scbookdata/stofcj2025.pdf", "https://www.mhlw.go.jp/content/10900000/001603146.pdf"], "check": "合格"}, {"id": "F652", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "rewrite", "before": {"section": "理論", "text": "リンに関する記述のうち、正しいのはどれか。1つ選べ。", "choices": ["リンは水溶性ビタミンの一種である", "リンの過剰摂取はカルシウムの吸収を促進する", "リンは、体内に微量しか存在しない微量ミネラルである", "リンの欠乏は日本人で問題となっている", "リンはATP・核酸・リン脂質等の構成成分である"], "answer": ["5"], "comment": "1：誤。リンは必須ミネラル（多量ミネラル）であり、ビタミンではない。\n2：誤。リンの過剰摂取はカルシウムの吸収を阻害する。加工食品に多く含まれるリン酸塩の過剰摂取に注意が必要。\n3：誤。リンは体内にカルシウムに次いで多く存在するミネラルであり、約85%は骨と歯に存在する。\n4：誤。リンは加工食品に多く添加されているため、日本人では過剰摂取が問題とされている。\n5：正。リンはATP、核酸（DNA・RNA）、リン脂質、ヒドロキシアパタイト（骨・歯）等の構成成分であり、エネルギー代謝や細胞膜構成に不可欠である。", "image": false}, "issues": ["肢1「水溶性ビタミンの一種」は知識がなくても消去できる", "肢2がF247・F476と重複（リン過剰とCa吸収）", "正答肢5だけが長く具体的", "解説4「日本人では過剰摂取が問題とされている」は根拠が強すぎる。公的資料では「通常の食事では不足や欠乏は起こらない」「食品添加物として多く使われており、調査の報告値より多く摂っている可能性がある」とされる程度で、過剰摂取が問題と言い切る記述ではない"], "after": {"section": "必須", "text": "ATPや核酸の構成成分であり、骨や歯ではヒドロキシアパタイトとして存在するミネラルはどれか。1つ選べ。", "choices": ["カルシウム", "リン", "マグネシウム", "亜鉛", "フッ素"], "answer": ["2"], "comment": "1：誤。カルシウムはヒドロキシアパタイトの構成成分で、体内のカルシウムの99%は骨と歯に存在するが、ATPや核酸の構成成分ではない。\n2：正。リンは体内の約80%がカルシウム塩として骨や歯に存在し、残りはATP、核酸（DNA・RNA）、リン脂質などの構成成分となる。加工食品にも添加されており、長期の過剰摂取は副甲状腺機能の亢進やカルシウムの吸収抑制を起こしうる。食事摂取基準（2025年版）では目安量と耐容上限量（成人3,000 mg/日）が示されている。\n3：誤。マグネシウムはATPと複合体をつくって多くの酵素反応を助けるが、ATPや核酸の構成成分ではない。\n4：誤。亜鉛は多くの酵素の構成成分であるが、ATPや核酸の構成成分ではない。\n5：誤。フッ素はエナメル質のヒドロキシアパタイトの一部を溶けにくいフルオロアパタイトに変えてう蝕を予防するが、ATPや核酸の構成成分ではない。過剰に摂取すると歯のフッ素症（斑状歯）を生じる。", "dropImage": false}, "summary": "「水溶性ビタミンの一種」など知識なしで消去できる肢と、F247・F476と重なるリン過剰の肢があったため、リンだけを扱う必須の語句選択問題にしました。カルシウム（アパタイトは正しいがATPではない）やマグネシウム（ATPと結合するが構成成分ではない）を紛らわしい選択肢にしています。もとの解説の「日本人では過剰摂取が問題とされている」は根拠が強すぎるため、公的資料の表現に合わせました。講義回に抜けていたフッ素も、選択肢と解説で扱っています。", "sources": ["https://hfnet.nibn.go.jp/mineral/detail661/", "https://hfnet.nibn.go.jp/mineral/detail660/", "https://www.kenpakusha.co.jp/data/seigo1/005004-05.pdf", "https://kennet.mhlw.go.jp/information/information/teeth/h-02-006.html"], "check": "合格"}, {"id": "F761", "lec": 3, "lecTitle": "第3回 ミネラルと欠乏症", "verdict": "polish", "before": {"section": "必須", "text": "ヘモグロビンのヘム部分に含まれる金属元素はどれか。1つ選べ。", "choices": ["銅（セルロプラスミンの構成成分）", "亜鉛（300種以上の酵素の構成成分）", "鉄（ポルフィリン環の中心に配位）", "マンガン（スーパーオキシドジスムターゼの構成成分）", "コバルト（ビタミンB12の構成成分）"], "answer": ["3"], "comment": "1：誤。銅はセルロプラスミン（フェロキシダーゼ）やシトクロムcオキシダーゼの構成成分であるが、ヘモグロビンには含まれない。\n2：誤。亜鉛はDNAポリメラーゼ、アルカリホスファターゼ等300種以上の酵素の構成成分であるが、ヘモグロビンには含まれない。\n3：正。ヘモグロビンのヘム部分にはFe²⁺がプロトポルフィリンIXの中心に配位しており、酸素分子と可逆的に結合する。鉄欠乏によりヘモグロビン合成が低下すると鉄欠乏性貧血を生じる。\n4：誤。マンガンはMn-SOD（ミトコンドリアのスーパーオキシドジスムターゼ）等の構成成分であるが、ヘモグロビンには含まれない。\n5：誤。コバルトはビタミンB12（コバラミン）のコリン環の中心に配位する金属であるが、ヘモグロビンには含まれない。", "image": false}, "issues": ["選択肢のかっこ書き（例：鉄〔ポルフィリン環の中心に配位〕）が答えのヒントになり、必須の選択肢として長すぎる"], "after": {"section": "必須", "text": "ヘモグロビンのヘム部分に含まれる金属元素はどれか。1つ選べ。", "choices": ["銅", "鉄", "亜鉛", "マンガン", "コバルト"], "answer": ["2"], "comment": "1：誤。銅はセルロプラスミンやシトクロムcオキシダーゼの構成成分であるが、ヘモグロビンには含まれない。\n2：正。ヘモグロビンのヘムでは、Fe²⁺がプロトポルフィリンIXの中心に配位しており、酸素分子と可逆的に結合する。鉄が不足してヘモグロビンの合成が低下すると鉄欠乏性貧血を生じる。\n3：誤。亜鉛は炭酸脱水酵素やアルコールデヒドロゲナーゼなど多くの酵素の構成成分であるが、ヘモグロビンには含まれない。\n4：誤。マンガンはMn-SOD（ミトコンドリアのスーパーオキシドジスムターゼ）やアルギナーゼの構成成分であるが、ヘモグロビンには含まれない。\n5：誤。コバルトはビタミンB12（コバラミン）のコリン環の中心に配位する金属であるが、ヘモグロビンには含まれない。", "dropImage": false}, "summary": "選択肢のかっこ書き（例：鉄〔ポルフィリン環の中心に配位〕）が答えのヒントになっていたため、選択肢を元素名だけにし、その内容は解説に移しました。", "sources": ["https://nsmc.hosp.go.jp/Journal/2017-7/SMCJ2017-7_review01.pdf", "https://hfnet.nibn.go.jp/mineral/detail681/"], "check": "合格"}]</script>
<script>
const ITEMS = JSON.parse(document.getElementById('data').textContent);
const VLABEL = {keep:'維持（書式のみ）', polish:'磨き', rewrite:'作り直し', merge_delete:'削除・統合'};
const decisions = {};   // id -> {status, note}
let filter = 'all';
let db = null, canWrite = true;

function esc(s){return String(s ?? '').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmt(q){ return (q.section || '区分なし') + '・' + (q.answer.length===2 ? '2つ選べ' : '1つ選べ'); }

function qBlock(q, kind, it){
  if(!q) return '';
  const ans = new Set(q.answer.map(String));
  const img = (kind==='before' && q.image && ['F225','F233','F249'].includes(it.id)) ? `<img class="img" src="img/${it.id}.png" alt="${it.id}の図">` : '';
  const dropped = (kind==='after' && q.dropImage) ? '<div class="meta">図は使わない形に変更</div>' : '';
  return `<div class="q ${kind}" data-kind="${kind}">
    <h3>${kind==='before'?'改訂前':'改訂後'}</h3>
    <div class="meta">${esc(fmt(q))}</div>${dropped}
    <p class="stem">${esc(q.text)}</p>${img}
    <ol class="ch">${q.choices.map((c,i)=>`<li class="${ans.has(String(i+1))?'ok':''}"><span class="n">${i+1}</span><span>${esc(c)}</span>${ans.has(String(i+1))?'<span class="mk">正答</span>':''}</li>`).join('')}</ol>
    <details><summary>解説を見る</summary><p class="cm">${esc(q.comment)}</p></details>
  </div>`;
}

function card(it){
  const d = decisions[it.id] || {};
  const st = d.status ? ' st-'+d.status : '';
  const del = it.verdict==='merge_delete';
  const srcs = (it.sources||[]).length ? `<details><summary>根拠の資料（${it.sources.length}件）</summary><ul class="src">${it.sources.map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a></li>`).join('')}</ul></details>` : '';
  const issues = (it.issues||[]).length ? `<details><summary>診断で見つかった問題点（${it.issues.length}件）</summary><ul class="issues">${it.issues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>` : '';
  return `<article id="c-${it.id}" class="${st.trim()}" data-id="${it.id}">
    <div class="head">
      <span class="pid">${it.id}</span>
      <span class="badge v-${it.verdict}">${VLABEL[it.verdict]}</span>
      <span class="badge">第${it.lec}回</span>
      ${it.check?`<span class="badge check">独立検証：${esc(it.check)}</span>`:''}
    </div>
    <div class="summary"><span class="lbl">${del?'削除・統合の理由':'変更の要点'}</span>${esc(it.summary)}</div>
    ${it.checkNote?`<div class="meta">検証で直した点：${esc(it.checkNote)}</div>`:''}
    ${issues}
    ${del ? '' : `<div class="seg" role="group" aria-label="表示の切り替え"><button type="button" data-show="after" aria-pressed="true">改訂後</button><button type="button" data-show="before" aria-pressed="false">改訂前</button></div>`}
    <div class="cols">${del ? qBlock(it.before,'before',it) : qBlock(it.before,'before',it).replace('class="q before"','class="q before" hidden') + qBlock(it.after,'after',it)}</div>
    ${srcs}
    <div class="decide">
      <div class="btns" role="group" aria-label="判断">
        <button type="button" class="approve" data-st="approve" aria-pressed="${d.status==='approve'}">${del?'削除を承認':'承認'}</button>
        <button type="button" class="reject" data-st="reject" aria-pressed="${d.status==='reject'}">${del?'残す':'却下'}</button>
        <button type="button" class="hold" data-st="hold" aria-pressed="${d.status==='hold'}">保留</button>
      </div>
      <textarea id="note-${it.id}" placeholder="直してほしい点・コメント（任意）">${esc(d.note||'')}</textarea>
      <div class="saverow"><button type="button" data-save>メモを保存</button><span data-msg></span></div>
    </div>
  </article>`;
}

function visible(it){
  const s = decisions[it.id]?.status;
  if(filter==='todo') return !s;
  if(filter==='hold') return s==='hold';
  if(filter==='lec2') return it.lec===2;
  if(filter==='lec3') return it.lec===3;
  return true;
}

function renderTally(){
  const c={approve:0,reject:0,hold:0};
  ITEMS.forEach(it=>{const s=decisions[it.id]?.status; if(s) c[s]++;});
  const todo = ITEMS.length - c.approve - c.reject - c.hold;
  document.getElementById('tally').innerHTML =
    `<span>全${ITEMS.length}問</span><span class="a">承認 ${c.approve}</span><span class="r">却下 ${c.reject}</span><span class="h">保留 ${c.hold}</span><span>未判断 ${todo}</span>`;
}
function renderFilters(){
  const F=[['all','すべて'],['todo','未判断'],['hold','保留'],['lec2','第2回'],['lec3','第3回']];
  document.getElementById('filters').innerHTML = F.map(([k,l])=>`<button type="button" class="chip" data-f="${k}" aria-pressed="${filter===k}">${l}</button>`).join('');
}
function renderList(){
  document.getElementById('list').innerHTML = ITEMS.filter(visible).map(card).join('') || '<p class="ro">該当する問題はありません。</p>';
  if(!canWrite) document.querySelectorAll('.decide button, .decide textarea').forEach(el=>el.disabled=true);
}
function renderAll(){ renderTally(); renderFilters(); renderList(); }

async function save(id, patch, msgEl){
  const cur = Object.assign({}, decisions[id]||{}, patch, {updatedAt:new Date().toISOString()});
  decisions[id]=cur;
  if(!db){ if(msgEl) msgEl.textContent='この画面では保存できません'; return; }
  try{ await db.doc('decisions/'+id).set(cur); if(msgEl) msgEl.textContent='保存しました'; }
  catch(e){
    if(e && e.code==='invalid_argument'){ canWrite=false; document.getElementById('dbstate').hidden=false; document.getElementById('dbstate').textContent='このページを編集する権限がないため、閲覧のみになります。'; }
    if(msgEl) msgEl.textContent='保存できませんでした（'+(e&&e.code||'不明')+'）';
  }
}

document.addEventListener('click', e=>{
  const f = e.target.closest('[data-f]');
  if(f){ filter=f.dataset.f; renderFilters(); renderList(); return; }
  const art = e.target.closest('article'); if(!art) return;
  const id = art.dataset.id;
  const sh = e.target.closest('[data-show]');
  if(sh){ art.querySelectorAll('[data-show]').forEach(b=>b.setAttribute('aria-pressed', String(b===sh)));
    art.querySelectorAll('.q').forEach(q=>q.hidden = q.dataset.kind!==sh.dataset.show); return; }
  const b = e.target.closest('[data-st]');
  if(b){
    const st = decisions[id]?.status===b.dataset.st ? null : b.dataset.st;
    const note = art.querySelector('textarea').value;
    save(id,{status:st, note}, art.querySelector('[data-msg]')).then(()=>{
      renderTally();
      art.className = st ? 'st-'+st : '';
      art.querySelectorAll('[data-st]').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.st===st)));
    });
    return;
  }
  if(e.target.closest('[data-save]')){
    save(id,{note:art.querySelector('textarea').value, status:decisions[id]?.status||null}, art.querySelector('[data-msg]'));
  }
});

renderAll();
(async()=>{
  db = await claude.use('db');
  if(!db){ const s=document.getElementById('dbstate'); s.hidden=false; s.textContent='判断の保存は、claude.ai にサインインして開いたときに使えます。'; canWrite=false; renderList(); return; }
  db.collection('decisions').onSnapshot(snap=>{
    let changed=false;
    snap.docs.forEach(d=>{ const v=d.data(); const cur=decisions[d.id];
      if(!cur || cur.status!==v.status || cur.note!==v.note){ decisions[d.id]=v; changed=true; } });
    if(changed){
      // keep any text being typed
      const active=document.activeElement; const typing = active && active.tagName==='TEXTAREA' ? {id:active.id, v:active.value} : null;
      renderAll();
      if(typing){ const t=document.getElementById(typing.id); if(t){ t.value=typing.v; t.focus(); } }
    }
  }, ()=>{});
})();
</script>
