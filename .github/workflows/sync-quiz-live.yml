name: クイズへの反映（Quiz Live 同期）

# 問題JSON（過去問 hygiene_with_images_v4.jsonl・予想問題 future_questions.jsonl）を
# main で直したら、クイズ（Eisei Quiz Live）のデータベースの同じ問題も自動で直す。
# 2026-10-09 先生の依頼。詳しくは .github/scripts/sync_quiz_live.mjs の説明を参照。
#
# クイズの Supabase の URL は公開情報なのでここに書く。鍵（service_role / secret）は
# リポジトリの Secrets に EISEIQUIZJSONUPDATE という名前で登録（2026-10-09 先生が登録）。

on:
  push:
    branches: [main]
    paths:
      - hygiene_with_images_v4.jsonl
      - future_questions.jsonl
  # Actions タブから手動実行：問題番号を指定して、今の JSON の内容で反映する
  workflow_dispatch:
    inputs:
      ids:
        description: '反映する問題番号（カンマ区切り、例: 101021,F225）'
        required: true
      apply:
        description: '実際に書き換える（外すと下見だけ）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sync-quiz-live
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JSON の変更をクイズへ反映（push）
        if: github.event_name == 'push'
        env:
          QUIZ_SUPABASE_URL: https://rnzomqldodkrcjzkknea.supabase.co
          QUIZ_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.EISEIQUIZJSONUPDATE }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$AFTER~1"
          fi
          node .github/scripts/sync_quiz_live.mjs --base "$BEFORE" --head "$AFTER" --apply

      - name: 指定した問題をクイズへ反映（手動）
        if: github.event_name == 'workflow_dispatch'
        env:
          QUIZ_SUPABASE_URL: https://rnzomqldodkrcjzkknea.supabase.co
          QUIZ_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.EISEIQUIZJSONUPDATE }}
          IDS: ${{ inputs.ids }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then FLAG=--apply; else FLAG=; fi
          node .github/scripts/sync_quiz_live.mjs --ids "$IDS" --head HEAD $FLAG
