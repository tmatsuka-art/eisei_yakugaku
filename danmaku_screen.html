<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弾幕スクリーン｜衛生薬学</title>
<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --font: 32px; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000;
    font-family: "Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
  }

  /* 背景：スライド画像 */
  #slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #slide .empty { color: #6982a0; font-size: 22px; text-align: center; line-height: 1.9; }

  /* 流れるコメント層 */
  #danmaku-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  .danmaku {
    position: absolute; left: 0; top: 0; white-space: nowrap;
    font-size: var(--font); font-weight: 700; color: #fff;
    text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
                  0 -2px 0 #000, 0 2px 0 #000, -2px 0 0 #000, 2px 0 0 #000;
    will-change: transform; transform: translateX(100vw); animation: flow linear forwards;
  }
  @keyframes flow {
    from { transform: translateX(100vw); }
    to   { transform: translateX(calc(-100% - 40px)); }
  }

  /* 操作パネル（録画では H キーで隠せます）*/
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 30;
    background: rgba(13,27,42,.80); color: #e6eef7; padding: 10px 12px;
    border-radius: 10px; font-size: 13px; line-height: 1.7; backdrop-filter: blur(4px); max-width: 320px;
  }
  #panel.hidden { display: none; }
  #panel label, #panel button {
    font-size: 13px; margin: 2px 4px 2px 0; padding: 6px 10px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color: #e6eef7; cursor: pointer; display: inline-block;
  }
  #panel .keys { color: #9fb3c8; margin-top: 6px; }
  #fileInput { display: none; }

  /* QRコード（投稿ページへの入口）*/
  #qrwrap {
    position: absolute; bottom: 24px; right: 24px; z-index: 30;
    background: #fff; padding: 14px; border-radius: 12px; text-align: center; transition: transform .2s; transform-origin: bottom right;
  }
  #qrwrap.big { transform: scale(1.7); }
  #qrwrap.hidden { display: none; }
  #qrwrap .cap { font-size: 13px; color: #222; margin-top: 8px; font-weight: 700; }
  #roomTag { position: absolute; bottom: 8px; left: 12px; z-index: 30; color: #6982a0; font-size: 13px; }
</style>
</head>
<body>
  <div id="slide">
    <div class="empty">
      スライド画像をここにドラッグ＆ドロップ<br>
      または左上の「スライドを読み込む」で選択<br>
      <small>（PowerPoint を 画像[PNG] で書き出したもの）</small>
    </div>
  </div>

  <div id="danmaku-layer"></div>

  <div id="panel">
    <div>
      <label for="fileInput">スライドを読み込む</label>
      <input type="file" id="fileInput" accept="image/*" multiple>
      <button id="qrBtn">QR 大/小</button>
      <button id="fsBtn">全画面</button>
      <button id="hideBtn">この枠を隠す</button>
    </div>
    <div class="keys">← →：スライド送り　Q：QR大小　F：全画面　H：この枠　C：弾幕消去</div>
    <div class="keys">部屋：<b id="roomName">default</b>（学生は右下のQRから投稿）</div>
  </div>

  <div id="qrwrap" class="big">
    <div id="qr"></div>
    <div class="cap">スマホで読んでコメント📱</div>
  </div>
  <div id="roomTag"></div>

<script>
// ===== 接続先（この授業のコメント倉庫）=====
const SUPABASE_URL = 'https://rnzomqldodkrcjzkknea.supabase.co';
const SUPABASE_KEY = 'sb_publishable_roQVZm2_YjFpHxr-fCGkGg_5NYZQEOh';
// 投稿ページの住所（GitHubに上げたあと、この住所で学生がアクセスします）
const POST_BASE = 'https://tmatsuka-art.github.io/eisei_yakugaku/danmaku_post.html';

const HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

const params = new URLSearchParams(location.search);
const room = (params.get('room') || 'default').slice(0, 40);
document.getElementById('roomName').textContent = room;
document.getElementById('roomTag').textContent = '部屋: ' + room;

// ===== QRコード（投稿ページのURLを、この部屋つきで）=====
const postUrl = POST_BASE + '?room=' + encodeURIComponent(room);
new QRCode(document.getElementById('qr'), { text: postUrl, width: 170, height: 170 });

// ===== 弾幕（コメントを流す）=====
const layer = document.getElementById('danmaku-layer');
const COLORS = ['#ffffff','#ffffff','#fff7d6','#ffd6e0','#d6f0ff','#d8ffd6','#ffe0b3'];

function laneInfo() {
  const laneH = 50, top = 70, bottom = 40;
  const usable = Math.max(laneH, window.innerHeight - top - bottom);
  const lanes = Math.max(4, Math.floor(usable / laneH));
  return { laneH, top, lanes };
}
let laneBusyUntil = [];
function pickLane(lanes) {
  const now = Date.now();
  if (laneBusyUntil.length !== lanes) laneBusyUntil = new Array(lanes).fill(0);
  const free = [];
  for (let i = 0; i < lanes; i++) if (laneBusyUntil[i] <= now) free.push(i);
  if (free.length) return free[Math.floor(Math.random() * free.length)];
  let m = 0;
  for (let i = 1; i < lanes; i++) if (laneBusyUntil[i] < laneBusyUntil[m]) m = i;
  return m;
}
function launchComment(text, color) {
  text = (text || '').toString();
  if (!text) return;
  const { laneH, top, lanes } = laneInfo();
  const el = document.createElement('div');
  el.className = 'danmaku';
  el.textContent = text;
  el.style.color = color || COLORS[Math.floor(Math.random() * COLORS.length)];
  layer.appendChild(el);
  const w = el.offsetWidth;
  const lane = pickLane(lanes);
  el.style.top = (top + lane * laneH) + 'px';
  const speed = 110 + Math.random() * 50;
  const dist = window.innerWidth + w + 40;
  el.style.animationDuration = (dist / speed) + 's';
  laneBusyUntil[lane] = Date.now() + ((w + 30) / speed * 1000) + 200;
  el.addEventListener('animationend', () => el.remove());
}

// ===== Supabaseから新着コメントを拾う =====
// 【重要】OBSのブラウザソースは「OBSが前面ウィンドウでない」とき、ページの
//   通常タイマー(setInterval)やWeb Workerを省エネのため止めてしまう。
//   一方、映像の“描画”はOBSが出力のため常に回し続ける。
//   そこで描画ループ requestAnimationFrame で見回りを駆動する＝OBSが裏でも止まらない。
//   念のため通常タイマー・Web Worker・Realtime も併用し、どれか1つでも生きていれば届く。
// 同じコメントを二重に流さないよう、表示済みID(seen)で重複チェックする。
let lastId = 0;
const seen = new Set();
const stat = { poll: 0, recv: 0, rt: '—' };   // 画面左下の動作表示（見回り回数・受信件数・通信）
function updateTag() {
  var tag = document.getElementById('roomTag');
  if (tag) tag.textContent = '部屋:' + room + ' ・ 見回り' + stat.poll + ' ・ 受信' + stat.recv + ' ・ 通信' + stat.rt;
}
function showComment(r) {
  if (!r) return;
  if (r.id != null) {
    if (seen.has(r.id)) return;        // すでに流した → 二重表示しない
    seen.add(r.id);
    if (r.id > lastId) lastId = r.id;
  }
  stat.recv++; updateTag();
  launchComment(r.text, r.color);
}

async function initLastId() {
  // 起動時に直近5件を流す（OBSで開いた／更新した瞬間に動作が分かるように。開始時の賑わいにも）
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/danmaku_comments?room=eq.' + encodeURIComponent(room) + '&select=id,text,color&order=id.desc&limit=5', { headers: HEADERS, cache: 'no-store' });
    if (res.ok) {
      const rows = await res.json();   // 新しい順に最大5件
      rows.reverse();                   // 古い順に並べ直して流す
      for (const r of rows) showComment(r);
    }
  } catch (e) { console.warn(e); }
}

let polling = false, lastPollAt = 0;
async function poll() {
  const now = Date.now();
  if (polling || now - lastPollAt < 1500) return;   // 多重実行・連打を防止
  polling = true;
  stat.poll++; updateTag();
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/danmaku_comments?room=eq.' + encodeURIComponent(room) + '&id=gt.' + lastId + '&order=id.asc&select=id,text,color', { headers: HEADERS, cache: 'no-store' });
    if (res.ok) { const rows = await res.json(); for (const r of rows) showComment(r); }
  } catch (e) { console.warn(e); }
  finally { polling = false; lastPollAt = Date.now(); }
}

// 見回りを複数の駆動源で回す（どれかが生きていれば新着が届く）。poll()内で重複実行は防いでいる。
function startPolling() {
  // (1) 描画ループ駆動 … OBSは映像出力のため常に描画する＝OBSが非アクティブでも止まらない（本命）
  let lastRaf = 0;
  function rafTick(ts) {
    if (ts - lastRaf >= 2000) { lastRaf = ts; poll(); }
    requestAnimationFrame(rafTick);
  }
  requestAnimationFrame(rafTick);
  // (2) 通常タイマー … 前面のときの保険
  setInterval(poll, 2000);
  // (3) Web Workerタイマー … 環境により裏でも回ることがある保険
  try {
    const blob = new Blob(['setInterval(function(){postMessage(0)},2000)'], { type: 'application/javascript' });
    const worker = new Worker(URL.createObjectURL(blob));
    worker.onmessage = function() { poll(); };
  } catch (e) {}
}

// Realtime（届けば即時表示）。使えなくても見回りが拾うので、状態表示だけ更新する。
function startRealtime() {
  try {
    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    sbClient
      .channel('danmaku-' + room)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'danmaku_comments', filter: 'room=eq.' + room },
        function (payload) { if (payload.new) showComment(payload.new); }
      )
      .subscribe(function (status) { stat.rt = status; updateTag(); });
  } catch (e) {
    stat.rt = 'なし'; updateTag();
    console.warn('Realtime unavailable (polling continues)', e);
  }
}

updateTag();
initLastId().then(() => {
  startPolling();   // ← 描画ループ駆動。OBSが裏でも止まらない本命
  startRealtime();  // ← 使えれば即時表示の補助
});

// ===== スライド画像（ローカルのPNGを読み込む。ネットに上げる必要なし）=====
const slideBox = document.getElementById('slide');
let slides = [], cur = 0;
function showSlide() {
  if (!slides.length) {
    slideBox.innerHTML = '<div class="empty">スライド画像をここにドラッグ＆ドロップ<br>または左上の「スライドを読み込む」で選択</div>';
    return;
  }
  slideBox.innerHTML = '';
  const img = document.createElement('img');
  img.src = slides[cur];
  slideBox.appendChild(img);
}
function loadFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  slides = files.map(f => URL.createObjectURL(f));
  cur = 0; showSlide();
}
document.getElementById('fileInput').addEventListener('change', e => loadFiles(e.target.files));
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files); });

// ===== ボタン・キーボード操作 =====
const qrwrap = document.getElementById('qrwrap');
const panel = document.getElementById('panel');
function toggleFs() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
document.getElementById('qrBtn').addEventListener('click', () => qrwrap.classList.toggle('big'));
document.getElementById('hideBtn').addEventListener('click', () => panel.classList.add('hidden'));
document.getElementById('fsBtn').addEventListener('click', toggleFs);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { if (cur < slides.length - 1) { cur++; showSlide(); } }
  else if (e.key === 'ArrowLeft') { if (cur > 0) { cur--; showSlide(); } }
  else if (e.key === 'q' || e.key === 'Q') { qrwrap.classList.toggle('big'); }
  else if (e.key === 'f' || e.key === 'F') { toggleFs(); }
  else if (e.key === 'h' || e.key === 'H') { panel.classList.toggle('hidden'); }
  else if (e.key === 'c' || e.key === 'C') { layer.innerHTML = ''; }
});

// ===== OBS用 透明モード（URLの最後に ?transparent=1 を付けると有効）=====
// 背景を透明にし、スライド枠と操作パネルを隠す。弾幕（とQR）だけが残るので、
// OBSのブラウザソースに入れると、PowerPointの画面の上に文字だけが重なります。
if (params.get('transparent') === '1') {
  document.documentElement.style.background = 'transparent';
  document.body.style.background = 'transparent';
  slideBox.style.display = 'none';      // スライド枠は不要（PowerPointはOBS側で映すため）
  panel.classList.add('hidden');        // 操作パネルを隠す
  qrwrap.classList.remove('big');       // QRは隅に小さめで残す（学生の投稿入口）
}
</script>
</body>
</html>
